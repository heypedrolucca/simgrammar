id: 2026-10-24-catalog-ga
type: run
date: '2026-10-24'
actor: agent
operator: yoheinakajima
agent:
  model: claude-opus-5-5
  harness: Claude app subagent
purpose: Verify, characterize, and decompose city-builder lineage games into mechanics.
method: >-
  Read AGENTS.md, CONTRACT.md sections 1-3, the game, common, source, and run schemas, every vocab the game schema
  references, rubrics.yaml, edge_types.yaml, and the RimWorld exemplars. Listed all mechanic ids and opened mechanic
  files whose scope was unclear (walker-service-delivery, population-strata, land-value, rci-demand, hydrology,
  procedural-build-assist, policy-toggles, elections, interest-groups, async-shared-region, milestone-unlocks,
  service-coverage, hauling-jobs, and others). For each of 30 games, fetched the English Wikipedia article and, where
  Wikipedia was thin or the game was in early access, the Steam store page (Banished, Manor Lords, Townscaper, Tiny Glade,
  Against the Storm, Timberborn, Foundation, Workers and Resources, Songs of Syx, Farthest Frontier, Kingdoms and
  Castles); used PCGamingWiki for Against the Storm storefront dates and Guinness World Records for the Utopia date
  claim. Reused existing shared sources (src-wikipedia-hamurabi, -simcity-1989, -simcity-2000, -simcity-2013,
  -caesar-iii, -frostpunk, -frostpunk-2, src-hopkins-2008-micropolis, src-cifaldi-2012-glassbox-engine,
  src-bvschaik-2026-julius, src-paradox-2023-cs2-traffic-ai, src-anno1800wiki-2026-needs and -population,
  src-paradoxwikis-2026-skylines-education, src-amielanczyk-2023-timberborn-water,
  src-thompson-2022-how-townscaper-works) and created 35 new sources after an existence check. Set year to first public
  release including early access. Scored emergence and influence against rubric anchors, taking the lower anchor when
  between two. Mechanic notes use only facts in the cited sources or in existing mechanic definitions that cite them;
  where a detail could not be confirmed it was left out. The shared web search budget ran out partway through, so
  remaining checks used WebFetch on already-surfaced pages only.
