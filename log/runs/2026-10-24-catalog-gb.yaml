purpose: Verify, characterize, and decompose colony, survival, and god games into mechanics.
method: 'Read AGENTS.md, CONTRACT.md sections 1-3, the game, common, source, and run schemas, every vocab
  file the game schema references, rubrics.yaml, edge_types.yaml, and the rimworld exemplar. Verified
  first public release, 1.0 year, developer, and platforms for all 17 games with WebFetch against English
  Wikipedia articles and, where Wikipedia was thin, Steam store pages and the developer site (Bugbyte).
  Pulled mechanic specifics and numbers from community wikis: Oxygen Not Included (morale, germs; existing
  thermal conductivity, liquid pipe, and natural gas generator sources), Dwarf Fortress (stress; existing
  legends source), Prison Architect (needs), PZwiki (moodles), The Long Dark (condition), Don''t Starve
  (hounds; existing hunger and day-night sources), and Valheim (building stability). Reused existing sources
  for dwarf-fortress, prison-architect, the-long-dark, oregon-trail, populous, and black-and-white rather
  than duplicating them, and checked existence immediately before creating 30 new source files. Chose
  mechanics only from the 168 ids listed by scripts/find.py --list mechanic, opening mechanic files where
  scope was unclear; marked core only for identity-defining systems and wrote implementation notes using
  sourced numbers. Scored emergence and influence against rubric anchors (Dwarf Fortress is the named
  anchor for 5 on both; Populous for influence 5 as the first god game). Changed terra-nil subgenre from
  ecosystem-evolution to city-builder (secondary ecosystem-evolution) because it is a reverse city builder
  with no population or evolution model, and marked subnautica as a boundary case because its map, story,
  and progression are authored. WebSearch budget ran out partway; one late Steam fetch hit the hourly
  fetch limit, so a few supporting details below rest on contributor knowledge.'
