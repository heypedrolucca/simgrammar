notes: 'Corrections to skeletons: species-alre year 2018 -> 2012 (free public alpha), developer ''Quasar (Sam Harrison)''
  -> ''Quasar'' (name unverified); equilinox year 2019 -> 2018 (Steam release 2018-11-23); suck-up developer kept
  as Proxima Enterprises, year 2023 with full release 2025. Five works are boundary_case true (ai-dungeon, infinite-craft,
  suck-up, whispers-from-the-star): their only simulated state is model text or a generated recipe graph. The two
  research demos are production_tier academic and cite their papers (src-park-2023-generative-agents, src-altera-2024-project-sid).
  Low-confidence facts: Whispers from the Star platforms are listed as PC only (the Steam page lists only Windows;
  mobile versions were not verified); Suck Up! first public date; SimLife mechanism detail is thin in its only source.
  influenced_by left empty where lineage was not documented in fetched sources (e.g. Spore from SimEarth or SimLife,
  Plague Inc. from Pandemic 2, which is not in the catalog).'
