proposals:
  - kind: split
    target: structural-integrity
    detail: >-
      Three update rules ship independently under this one id: connectivity-to-ground checks (Dwarf Fortress cave-ins,
      Teardown), per-connection support decay (Valheim), and solved member stress (Poly Bridge). Connectivity-only
      appears without the other two in many games. Consider splitting into a connectivity-support mechanic and a
      load-stress mechanic if game tagging shows the distinction matters. The entry is completed as one mechanic for now.
  - kind: other
    target: falling-sand-materials
    detail: >-
      falling-sand-materials overlaps material-interactions (reaction rules) and fluid-gas-simulation (liquid and gas
      movement). It passes the admission test as the per-cell movement rule (powders fall, liquids spread, gases rise by
      density swaps), and the entry is written that way. A specializes edge was not added because no parent fits cleanly;
      the orchestrator may want a specializes or synergy decision in the global pass.
  - kind: other
    target: voxel-destruction
    detail: >-
      voxel-destruction and structural-integrity share the connectivity-after-removal rule. Suggest a requires or
      synergy edge from voxel-destruction to structural-integrity in the global pass if connectivity support is kept
      under structural-integrity.
  - kind: other
    target: zoning
    detail: >-
      zoning likely has a hard dependency on rci-demand or land-value in most implementations, but some games (Cities:
      Skylines districts, Songs of Syx) zone without a demand meter, so no requires edge was added. Flagging for the
      synergy and tension pass.
notes: >-
  Families unchanged. Sourced (19): decoration-beauty, design-performance-rating, modular-assembly,
  procedural-build-assist, room-recognition, structural-integrity, terraforming, zoning, falling-sand-materials,
  flight-aerodynamics, fluid-gas-simulation, heat-transfer, material-interactions, orbital-mechanics, rigid-body-physics,
  soft-body-deformation, terrain-deformation, vehicle-dynamics, voxel-destruction. Asserted (3): adjacency-scoring,
  free-placement, vertical-layers. Valheim support colors are from a mobalytics guide that was read but not filed as a
  source, so Valheim appears in structural-integrity without a citation. Facts stated from knowledge without a fetched
  source, worth checking: Civilization VI district adjacency examples; Islanders placement preview; Dwarf Fortress water
  depth 1-7; Kerbin 600 km radius; Factorio Space Age elevated rails; Half-Life 2 Havok gravity gun (2004); Armored Core
  weight and energy limits; Divinity Original Sin surfaces; Minecraft falling sand and gravel; the Magic Formula
  expression. src-stam-2003-real-time-fluid-dynamics gives GDC 2003 as venue from common citation; the Autodesk page does
  not name the venue. E017 is expected on all 22 mechanics until catalog runs tag games.
