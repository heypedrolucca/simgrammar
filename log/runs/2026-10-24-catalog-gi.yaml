id: 2026-10-24-catalog-gi
type: run
date: '2026-10-24'
actor: agent
operator: yoheinakajima
agent:
  model: claude-opus-5-5
  harness: Claude app subagent
purpose: Verify, characterize, and decompose grand-strategy, political, military, and MMO-world simulations
  into mechanics.
method: >-
  Read AGENTS.md, CONTRACT.md sections 1-3, the game, source, run, and common schemas, every vocab file the game
  schema references, rubrics.yaml, edge_types.yaml, and the rimworld exemplars. Verified release dates, developers,
  and platforms for 19 games from their Wikipedia articles (fetched 2026-10-24), plus the Steam store pages for
  Command: Modern Operations and Eco, the Positech blog for Democracy 4 console platforms, and Giant Bomb and a
  MetaFilter post for Aurora, which has no Wikipedia article (the Aurora redirect goes to the Starfire board game
  article). Picked mechanics only from scripts/find.py --list mechanic, scored emergence and influence against the
  rubric anchors (taking the lower anchor when between two), and added influenced_by only where a source documents
  lineage. Before writing each source, checked that it did not exist; cited the existing sources src-wikipedia-reigns,
  src-wikipedia-eve-online, src-wikipedia-democracy-4, src-wikipedia-eco-2018, src-wikipedia-command-modern-operations,
  src-wikipedia-technology-tree, src-wikipedia-sid-meier, and the Paradox dev diary and wiki sources from taxonomy
  runs. Deleted my own duplicate src-wikipedia-eco-2018-video-game after finding src-wikipedia-eco-2018 for the same
  URL. The web search budget ran out after the core fetches, so a few details (Aurora's first year, Eco 1.0 status)
  rest on fewer sources than ideal.
