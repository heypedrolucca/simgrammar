contract_version: '1.0'
proposals:
- kind: other
  target: fire-spread
  detail: >-
    fire-spread overlaps material-interactions (physics-materials), whose summary uses fire burning wood as its example.
    Keep fire-spread for propagation of a burning state across fuel cells driven by wind and moisture, and keep
    material-interactions for pairwise element-material rules such as Breath of the Wild's chemistry engine. The
    orchestrator may want a tension or synergy edge and should check the two definitions do not drift together.
- kind: other
  target: pollution-spread
  detail: >-
    pollution-spread and byproducts-waste overlap at emission. Proposed boundary: byproducts-waste owns production of
    secondary outputs as items or stocks that must be handled; pollution-spread owns the spatial field and its diffusion,
    absorption, and effects. Both pass the admission test on their own (Factorio has pollution without waste items;
    Oxygen Not Included has waste items with separate gas simulation).
- kind: split
  target: variable-speed
  detail: >-
    Pause and speed multipliers usually ship together, but auto-pause rules (pause on raid or letter) appear in some games
    as a separate lever. Not proposing a split now; recording that auto-pause could become its own mechanic if several
    games are tagged with it as a distinct feature.
- kind: new-mechanic
  target: action-points
  detail: >-
    Per-turn action points (X-COM, Advanced Squad Leader, Frozen Synapse-style tactical sims) are a per-turn budget distinct
    from daily-action-budget (per in-game day) and from turn-structure (ordering and phases). If the catalog includes
    tactical simulations, an action-points mechanic in time-pacing or control-automation would pass the admission test.
notes: >-
  Web search budget for the turn ran out mid-research, so habitat-suitability (Planet Zoo, Zoo Tycoon, Anno fertilities)
  and some game facts are from contributor knowledge: Minecraft 20-minute day, Pharaoh yearly Nile flood, Civilization
  global warming, Eco sea-level rise, Surviving Mars Green Planet terraforming, Cities: Skylines water and sewage pollution,
  Persona time slots, Nintendogs voice commands, Seaman speech, Majora's Mask three-day moon, Far Cry 2 grass fire. The
  Lofgren and Fefferman paper was read through secondary summaries because PubMed blocked fetching. src-thumbsticks-2017-botw-chemistry
  does not describe fire spread itself; the fire-spread definition's claim that burning grass makes updrafts and rain stops
  fire is from contributor knowledge of the game. Relations added: creature-care and survival-meters specialize
  needs-decay. No family changes. E017 remains on several of my mechanics because few games are tagged yet; maturity reflects
  real-world adoption per the task brief.
