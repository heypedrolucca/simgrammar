purpose: Complete the mechanic analyses for the environment-ecology, biology-health, and time-pacing families.
method: >-
  Read AGENTS.md, CONTRACT.md sections 1-3, the mechanic and common schemas, every referenced vocab, rubrics, edge types,
  and the needs-decay, rimworld, and src-wikipedia-rimworld exemplars. Listed mechanics and games, read neighboring skeletons
  (material-interactions, heat-transfer, fluid-gas-simulation, random-disasters, renewable-regrowth, crop-cultivation,
  daily-schedules, diagnose-repair) to keep boundaries clean. Searched and fetched primary or canonical sources for the
  mechanics where facts mattered most: Kermack and McKendrick 1927, Lofgren and Fefferman 2007, and the Corrupted Blood and
  Plague Inc. articles (contagion); the GDC 2017 Breath of the Wild session and press coverage of its chemistry rules (fire
  spread); Volterra 1926 (food web); the 2023 Game Developer deep dive on Timberborn water (hydrology); Watson and Lovelock 1983
  and SimEarth (planetary climate); the Factorio wiki pollution page and Lua API map settings (pollution spread); Don't Starve,
  Stardew Valley, RimWorld, and The Long Dark wiki or encyclopedia pages for day-night, weather, animals, energy, hunger,
  health, and time; a Journal of Geek Studies interview with Project Hospital's lead programmer and Theme Hospital (diagnosis);
  Hamurabi, The Oregon Trail, and the Wikipedia time-keeping taxonomy (turns, ticks, pause). Wrote all 21 files with a
  scratch generator that checked field lengths, vocab terms, relation targets, and banned tokens before writing. Scored
  against rubric anchors, taking the lower level when between anchors. Cited existing shared sources (Stardew Valley,
  Tamagotchi, Theme Hospital, Frostpunk, Micropolis) rather than rewriting them. Set status sourced where cited sources
  support the named game facts; habitat-suitability stays asserted.
