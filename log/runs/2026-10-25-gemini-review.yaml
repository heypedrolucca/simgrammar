id: 2026-10-25-gemini-review
type: run
kind: maintenance
date: '2026-10-27'
actor: agent
operator: yoheinakajima
agent:
  model: claude-opus-5-5
  harness: Claude app (cloud workspace), orchestrator; reviewers gemini-3.1-pro-preview (Gemini API), meta/muse-spark-1.3 and openai/gpt-5.3-codex (OpenRouter)
purpose: Have models from three other labs review the paper, the contribution rules, and the PR-scope code cold, verify each finding, and act on the ones that hold (ADR-0007).
method: >-
  Sent three outside models the public repository's paper, analysis parameters, governance documents, and scope-check
  scripts, then checked every finding against the data or code before acting. gemini-3.1-pro-preview (paper and rules):
  section 5.4 read as contradicting its table because today's three new games moved the rule's pick from 24 to 19 inside
  the 0.02 tolerance (now states both); section 8.2's family-size claim was false per mechanic (rewritten, pinned);
  p-value and null-model caveats added; verification runs only from invited authors; deprecations keep content; the
  operator signs off after reading the diff; offline fast-exit and new-domain notices in check_sources; seven candidate
  games. Tested and rejected: the leverage gap's dependence on the top mechanic (top 25 unchanged without it).
  meta/muse-spark-1.3 (same prompts): causal abstract wording for single-rater correlations (reworded), the 2000
  boundary (now in or before 2000), tension edges uncounted (counted), verification that leaves no trace (E034 now needs
  a quote on every claim of a verified record), rewording a sourced claim without evidence (now an E039 error), an
  undefined re-check (defined), invitees blocked by the different-model rule (documented). Rejected: that the contract
  lets code win (it says the code is the bug). openai/gpt-5.3-codex (scripts): a PR could credit a merged run with a
  review it never did (a PR now appends only its own run), run-only PRs passed if they touched another file (need an
  invited author), the sign-off check matched text anywhere (now a trailer line, case-insensitive), repeated claim text
  escaped the quote rule (counted), content types matched case-sensitively, and the E021 and E029 texts disagreed with
  the code (texts corrected; a two-word E021 gap flagged a rubric value, so the one-word gap stays). Each new scope rule
  was unit-tested on constructed before-and-after records. The reviews ran on 2026-10-25 under contract 1.1; the
  run is dated and versioned for 2026-10-27, when it was rebased onto main under 1.2. The ADR became 0007, since 0006
  went to the visual vocabulary, and the abstract's wording fixes were applied to the rewritten second finding.
scope:
  - report/src/05-structure.md, report/src/08-impact.md
  - scripts/pr_scope.py, scripts/check_sources.py, .github/workflows/check.yml
  - CONTRACT.md (E039 text), AGENTS.md, CONTRIBUTING.md, tasks/humans-with-agents.md, .github/PULL_REQUEST_TEMPLATE.md, tasks/candidates.yaml
contract_version: '1.2'
proposals:
  - kind: other
    target: report/analysis.yaml
    detail: >-
      Replace the white-space independence null with one that preserves each game's mechanic count (expected
      co-occurrence summed over games, with each game's chance of holding a mechanic proportional to its size), then
      re-pin section 5.5. Raised by the Gemini review; the current table can overstate gaps between mechanics that live
      in small games.
  - kind: new-mechanic
    target: bounty-driven-task-allocation
    detail: >-
      Gemini review: players post rewards that autonomous agents weigh against their own goals instead of receiving
      orders (Majesty; partial in RimWorld). Check against unit-commands and designation-orders before a taxonomy run.
  - kind: new-mechanic
    target: noise-propagation
    detail: >-
      Gemini review: sound as a spatial field that decays with distance and walls and affects agents or land value
      (Cities: Skylines, Oxygen Not Included). Check against pollution-spread, which may already cover it.
  - kind: new-mechanic
    target: physical-carry-capacity
    detail: >-
      Gemini review: carrying limited by weight and volume of the agent's body or vehicle (Project Zomboid, Kenshi).
      Check against storage-buffers and hauling-jobs.
  - kind: new-mechanic
    target: fluid-chemistry
    detail: >-
      Gemini review: fluids or gases that react when mixed, producing new substances, heat, or explosions (Noita, Oxygen
      Not Included). Check against fluid-gas-simulation and material-interactions.
  - kind: other
    target: data/techniques
    detail: >-
      Gemini review suggested techniques the set lacks: LLM-written reward functions for RL agents (Eureka, Ma et al.,
      2023), single-image 3D reconstruction fast enough for runtime use (InstantMesh, Xu et al., 2024), and open audio
      generation for reactive sound (Stable Audio Open, Stability AI, 2024). Citations are the model's own and unverified;
      a technique run confirms each against its paper before adding it.
