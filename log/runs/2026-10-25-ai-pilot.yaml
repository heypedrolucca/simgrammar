purpose: Run four AI agents through the contributor flow end to end and fix what their friction logs found (ADR-0005).
method: >-
  Spawned four agents in separate git worktrees, each given one task built by scripts/make_tasks.py (archive-sources,
  source-claims, store-ids, catalog-game) and only the repository docs. Each reported its diff, check output, and a
  friction log. Reproduced the main finding: with the catalog pilot's three games, the section 5.5 assertion on
  embodied-skill-control and free-placement failed because the mechanic fell under the 8 percent bar. Replaced the share with
  a fixed count equal to the old bar at 174 games, confirmed the white-space table is byte-identical, and stress-tested by
  adding the three pilot games plus 5, 10, and 20 duplicated games in scratch copies: no assertion failed, whereas the
  old rule failed with the pilot games alone. Made rank references to rows that left a table fail as E029 with the
  cause. Opened the store-ids and source-claims pilot PRs. CI resolved all eight Steam ids. It found 26 of 32 quotes,
  warned on five unreachable or DOI-only pages, and failed one. That failing AlphaEvolve quote is present in the
  rendered page and its raw HTML in a browser, and a rerun of the check found it; the check now refetches once before
  failing a quote, and FAIL messages say where a quote stops matching. Spot-checked two warned quotes in a browser: the OpenAI structured-outputs quote is on the page,
  and the cited Sony AI article url now returns 404. Rewrote four briefs, AGENTS.md, CONTRIBUTING.md, and the task
  generator from the friction logs.
