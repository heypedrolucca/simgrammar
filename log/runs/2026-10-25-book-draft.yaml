id: 2026-10-25-book-draft
type: run
kind: synthesis
date: '2026-10-25'
actor: agent
operator: yoheinakajima
agent:
  model: claude-opus-5-5
  harness: Claude app (cloud workspace), orchestrator with six forked agents (four drafting, two fact-checking); Gemini editorial read; ElevenLabs scratch speech
purpose: Draft the whole book (13 chapters) and the video series (12 episode scripts, 12 shorts, the mega
  video cut) as checked projections of the dataset, under a house style that bans the habits of machine-written
  prose.
method: >-
  Wrote book/STYLE.md and book/tells.yaml (stock words, setup phrases, contrast frames, signposting, em dashes,
  narration that ends on a question) and scripts/style_check.py, which make check and CI run over book/src and
  media. Rewrote chapter 1 and episode 1 to lead with findings instead of the pause mechanic, and short 1 to state
  one finding in its first sentence; every short now carries one finding. Added the stats and derived fields the
  chapters cite to analyze.py, including a chance test for the share of mechanics seen by 2000: shuffling first-seen
  years across games (seeded) gives that share or more 11 percent of the time, so the book and episodes no longer
  say the vocabulary was set early; chapter 3 presents the test. The orchestrator wrote the preface, chapters 1 and
  2, episode 1, and short 1; four forked agents drafted chapters 3 to 13 and episodes 2 to 12 in pairs from the
  records, the analysis, and the sources the records cite, with every number a token and every interpretive sentence
  asserted. The orchestrator then removed repeated facts (each now has one home chapter), applied a Gemini read of
  14 chapters and 24 scripts (signposting, setup sentences, slogans), and had two agents check every literal claim
  in the chapters and scripts against the records without editing. They found 26 book and about 60 script lines
  that drifted from or went beyond a record (for example inZOI's model described as replacing need scoring, Project
  Sid's thousand agents, DLSS 5's launch blamed for its reveal's reception, Game of Life said to have no turns), and
  pictures that could pass for game UI; all were rewritten to the record or labelled as graphics. A second read while publishing the chapters fixed dangling references to parts and a glossary the book does not have, and a few more claims the records do not support. Wrote the film's
  assembly, chapter times, opening, and two bridges as checked prose in media/mega, and listed all 66 titles the
  scripts show in media/rights.yaml (all unchecked). Short 1's scratch narration was generated with ElevenLabs; the
  takes stay in the operator's ElevenLabs flow because the workspace cannot download them. Episode timings come from
  narration at 135 words a minute: the episodes run 9 to 13.5 minutes, about 2 hours 20 minutes in all, and the
  book is about 35,000 words against the plan's 70,000.
scope:
  - book/src, book/STYLE.md, book/tells.yaml, media/episodes, media/shorts, media/mega, media/rights.yaml
  - scripts (analyze, build, lib, style_check), report/analysis.yaml, Makefile, .github/workflows/check.yml
contract_version: '1.1'
proposals:
  - kind: other
    target: report/src/00-abstract.md
    detail: >-
      The abstract's finding 2 and section 5.2 say the vocabulary was set early because pct_mechanics_seen_by_2000 is
      high. A shuffle of first-seen years across games gives that share or more 11 percent of the time
      (p_mechanics_seen_by_2000), so the share mostly reflects how many catalog games predate 2000. Add the chance
      test to section 5.2 and soften or drop the finding in the abstract.
  - kind: other
    target: data/games/cities-skylines.yaml
    detail: >-
      Legibility mechanics look under-tagged: Cities: Skylines has traffic, pollution, and land-value overlays but no
      data-overlays tag. A pass over data-overlays, causal-tooltips, and stats-dashboards
      across the catalog would change chapter 5's counts.
  - kind: other
    target: media/rights.yaml
    detail: >-
      All 66 titles are unchecked. Read each publisher's video policy and record it before any footage is captured
      for release; the scripts also call for a teletype, a Façade still, and research footage (Generative Agents,
      DIAMOND, Genie) that need their own permission.
  - kind: other
    target: scripts/analyze.py
    detail: >-
      The fact-check's most common fix was a sentence about which genres use a mechanic ("city builders are the
      largest group among the crop games"), which no assertion can check today. Add a derived field per mechanic
      with its subgenre counts so those sentences can carry an assertion.
