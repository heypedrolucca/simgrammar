  src-wikipedia-poly-bridge, src-steam-2026-poly-bridge, src-wikipedia-besiege, src-wikipedia-garrys-mod,
  src-wikipedia-teardown, src-wikipedia-the-powder-toy, src-powdertoy-2026-official-site, src-wikipedia-noita,
  src-wikipedia-zelda-breath-of-the-wild, src-wikipedia-the-incredible-machine, src-wikipedia-minecraft.
  Reused src-wikipedia-ftl. Uncertain facts: Poly Bridge 1.0 date conflicts on Wikipedia (12 June vs 12
