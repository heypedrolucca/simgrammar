purpose: 'Draw the video series'' pictures from one dithered visual vocabulary: icons as code in media/visual, Frame lines in the scripts, frame
  templates in the renderer, and the checks on them; first cut on episode 1 and shorts 1, 4, 5 and 7, then every episode, short, and the film.'
method: 'Phases 1-3: sorted the 228 Picture lines into frame templates (plan approved 2026-10-26); wrote ADR-0006 and contract 1.2 (E040, E041,
  W108, I16, in scripts/visual/check.py); drew icons as a checked SVG subset, dithered by an 8x8 Bayer matrix at 3 and 4 px per dither pixel; wrote
  the Frame grammar, a resolver that reads every number from dist/entities, stats.json, or vocab, eleven templates with motion, and toy simulations of
  record rules; vendored IBM Plex (the proxy refused Google Fonts); wrote Frame lines for every episode, short, and the film''s own scenes; three
  agents drew 197 icons from a brief and the merge redrew seven. Phase 4: counted 1,242 frame elements with no icon across 57 ids in the renders''
  states.json, drawn as blank tiles (242 of them, the 11 risk terms of a tally set as text, never showed): 41 mechanics frames take from games''
  parts, 11 technique risks, 4 bet horizons, and the contested status. Drew the 57, labelled the terms from vocab/risk.yaml and vocab/horizon.yaml
  under risk- and horizon- prefixes (TERM_ICON in framedata.py), and added E042: build.py resolves every Frame line against the build with the
  renderer''s own resolver and stops on an element with no icon (with four icons removed it named 14 frames). Two agents drew the other 53 mechanics,
  so all 199 have icons and W108 is silent; redrew six weak icons and gave crowd.svg''s figures arms. A layout check of every frame state in
  render.html found three captions that lost their last line and frames running past the stage into the header or caption; the caption splitter now
  halves a part over 190 characters, and show() redraws an overflowing frame a size step smaller. Rendered all 25 videos and encoded them with ffmpeg
  6.1: every length equals the drafts'' to the millisecond (the film 5034.2 s) and the blank-tile scan is 0. Failed or left: a phase-2 edit dropped
  the scene loop (fixed); the first phase-3 render skipped builds longer than their first state (builds now carry on); ffmpeg 9.0 ended 14 videos up
  to 0.2 s late, so they were encoded again with 6.1 (assemble.py names the binary); two phase-4 renders were stopped to take the layout fixes; long
  chain notes end in an ellipsis by design; list labels cannot hold commas; pr-check against origin/main reports E039 for the book-draft run this
  branch carries from book/full-draft-signed (against that base it passes).'
