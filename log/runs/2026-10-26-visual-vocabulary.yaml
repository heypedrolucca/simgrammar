purpose: 'Draw the video series'' pictures from one dithered visual vocabulary: icons as code in media/visual, Frame lines in the scripts,
  frame templates in the renderer, and the checks on them; first cut on episode 1 and shorts 1, 4, 5 and 7.'
method: 'Surveyed the 228 Picture lines of the episodes, shorts, and film and sorted them into frame templates (the plan Yohei approved
  on 2026-10-26). Wrote ADR-0006 and contract 1.2: rules E040 (Frame lines), E041 (icons), W108 (coverage) and invariant I16, implemented
  in scripts/visual/check.py and called from validate.py. Drew 79 icons as a checked SVG subset (scripts/visual/raster.py) and built
  them into dist/visual through an 8x8 Bayer dither (dither.py) at 3 and 4 px per dither pixel; build.py now writes binary outputs and
  Pillow is pinned. Wrote the Frame grammar (frames.py), the resolver that reads every frame number from dist/entities, stats.json,
  or rubrics.yaml (scripts/video/framedata.py), ten templates (templates.js), and two deterministic toy simulations of record rules
  (toysim.py: Oxygen Not Included''s tile heat exchange, Factorio''s chunk diffusion with the record''s 2% above 15). render.html now
  loads IBM Plex from media/fonts (SIL OFL 1.1) instead of Google Fonts, which the workspace proxy refused during this run, uses lowercase
  mono labels, and shows a one-line chip while a frame is up; render.js stops on a missing face or image. Added Frame lines to episode
  1 and shorts 1, 4, 5, and 7 and re-rendered those five videos with the recorded takes: a timing fingerprint taken before any change
  (per-scene state durations and the narration track''s sha256) matches after it for all five. Failed or left: the first preview showed
  the scene loop dropped by an edit (fixed); signs on loop arrows and same-year timeline items needed layout fixes; motion (dissolves,
  drawn arrows, counters) is phase 3; the other eleven episodes, eight shorts, and the film still show cards until their scripts gain
  Frame lines.'
scope:
- decisions/ADR-0006-visual-vocabulary.md, CONTRACT.md, CHANGELOG.md, AGENTS.md, LICENSE, schema (contract 1.2), requirements.txt
- scripts/visual (raster, dither, icons, frames, toysim, check), scripts/build.py, scripts/rules.py, scripts/validate.py, scripts/style_check.py
- scripts/video (framedata.py, templates.js, render.html, render.js, timeline.py, parse.py, assemble.py)
- media/visual (vocab.yaml, icons, README.md), media/fonts, media/episodes/01-same-parts.md, media/shorts 001, 004, 005, 007
contract_version: '1.2'
proposals: []
