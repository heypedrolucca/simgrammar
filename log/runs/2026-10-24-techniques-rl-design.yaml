id: 2026-10-24-techniques-rl-design
type: run
date: '2026-10-24'
actor: agent
operator: yoheinakajima
agent:
  model: claude-opus-5-5
  harness: Claude app subagent
purpose: Research and record reinforcement learning, game-theoretic, procedural generation, and automated
  design and playtesting techniques that change simulation game mechanics.
method: >-
  Read AGENTS.md, CONTRACT.md sections 1-3, the technique, source, run, and common schemas, the vocab files they
  reference, the trl rubric, and the exemplar files. Listed mechanics, games, and techniques and ran find.py for MCTS,
  RL, level generation, WFC, and playtesting before each file to avoid duplicates (none in this area existed; peer runs
  cover Genie, physics-based character control, mean field games, AlphaEvolve). The shared web search budget was used
  up after one query, so 2025-2026 checks were made by fetching primary pages directly: arXiv abstract and HTML pages
  (MuZero, EfficientZero, DreamerV3, Dreamer 4, POET, Enhanced POET, OMNI-EPIC, PCGRL, ARLPCG, MarioGPT, LLM Sokoban,
  Word2World, GAVEL full text, Ludii, VGDL generation, MAP-Elites, PCG-QD, MESB, CMA-ME Mario, DSAGE, QDAIF, DeepStack,
  ReBeL, DeepNash, Student of Games, Richelieu, EA and Ubisoft playtesting and navigation papers, Unity ML-Agents),
  Crossref records for journal metadata (DreamerV3 Nature 2025, Libratus, DeepNash, Student of Games, MCTS survey,
  UCT, Browne and Maire), PubMed for Cicero, official blogs and pages (DeepMind MuZero-RC and SIMA 2, Facebook
  Pluribus, Meta Cicero and its GitHub repo, Polyphony and Sony AI GT Sophy news 2023-2025, EA SEED publications index
  and match-3 paper), the WFC repository, Karth and Smith FDG 2017, Boris the Brave's WFC explainer, the Caves of Qud
  Steam page, and Wikipedia for MuZero, MCTS, Pluribus, and Infinite Craft. Web fetch then hit its hourly limit. Created
  11 techniques (9 candidates plus monte-carlo-tree-search as the shared search primitive and deep-rl-npc-policies to
  hold GT Sophy and learned navigation, the clearest shipped RL-in-game result). Wrote affects edges mechanic by mechanic
  from what each cited result changes; set maturity and trl for games only (e.g., WFC trl 8 core in Townscaper, GT Sophy
  trl 7 selectable rival). Infinite Craft's cached LLM crafting results are already covered by the llm-agents run's
  llm-rule-adjudication, so automated-rule-generation was scoped to offline whole-rule-set generation (Ludii, GAVEL,
  VGDL) to avoid a duplicate edge set. A SIMA 2 blog source this run created duplicated the llm-agents run's
  src-deepmind-2025-sima-2-blog (same URL), so citations were repointed to theirs and the duplicate deleted. deployed_in
  lists only games present in data/games (townscaper); Gran Turismo 7, Caves of Qud, Bad North, Total War: Rome II,
  Candy Crush, The Sims Mobile, and Battlefield 2042 are absent, so recorded as proposals instead.
scope:
  - data/techniques/monte-carlo-tree-search.yaml
  - data/techniques/model-based-planning-muzero.yaml
  - data/techniques/imperfect-information-solvers.yaml
  - data/techniques/cicero-strategic-dialogue.yaml
  - data/techniques/open-ended-environment-generation.yaml
  - data/techniques/wave-function-collapse.yaml
  - data/techniques/quality-diversity-search.yaml
  - data/techniques/learned-level-generation.yaml
  - data/techniques/automated-rule-generation.yaml
  - data/techniques/automated-playtesting.yaml
  - data/techniques/deep-rl-npc-policies.yaml
  - data/sources/* (57 new sources with provenance.created of this run)
contract_version: '1.0'
proposals:
  - kind: other
    target: deep-rl-npc-policies
    detail: >-
      deployed_in gran-turismo-7 once a Gran Turismo 7 (2022) game entity exists. data/games has only gran-turismo
      (1997), which does not contain GT Sophy. Sources: src-polyphony-2023-gt-sophy-race-together,
      src-polyphony-2023-gt-sophy-2, src-sony-2025-gt-sophy-2-1.
  - kind: other
    target: wave-function-collapse
    detail: >-
      deployed_in caves-of-qud and bad-north if those games are admitted (both list WFC per
      src-gumin-2016-wavefunctioncollapse and src-karth-2017-wfc-constraint-solving; Caves of Qud is a simulation-heavy
      roguelike with 1.0 on 2024-12-05 per src-steam-2024-caves-of-qud).
  - kind: other
    target: monte-carlo-tree-search
    detail: >-
      deployed_in total-war-rome-2 if admitted as a game (MCTS in high-level campaign AI per
      src-wikipedia-monte-carlo-tree-search; primary AiGameDev coverage could not be fetched, site blocked).
  - kind: other
    target: automated-playtesting
    detail: >-
      Candidate game entities for deployed_in: The Sims Mobile (career balancing, src-zhao-2019-winning-isnt-everything),
      Candy Crush Saga (src-gudmundsson-2018-human-like-playtesting). Both are boundary cases for the game admission test;
      orchestrator should decide.
  - kind: other
    target: open-ended-environment-generation
    detail: builds_on genie-world-models (SIMA 2 trains and is evaluated in Genie 3 generated worlds).
  - kind: other
    target: open-ended-environment-generation
    detail: builds_on generalist-game-agents (SIMA 2's self-improvement loop runs on that agent).
  - kind: other
    target: automated-playtesting
    detail: builds_on generalist-game-agents (instruction-following screen agents are the emerging playtest substrate).
  - kind: other
    target: automated-rule-generation
    detail: >-
      Scope boundary with llm-rule-adjudication (llm-agents run): that entity owns runtime LLM-resolved, cached
      interaction rules (Infinite Craft); this one owns offline generation of whole rule sets verified by self-play.
      A builds_on edge is not proposed because the lineages differ.
  - kind: other
    target: deep-rl-npc-policies
    detail: builds_on massively-parallel-simulation (RL controllers are trained on many parallel simulator instances).
  - kind: other
    target: automated-rule-generation
    detail: >-
      Report note, not an edge: GAVEL and alphaevolve-algorithm-discovery both use LLMs as mutation operators inside
      evolutionary search with automated evaluators.
  - kind: other
    target: cicero-strategic-dialogue
    detail: >-
      Consider an affects edge from the llm-agents run's natural-language NPC techniques to faction-diplomacy; Cicero is
      the strongest evidence that dialogue must be grounded in a planner to stay consistent with actions.
  - kind: new-mechanic
    target: difficulty-ramp
    detail: >-
      A level or stage difficulty curve tuned against pass and churn rates (match-3, puzzle, scenario ladders) recurs in
      the playtesting literature but no mechanic covers it; adaptive-threat-scaling and scenario-objectives were used as
      closest targets. Taxonomy run should decide whether it passes the admission test for simulation games.
notes: >-
  Market and adoption facts (sources created here; cite in report as needed):
  src-polyphony-2023-gt-sophy-2: a deep RL opponent became a permanent selectable rival in a mainstream simulation
  racing game (GT7, Nov 2023), covering nine tracks and 340 cars, the clearest shipped RL-NPC result.
  src-sony-2025-gt-sophy-2-1: by March 2025 GT Sophy moved into Custom Race with 19 options and adjustable tire and fuel
  consumption, showing incremental per-content rollout.
  src-gillberg-2023-rl-testing-aaa: EA used RL test agents on Battlefield 2042 and Dead Space (2023); integration, not
  algorithms, was the main cost.
  src-zhao-2019-winning-isnt-everything: EA reports deep RL effort scales roughly linearly with number of games because
  of per-game tuning.
  src-gudmundsson-2018-human-like-playtesting: King uses player-imitation agents for Candy Crush difficulty prediction.
  src-facebook-2019-pluribus-blog: superhuman six-player poker blueprint cost under $150 of cloud compute and plays on
  two CPUs, so equilibrium AI is cheap once abstracted.
  src-facebookresearch-2022-diplomacy-cicero: Cicero weights are non-commercial and the repo was archived 2025-04-17.
  src-deepmind-2025-sima-2: game-playing agents trained with partner studios (Valheim, Satisfactory, No Man's Sky, Space
  Engineers, Eco, Teardown) remain a research preview as of Nov 2025.
  Uncertain facts: Bad North tile count (over 300) and Townscaper silent failure come from secondary coverage
  (src-thompson-2022-how-townscaper-works); Total War: Rome II MCTS use is sourced only via Wikipedia. Gaps from
  exhausted search: no 2025-2026 check for newer commercial MCTS or RL-NPC titles beyond GT Sophy, Steam generative-AI
  disclosure counts, or newer PCGRL and LLM level-generation papers (2025-2026).
