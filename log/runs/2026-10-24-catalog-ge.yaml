notes: 'Facts to re-check when verifying: Lemonade Stand''s 1973 mainframe origin is flagged on Wikipedia as failing verification;
  Mini Metro year uses the 2013 alpha (Ludum Dare prototype and free web version), with 1.0 in 2015; Offworld early access
  began 2015-02-12 per GamesBeat (pre-launch article), 1.0 2016-04-28; Motorsport Manager entry covers the 2016 PC game (a
  different 2014 iOS game shares the name); Football Manager year is 2004 (FM 2005). Football Manager platforms include PSP
  and Switch; OOTP is PC-only here though a mobile spin-off exists. Planet Zoo, RCT, Zoo Tycoon, and Game Dev Tycoon mechanic
  notes partly come from general knowledge after the shared search budget ran out; they avoid numbers not in sources. Existing
  source src-openrct2-2026-ride-breakdowns is not cited because it documents RCT2 code.'
