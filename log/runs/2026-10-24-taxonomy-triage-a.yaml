method: 'Read AGENTS.md, CONTRACT.md sections 1-3, the mechanic and common schemas, the vocab files they reference,
  rubrics.yaml, edge_types.yaml, and the exemplars needs-decay, rimworld, and src-wikipedia-rimworld. Pulled the original
  new-mechanic proposals from catalog-gc (aspiration-wants, background-life-progression, branching-development), catalog-gd
  (combination-discovery), catalog-ge (advertising-awareness, negotiation, dated-tech-timeline, board-confidence), catalog-gh
  (megaproject-sink, welfare-currency), catalog-gi (political-capital, corruption-leakage, culture-religion-conversion),
  taxonomy-m1 (delivery-time-payment), taxonomy-m3 (stress-accumulation), and techniques-llm-agents. Read the neighboring
  mechanics named in the task (needs-decay, career-ladder, milestone-unlocks, lifecycle-aging, autonomy-levels, mood-breakdown,
  memories-thoughts, creature-care, trait-inheritance, budget-treasury, policy-toggles, taxation, stability-unrest, population-strata,
  customer-value-choice, staff-hiring, faction-diplomacy, contracts-orders, vehicle-route-scheduling, elections, scenario-objectives,
  tech-tree, hand-crafting, generative-content, goods-consumption) plus interest-groups, reputation, god-powers, collection-goals,
  and product-development, and wrote each definition to name the state it owns and what separates it from them. Applied
  the four admission tests; all fourteen pass. Merged welfare-currency into political-capital as instructed (Unity is
  an alias and a worked example). No web search (budget exhausted): cited only existing data/sources files whose notes
  support the definition''s factual claims, recorded those as claims, and set status sourced where they do. culture-religion-conversion
  and dated-tech-timeline are asserted because no existing source covers their core rule (missionary conversion; dated
  model introduction). Read every candidate game file before tagging and wrote tags to the scratchpad file triage_tags_taxonomy-triage-a.yaml;
  skipped games where the mechanic is covered by an existing tag or I could not confirm it. Considered requires edges
  (care-dependent-development to lifecycle-aging, delivery-time-payment to vehicle-route-scheduling, advertising-awareness
  to customer-value-choice, megaproject-sink to production-chain) and rejected each as not strictly necessary in every
  game; no edges added. Scores assigned by anchor text, lower anchor when between two.'
