  target: crusader-kings-3, dwarf-fortress, mood-breakdown
  detail: 'Both games tag mood-breakdown core with notes that describe stress, not mood. Suggest replacing mood-breakdown
    with stress-accumulation on crusader-kings-3 (it has no mood meter), and on dwarf-fortress keeping mood-breakdown
    only if its note is rewritten around emotions and tantrums. The Dwarf Fortress stress sentence in mood-breakdown''s
    definition could then move to stress-accumulation.'
- kind: other
  target: infinite-craft, hand-crafting
  detail: infinite-craft tags hand-crafting core, but it has no workstations, costs, or known recipe list, and hand-crafting's
    definition mentions Infinite Craft. Suggest replacing that tag with combination-discovery core and trimming the Infinite
    Craft sentence from hand-crafting.
- kind: other
  target: vehicle-route-scheduling, creature-care
  detail: vehicle-route-scheduling's definition and levers describe Transport Tycoon's delivery-time pay, now owned by
    delivery-time-payment; creature-care's lever and dynamic about care quality shaping the adult form are now owned by
    care-dependent-development. Suggest trimming both in a later pass.
- kind: other
  target: game design_notes
  detail: Game files still refer to the old proposal ids background-life-progression (the-sims-3, the-sims-4, inzoi) and
    branching-development (tamagotchi, princess-maker-2), and to "proposal political-capital" or welfare currency (democracy-4,
    europa-universalis-4, captain-of-industry). They should be repointed to offscreen-life-progression, care-dependent-development,
    and political-capital when the tags are applied.
notes: 'Tag confidence. Medium or low, from designer knowledge only: railroad-tycoon delivery-time-payment (I recall pay
  depending on transit time but could not source it); inzoi offscreen-life-progression (city-wide free will may be full
  simulation rather than a cheaper off-screen model); noita combination-discovery (seed-specific Lively Concoction and Alchemic
  Precursor recipes); big-ambitions advertising-awareness; stellaris corruption-leakage (empire size raising costs, which
  stretches the corruption label). Considered and skipped: paralives aspiration-wants (wants are documented, a reward meter
  is not); minecraft combination-discovery (covered by hand-crafting); euro-truck-simulator-2 delivery-time-payment (deadline
  contracts, already covered by contracts-orders); tropico-6 corruption-leakage (embezzlement, not a leak of state revenue);
  surviving-mars megaproject-sink (wonders are single costly buildings, not staged sinks). Core tags used: the-sims-2 aspiration-wants,
  dwarf-fortress and crusader-kings-3 stress-accumulation, princess-maker-2 care-dependent-development, europa-universalis-4
  political-capital, infinite-craft combination-discovery, dyson-sphere-program megaproject-sink. Every mechanic has two
  or more tagged games.'
