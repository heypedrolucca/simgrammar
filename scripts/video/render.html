<div id="hd"><div class="l"></div><div class="r"></div></div>
<div id="main"><div id="os"></div><div id="stage"></div></div>
<div id="chip"></div><div id="cap"></div><div id="ft"></div>
<script>
const MAT = ["research","prototype","shipped niche","shipped mainstream"];
const esc = s => String(s ?? "").replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
let NCOL = 199, NGAME = 177, MAXN = 83, FIGDIR = "";
function code(row){ const on = new Map(row.map(([c,k]) => [c,k])); let h = ""; for (let i = 0; i < NCOL; i++){ const k = on.get(i); h += `<b style="background:${k === undefined ? "transparent" : k ? "var(--ink)" : "var(--cell)"}"></b>`; } return `<div class="code">${h}</div>`; }
function card(c, on){
  let h = "";
  if (c.kind === "game") h = `<div class="kind">game</div><div class="nm">${esc(c.name)}</div><div class="meta">${esc(c.year)} · ${esc(c.dev)}<br>${esc(c.sub)}</div>${code(c.row)}<div class="meta">${c.n} mechanics · ${c.core} core</div><div class="sum">${esc(c.summary)}</div>` + (c.rare.length ? `<div class="lab" style="margin-top:6px">rarest core parts</div><div class="lst">${c.rare.map(([n,k]) => `${esc(n)} <span>· ${k} ${k === 1 ? "game" : "games"}</span>`).join("<br>")}</div>` : "");
  else if (c.kind === "mechanic") h = `<div class="kind">mechanic · ${esc(c.family)}</div><div class="nm">${esc(c.name)}</div><div class="big">${c.n}<small>of ${NGAME} games</small></div><div class="bar"><i style="width:${Math.max(1.5, 100 * c.n / MAXN)}%"></i></div><div class="meta">first seen ${esc(c.year)}${c.first ? " · " + esc(c.first) : ""}</div><div class="sum">${esc(c.summary)}</div>`;
  else if (c.kind === "technique") h = `<div class="kind">ai technique${c.year ? " · " + esc(c.year) : ""}</div><div class="nm" style="font-size:38px">${esc(c.name)}</div><div class="sum">${esc(c.summary)}</div><div class="lad">${MAT.map(m => `<div class="${m === c.maturity ? "on" : ""}">${m}</div>`).join("")}</div><div class="meta" style="margin-top:auto">reproducibility: ${esc(c.det)}</div>`;
  else if (c.kind === "bet") h = `<div class="kind">bet · rank ${c.rank} of ${c.n}</div><div class="nm" style="font-size:40px">${esc(c.name)}</div><div class="sum">${esc(c.summary)}</div><div class="dots"><div>impact <span>${"●".repeat(c.impact)}${"○".repeat(5 - c.impact)}</span></div><div>feasibility <span>${"●".repeat(c.feas)}${"○".repeat(5 - c.feas)}</span></div><div>novelty <span>${"●".repeat(c.nov)}${"○".repeat(5 - c.nov)}</span></div></div><div class="meta" style="margin-top:auto">horizon ${esc(c.horizon)}</div>`;
  return `<div class="card${on ? " on" : ""}">${h}</div>`;
}
function chipOf(c){
  if (c.kind === "game") return `game · ${c.name} · ${c.year} · ${String(c.dev).toLowerCase()} · ${c.sub} · ${c.n} parts, ${c.core} core`;
  if (c.kind === "mechanic") return `mechanic · ${c.name} · ${c.family} · in ${c.n} of ${NGAME} games`;
  if (c.kind === "technique") return `ai technique · ${c.name} · ${c.maturity}`;
  return `bet · ${c.name} · rank ${c.rank} of ${c.n}`;
}
let GRID = null;  // {rows:[[col,core]...] per game oldest first, names:[], years:[], top:[col names]}
function drawGrid(spec){
