# Builds the projections and publishes the website (dist/web) with every other projection under /dist/.
# dist/ is not committed (ADR-0004); this workflow is the only place it is published from.
name: pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements.txt
      - name: Validate
        run: python scripts/validate.py
      - name: Build
        run: python scripts/build.py
      - name: Assemble the site
        run: |
          mkdir -p _site/dist
          cp -r dist/web/. _site/
          cp -r dist/tables dist/entities dist/graph dist/analysis dist/wiki dist/paper dist/site dist/manifest.json _site/dist/
          (cd dist && zip -qrX ../_site/dist/simgrammar-dist.zip tables entities graph analysis wiki paper manifest.json)
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
