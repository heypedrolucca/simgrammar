# Declarative table views for {{table:<name>}} tokens. Edit here, not in report prose.
# kinds: rows (entity, columns, filter, sort, limit, caption) | count-by (entity, field, vocab, label)
tables:
- name: games-by-subgenre
  kind: count-by
  entity: game
  field: subgenre
  vocab: subgenre
  label: Subgenre
- name: games-by-domain
