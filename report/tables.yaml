  field: category
  vocab: technique_category
  label: Category
- name: techniques-by-maturity
  kind: count-by
  entity: technique
  field: maturity
  vocab: technique_maturity
  label: Maturity in games
- name: techniques-by-risk
  kind: count-by
  entity: technique
  field: risks
  vocab: risk
  label: Risk
- name: top-mechanics
  kind: rows
  entity: mechanic
  columns:
  - name
  - family
  - path: _derived.prevalence
    label: games
  - path: _derived.core_count
    label: core in
  - path: _derived.earliest_year
    label: earliest
  - legibility
  - emergence_potential
  - ai_leverage
  sort:
  - -_derived.prevalence
  - name
  limit: 30
  caption: Most-used mechanics across the catalog. Scores are rubric anchors (1-5).
- name: most-emergent-games
  kind: rows
  entity: game
  columns:
  - name
  - year
  - subgenre
  - path: _derived.mechanic_count
    label: mechanics
  - emergence
  - influence
  sort:
  - -emergence
  - -influence
  - name
  limit: 20
