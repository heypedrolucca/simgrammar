id: rubrics
description: >-
  Anchored ordinal scales. Every ordinal field in a schema names one scale via `x-rubric`.
  Score by matching the anchor text, not by feel. When between two anchors, take the lower.
  Changing an anchor is a contract change (ADR + CONTRACT minor version bump) because it silently re-scores existing data.
scales:
  emergence:
    applies_to: game
    question: How much of play arises from system interaction rather than authored content?
    levels:
      1: Outcomes follow authored scripts or a single equation; replays look the same.
      2: A few interacting systems; variety comes mainly from parameters or content.
      3: Several coupled systems produce situations designers did not script; players tell stories about runs.
      4: Many coupled systems; surprising chains are routine and drive community discussion.
      5: Emergence is the product; players report histories no one could have authored (Dwarf Fortress tier).
  influence:
    applies_to: game
    question: How strongly did this game shape later simulation design?
    levels:
      1: Little documented influence.
      2: Influenced a niche or a few titles.
      3: Clearly influenced a subgenre's conventions.
      4: Defined or redefined a subgenre.
      5: Created a lineage or changed the medium (SimCity, The Sims, Dwarf Fortress tier).
  legibility:
    applies_to: mechanic
    question: How easily can a typical player form an accurate mental model of the mechanic from play?
    levels:
      1: Opaque; most players misunderstand causes even after many hours.
      2: Understood only through wikis or community analysis.
      3: Understood after deliberate attention and the game's info tools.
      4: Mostly intuitive; occasional surprises.
      5: Fully transparent at a glance.
  emergence_potential:
    applies_to: mechanic
    question: How much unscripted variety does this mechanic generate when coupled with others?
    levels:
      1: Deterministic and isolated; same input, same visible result.
      2: Some variation, mostly parametric.
      3: Interacts with other systems to produce unplanned situations.
      4: Frequently produces chains of consequences across systems.
      5: A primary engine of emergent stories wherever it appears.
  authoring_cost:
    applies_to: mechanic
    question: Developer cost of the content this mechanic consumes (animations, writing, assets, tuning data), per unit of player-facing variety.
    levels:
      1: Trivial; rules alone produce variety.
      2: Small data tables.
      3: Moderate bespoke content per variant.
      4: Large content pipelines (animation, writing, voice).
      5: Content cost is the main limit on the mechanic's depth.
  compute_cost:
    applies_to: mechanic
    question: Runtime compute at the scale the mechanic is typically used.
    levels:
      1: Negligible.
      2: Low; scales linearly with modest constants.
      3: Noticeable; a common source of late-game slowdown.
      4: Dominant cost; caps simulation scale.
      5: Requires specialized hardware or approximation to run at all.
  tuning_difficulty:
    applies_to: mechanic
    question: How hard is it to balance so the mechanic is neither trivial nor degenerate?
    levels:
      1: Self-balancing or irrelevant to balance.
      2: Few parameters, stable.
      3: Several interacting parameters; needs playtesting.
      4: Sensitive; small changes cause runaway loops or dominant strategies.
      5: Chaotic; balance is effectively never settled.
  ai_leverage:
    applies_to: mechanic
    question: Expert judgment of how much 2024-2026 AI techniques could change this mechanic's design ceiling (cross-checked by `affects` edges in analysis).
    levels:
      1: Little change expected.
      2: Incremental (tuning, assets).
      3: Notable change in cost or variety.
      4: Substantially new forms become feasible.
      5: The mechanic's definition changes.
  trl:
    applies_to: technique
    question: Technology Readiness Level for use in simulation games (NASA scale adapted).
    levels:
      1: Basic principle observed.
      2: Concept formulated for games.
      3: Proof of concept in research.
      4: Lab demo in a game-like environment.
      5: Validated in a playable prototype.
      6: Public playable demo or tech preview.
      7: Shipped in a commercial game as a minor feature.
      8: Shipped as a core feature of a commercial game.
      9: Standard practice across multiple shipped titles.
  novelty:
    applies_to: opportunity
    question: How far from shipped practice is this?
    levels:
      1: Incremental polish of an existing pattern.
      2: Known idea, rarely executed well.
      3: New combination with partial precedents.
      4: No shipped precedent; adjacent research exists.
      5: Would define a new category.
  feasibility:
    applies_to: opportunity
    question: Can a small team (5-15) ship it within 24 months using techniques at their current maturity?
    levels:
      1: Requires unsolved research.
      2: Possible only with large-lab resources.
      3: Feasible with significant R&D risk.
      4: Feasible with known techniques and normal risk.
      5: Prototype-able in weeks.
  impact:
    applies_to: opportunity
    question: If it works, how much does it change player experience or the market?
    levels:
      1: Minor quality improvement.
      2: Notable feature for one subgenre.
      3: Changes a subgenre's design ceiling.
      4: Enables a new subgenre or a large new audience.
      5: Changes simulation games broadly.
composites:
  opportunity_priority:
    description: Weighted geometric mean of impact, feasibility, novelty. Range 1-5. Computed in build; never stored.
    formula: impact^w_impact * feasibility^w_feasibility * novelty^w_novelty
    weights:
      w_impact: 0.45
      w_feasibility: 0.35
      w_novelty: 0.20
  technique_exposure:
    description: Per mechanic, sum over affecting techniques of maturity weight × effect weight. Computed in build.
    maturity_weights:
      research: 0.25
      prototype: 0.5
      shipped-niche: 0.75
      shipped-mainstream: 1.0
    effect_weights:
      replaces-substrate: 1.0
      enables-new: 1.0
      deepens: 0.75
      explains: 0.6
      cuts-authoring-cost: 0.5
      tunes: 0.4
      accelerates: 0.4
