id: horizon
description: Expected time until meaningful use in shipped simulation games, as judged at the entity's last review date.
terms:
  - id: now
    label: Now
    definition: Usable in a production title started today.
  - id: 1-2y
    label: 1-2 years
    definition: Needs one more generation of cost, latency, or tooling improvement.
  - id: 3-5y
    label: 3-5 years
    definition: Needs research progress plus tooling.
  - id: 5y-plus
    label: 5+ years
    definition: Speculative; depends on unsolved research problems.
