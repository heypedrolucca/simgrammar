summary: A free space 4X simulation by a single developer in which the player runs an interstellar empire
  through ship design from components, mineral mining, sensor-based detection, missile and beam combat,
  and named officers, with time advanced in steps from seconds to days.
year: 2004
developer: Steve Walmsley
