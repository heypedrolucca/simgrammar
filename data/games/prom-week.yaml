id: prom-week
type: game
name: Prom Week
summary: A 2012 browser social sim in which the player picks social exchanges among 18 high school students
  in the week before prom, with the Comme il Faut rule system deciding who wants to do what and how targets
  respond.
year: 2012
developer: UC Santa Cruz Expressive Intelligence Studio
platforms:
- web
subgenre: social-sim
sim_domain:
- social-interpersonal
player_role: overseer
agency_model:
- direct-unit
time_model: turn-based
sim_scale: household
fidelity: systemic
perspective: top-down-2d
win_structure: scenario-goals
failure_model: soft-recoverable
narrative_mode: hybrid
multiplayer:
- single
modding: none
production_tier: academic
agent_count_order: '10'
emergence: 3
influence: 2
core_loop: pick a level goal -> choose an initiator, a target, and a social exchange -> rules score volition
  and acceptance -> relationships, statuses, and history update -> new exchanges open -> the goal is met
  or the story turns another way
design_notes: 'Prom Week runs on Comme il Faut (CiF), which its UCSC authors describe as making social
  relationships playable: characters have traits, interests, statuses, and directed networks of liking,
  attraction, and respect, and more than 5,000 social considerations govern what each character wants
  and how others respond. The player never writes dialogue but chooses which social exchange a character
  initiates; CiF offers the exchanges a character is inclined toward, ranked by likelihood, and resolves
  acceptance from the social state of everyone involved, including what third parties think. Levels set
  story goals such as getting two characters to date, which turns the rule base into a puzzle with many
  solutions.'
mechanics:
- id: social-exchanges
  role: core
  note: Exchanges such as winking, being friendly, or being mean have preconditions; CiF rules decide
    whether the target accepts and update networks and statuses.
- id: relationship-values
  role: core
  note: Directed social networks track how much each character likes, is attracted to, and respects each
    other character; exchanges and third parties' opinions move the values.
- id: utility-action-selection
  role: supporting
  note: A character's volition for each exchange is scored from matching rules, and only exchanges it
    is inclined toward are offered, ranked by likelihood.
- id: personality-traits
  role: supporting
  note: Traits and interests weight which rules apply to a character.
- id: memories-thoughts
  role: supporting
  note: Social history is part of the social state that CiF simulates for each character.
- id: scenario-objectives
  role: supporting
  note: Each level sets social goals, such as getting two named characters to date.
