id: tamagotchi
type: game
name: Tamagotchi
summary: A 1996 keychain virtual pet whose hunger, happiness, and training meters run on a real-time clock,
  and whose care quality determines which adult form it grows into and how long it lives.
year: 1996
developer: Bandai
platforms:
- dedicated-device
