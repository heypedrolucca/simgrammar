sim_domain:
- biological-ecological
player_role: caretaker
agency_model:
- caretaking-interaction
time_model: real-world-clock
sim_scale: individual
fidelity: abstract
perspective: device-lcd
win_structure: survival-duration
failure_model: hard-restart
narrative_mode: none
multiplayer:
