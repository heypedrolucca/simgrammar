core_loop: write and commit JavaScript -> each tick the script reads room state and issues orders -> creeps
  harvest energy for spawns, extensions, and the controller -> controller levels unlock structures ->
  claim and defend rooms against other players' code -> profile and rewrite code within the CPU limit
design_notes: 'Screeps removes direct control entirely: the only input to the persistent world is the
  player''s main module, which the server runs once per tick against a fixed snapshot, queuing commands
  that resolve together at tick end, so the colony keeps acting while the player is offline. Computation
  is the scarce resource: each tick has a CPU limit (20 without CPU Unlock, otherwise rising with Global
  Control Level to 300), with unused CPU banked in a 10,000-unit bucket that allows bursts of up to 500.
  Creeps are designed in code as bodies of up to 50 parts (WORK, CARRY, MOVE, ATTACK, RANGED_ATTACK, HEAL,
  CLAIM, TOUGH) that set cost, ability, and fatigue, and they die after 1,500 ticks, so a colony is a
  replacement pipeline. Room Controller Levels 1 to 8 unlock structures and decay if not fed energy, and
  every player''s AI meets the others in shared 50x50 rooms, so strategy is emergent competition between
  programs. The server is open source and runnable privately.'
mechanics:
- id: player-programming
  role: core
  note: Players write JavaScript (or C, C++, Rust, Go, C#, and others via WebAssembly) whose main loop
    runs every tick under a per-tick CPU limit with a 10,000-unit bucket; globals reset between ticks
    and actions resolve together at tick end.
- id: persistent-world
  role: core
  note: Official shards run continuously with ticks every 2 to 5 seconds, so colonies harvest, build,
    and fight while their owners are offline; rooms link through exits and shards through portals.
- id: modular-assembly
  role: core
  note: Code spawns creeps from up to 50 body parts of eight types; part counts set harvest, carry, attack,
    and heal rates, MOVE parts offset fatigue of 1, 2, or 10 per part on road, plain, or swamp, and each
    part has 100 hits.
- id: resource-extraction
  role: core
  note: WORK parts harvest energy from sources that refill every 300 ticks, and extractors at RCL 6 mine
    minerals for labs and the market.
- id: tech-tree
  role: core
  note: Energy spent on a room controller raises its level from 1 to 8 at cumulative costs up to 10.9
    million, unlocking spawns, extensions, towers, storage, links, labs, terminal, factory, observer,
    and nuker; unfed controllers downgrade and become neutral.
- id: raid-defense
  role: supporting
  note: Towers, ramparts, and walls defend rooms against other players and NPC invaders, and a newly placed
    first spawn grants safe mode.
- id: player-driven-market
  role: supporting
  note: Terminals post public buy and sell orders priced in credits with a 5% order fee; the party executing
    a deal pays an energy cost that grows with distance, and NPC terminals sit at highway crossroads.
- id: agent-pathfinding
  role: supporting
  note: Movement costs are 1 on roads, 2 on plains, and 10 on swamps, and route searches consume the player's
    CPU, so caching paths is a core optimization.
- id: wear-breakdown
  role: supporting
  note: Roads and other structures lose hits over time and must be repaired by creeps.
- id: lifecycle-aging
  role: supporting
  note: Every creep dies after 1,500 ticks, so code must schedule replacements before roles go unfilled.
- id: modding-api
  role: supporting
  note: The open-source private server supports mods and community servers that change rules and tick
    rates.
- id: execution-budget
  role: core
  note: Each tick has a CPU limit (20 without CPU Unlock), unused CPU banks in a bucket of up to 10,000,
    a tick may burst to 500, and scripts are terminated at the limit, so pathfinding and caching strategies
    are shaped by CPU cost.
