id: screeps
type: game
name: Screeps
summary: A persistent MMO strategy game in which players control colonies only by writing JavaScript that
  the server runs every tick, directing creeps assembled from body parts to harvest energy, upgrade room
  controllers, trade, and fight other players' code under a CPU budget.
