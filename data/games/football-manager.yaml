id: football-manager
type: game
name: Football Manager
aliases:
- Worldwide Soccer Manager
summary: A football club management series in which the player sets tactics, training, transfers, and
  finances while a match engine simulates games from the attributes of players drawn from a researched
  database of real footballers.
year: 2004
developer: Sports Interactive
