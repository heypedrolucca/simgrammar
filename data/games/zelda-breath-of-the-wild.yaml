id: zelda-breath-of-the-wild
type: game
name: 'The Legend of Zelda: Breath of the Wild'
aliases:
- Breath of the Wild
- BotW
summary: >-
  An open-world action adventure whose physics and chemistry engines let fire, wind, electricity, temperature, and material
  properties combine, so puzzles and fights accept solutions the designers did not script.
year: 2017
developer: Nintendo EPD
