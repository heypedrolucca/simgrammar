id: simcity-4
type: game
name: SimCity 4
summary: A city builder in which several cities share a region map and trade utilities, while zones develop
  by density and wealth level and a commute model routes trips across roads and transit.
year: 2003
developer: Maxis
platforms:
- pc
subgenre: city-builder
sim_domain:
- urban
- economic
player_role: planner-mayor
agency_model:
- zoning-placement
- policy-parameter
time_model: real-time-pausable
sim_scale: city
fidelity: systemic
perspective: isometric
win_structure: open-sandbox
failure_model: soft-recoverable
narrative_mode: emergent
multiplayer:
- single
modding: content
production_tier: aaa
agent_count_order: aggregate
emergence: 3
influence: 2
core_loop: terraform in God mode -> zone residential, commercial, industrial land at a density and connect
  roads -> wealth-level demand and desirability grow buildings -> set taxes and per-building service funding
  -> trade power, water, and garbage with neighbor cities -> grow the region
design_notes: SimCity 4 splits each zone type by wealth level, so demand and desirability are tracked
  per class and neighborhoods can decay or gentrify as conditions change. Cities of 1 to 4 km per side
  sit in a region and exchange water, electricity, and garbage disposal through neighbor deals, letting
  several specialized cities depend on each other; this single-player region has no exact match in the
  taxonomy (see run proposal). Its commute model drew praise from urban planner Jeff Speck, and the Building
  Architect Tool (2004) sustained a content community for over two decades.
mechanics:
- id: zoning
  role: core
  note: Residential, commercial, and industrial zones at low, medium, and high density, with agriculture
    as a separate industrial zone; buildings need road frontage.
- id: rci-demand
  role: core
  note: Demand is reported separately for each wealth level of residents and for commercial and industrial
    subtypes.
- id: land-value
  role: core
  note: Desirability is computed separately for each wealth level, so the same lot attracts different
    classes as services and nuisances change.
- id: traffic-congestion
  role: core
  note: Commuters route trips over roads, rail, and transit; Rush Hour adds traffic flow tracing, avenues,
    and elevated rail.
- id: population-strata
  role: supporting
  note: Buildings belong to wealth levels and size stages; areas decay or gentrify.
- id: public-transit
  role: supporting
  note: Bus, subway, and rail stations carry commuters; Rush Hour adds elevated rail.
- id: budget-treasury
  role: supporting
  note: Civic buildings need ongoing funding set per building.
- id: taxation
  role: supporting
  note: Tax rates per zone type and wealth level.
- id: service-coverage
  role: supporting
  note: Schools, hospitals, police, and fire buildings cover areas; they lose output and gain maintenance
    cost as they age.
- id: policy-toggles
  role: supporting
  note: City ordinances with monthly costs and effects.
- id: terraforming
  role: supporting
  note: God mode reshapes terrain; most terraforming locks once a city is founded.
- id: random-disasters
  role: supporting
  note: God mode triggers disasters on the city.
- id: advisors
  role: supporting
  note: Mayor mode advisors comment on problems and suggest actions.
- id: pollution-spread
  role: supporting
  note: Industry and traffic pollute and reduce desirability.
- id: variable-speed
  role: supporting
- id: free-placement
  role: supporting
