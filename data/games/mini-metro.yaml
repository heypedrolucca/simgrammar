id: mini-metro
type: game
name: Mini Metro
summary: >-
  A minimalist subway-design game where the player draws and redraws lines between shape-coded stations under a weekly ration
  of trains and tunnels until a station overcrowds.
year: 2013
year_full_release: 2015
developer: Dinosaur Polo Club
