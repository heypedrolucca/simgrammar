core_loop: >-
  new stations appear -> draw or reroute lines -> trains carry shape-matched passengers -> weekly grant of new assets -> demand
  outgrows capacity -> a station overcrowds and the run ends
design_notes: >-
  Mini Metro abstracts a metro network into station shapes, passengers drawn as the shape of the station type they want to
  reach, and a scarce inventory of lines, locomotives, tunnels, and bridges. New stations keep appearing while supply arrives
  only as a weekly grant, so the player keeps redrawing a network that is always under capacity. Failure is local and visible:
  a station over its limit (typically six passengers) for long enough ends the run. Modes vary the rules: Extreme fixes lines
  once placed, Endless removes overcrowding, and Creative is a sandbox.
mechanics:
- id: public-transit
  role: core
  note: >-
    The player draws colored lines between stations and assigns trains that load and unload automatically; ridership is the
    score.
- id: service-queues
  role: core
  note: >-
    Passengers wait at stations with limited capacity, typically six; interchanges raise capacity and loading speed, and a
    station overcrowded too long ends the game.
- id: agent-pathfinding
  role: supporting
  note: Passengers ride to any station of their target shape, transferring between lines when needed.
- id: periodic-ticks
  role: supporting
  note: >-
    Each in-game week grants extra rolling stock and a choice of assets such as tunnels, bridges, new lines, or interchanges.
- id: variable-speed
  role: supporting
  note: Time can be paused to reroute lines or move trains.
