id: game-of-life
type: game
name: Conway's Game of Life
aliases:
- Life
- Game of Life
summary: A zero-player cellular automaton on an infinite square grid in which each cell lives or dies by the B3/S23
  neighbor-count rule, producing gliders, oscillators, and universal computation from a seeded pattern.
year: 1970
developer: John Horton Conway
platforms:
- mainframe-early
