id: surviving-mars
type: game
name: Surviving Mars
summary: A Mars colony city builder in which drones build power, water, and oxygen networks before colonists
  with traits arrive in domes, while research, Earth sponsors, and dust storms, meteors, and cold waves
  shape survival.
year: 2018
developer: Haemimont Games
platforms:
- pc
- console
subgenre: city-builder
subgenre_secondary:
- colony-sim
sim_domain:
- urban
- cosmic-space
- planetary-natural
player_role: planner-mayor
agency_model:
- zoning-placement
- indirect-incentive
time_model: real-time-pausable
sim_scale: settlement
fidelity: stylized
perspective: free-3d
win_structure: open-sandbox
failure_model: cascading-collapse
narrative_mode: hybrid
multiplayer:
- single
modding: scripting
production_tier: aa
agent_count_order: '100'
emergence: 3
influence: 1
core_loop: land rockets with drones and prefabs -> drones build power, water, and oxygen infrastructure
  -> build domes and bring colonists from Earth -> colonists' traits, comfort, and sanity drive work and
  stability -> research and export rare metals for funding -> weather disasters and Mysteries
design_notes: 'Surviving Mars splits construction from population: drones working within range of hubs
  build and maintain everything, and colonists arrive only after domes have power, water, and oxygen.
  Colonists carry traits, flaws, and specializations and track morale, comfort, sanity, and health, so
  dome services decide whether they work, turn Earthsick, or rebel. Mysteries layer authored storylines
  (plagues, rival corporations, AI revolts, alien contact) on top of disasters such as dust storms, meteors,
  and cold waves.'
mechanics:
- id: power-grid
  role: core
  note: Generators and batteries feed cable networks to domes and buildings; a dome without power, water,
    or oxygen cannot sustain colonists.
- id: fluid-pipe-network
  role: core
  note: Water and oxygen travel by pipe from extractors and producers to domes.
- id: hauling-jobs
  role: core
  note: Drones within a hub's range carry resources, build, and maintain buildings.
- id: tech-tree
  role: core
  note: Research spans physics, engineering, social, biotechnology, and robotics fields.
- id: service-coverage
  role: supporting
  note: Drone hubs and dome services serve within a range.
- id: personality-traits
  role: supporting
  note: Colonists have traits, flaws, and specializations that suit them to jobs.
- id: needs-decay
  role: supporting
  note: Comfort, sanity, health, and morale change with services and events.
- id: mood-breakdown
  role: supporting
  note: Unhappy colonists may become Earthsick or rebels.
- id: random-disasters
  role: supporting
  note: Dust storms, meteor storms, cold waves, and dust devils.
- id: wear-breakdown
  role: supporting
  note: Buildings need drone maintenance to keep working.
- id: planetary-climate
  role: supporting
  note: Green Planet (2019) adds terraforming of atmosphere, temperature, and water.
- id: triggered-event-chains
  role: supporting
  note: Mysteries run storylines such as plagues, rival corporations, AI revolts, and alien contact.
- id: resource-extraction
  role: supporting
  note: Metals, rare metals, concrete, and water are extracted; rare metal exports fund imports.
- id: variable-speed
  role: supporting
- id: free-placement
  role: supporting
- id: modding-api
  role: supporting
  note: 'An official mod editor with Lua scripting.'
