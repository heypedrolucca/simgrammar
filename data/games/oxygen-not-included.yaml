id: oxygen-not-included
type: game
name: Oxygen Not Included
aliases:
- ONI
summary: A side-view colony sim in which a few duplicants survive inside an asteroid where every tile
  holds an element with mass and temperature, so air, liquids, heat, and germs flow through the base.
year: 2017
year_full_release: 2019
developer: Klei Entertainment
platforms:
- pc
subgenre: colony-sim
subgenre_secondary:
- survival-sim
sim_domain:
- physical-mechanical
- biological-ecological
- industrial-logistics
player_role: overseer
agency_model:
- order-queue
- zoning-placement
- indirect-incentive
- programmatic
time_model: real-time-pausable
sim_scale: settlement
fidelity: systemic
perspective: top-down-2d
win_structure: open-sandbox
failure_model: cascading-collapse
narrative_mode: emergent
multiplayer:
