  - sports
player_role: operator-pilot
agency_model:
  - direct-avatar
time_model: real-time
sim_scale: individual
fidelity: high-fidelity
perspective: third-person
win_structure: campaign
failure_model: soft-recoverable
narrative_mode: authored
multiplayer:
  - single
  - competitive
modding: none
production_tier: aaa
agent_count_order: "10"
emergence: 2
influence: 3
core_loop: buy or tune a car -> race against AI or players -> earn credits -> expand the collection -> harder events
design_notes: >-
  Included because it is the clearest shipped case of a learned opponent in a simulation game. GT Sophy, trained with
  model-free deep reinforcement learning on parallel simulator instances, became selectable as a permanent rival in
  2023 and was extended to custom races in 2025, one content update at a time.
mechanics:
  - id: vehicle-dynamics
    role: core
    note: Tire, suspension, aerodynamics, and drivetrain models per car; tuning parts and settings change handling.
  - id: embodied-skill-control
    role: core
    note: Racing lines, braking points, and throttle control on wheel or pad decide results; GT Sophy is trained to the same physics.
  - id: collection-goals
    role: supporting
  - id: career-ladder
    role: supporting
  - id: scenario-objectives
    role: supporting
  - id: weather
    role: supporting
