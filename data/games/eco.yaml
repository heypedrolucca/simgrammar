id: eco
type: game
name: Eco
summary: A multiplayer civilization survival game in which players on one server share a simulated ecosystem,
  specialize in skills, craft and trade with player-made currencies, and pass enforceable laws while researching
  how to stop a meteor due in thirty days without wrecking the environment.
year: 2018
developer: Strange Loop Games
