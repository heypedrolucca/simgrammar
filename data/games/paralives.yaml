core_loop: design Parafolks in the Paramaker -> build a grid-less home -> Parafolks pursue needs and wants
  -> socialize, work, and build skills around town -> relationships, children, and aging change the household
  -> share homes and Parafolks on the Workshop
design_notes: 'Paralives began as Alex Massé''s solo project, was funded through Patreon (over 15,000
  supporters by November 2023), and entered Steam early access on 2026-05-25 with about two years planned
  before 1.0. Its building tools are its most distinctive system: walls and furniture resize, recolor,
  and stack, walls can curve, floors can split level, and a road-style wall tool was inspired by Cities:
  Skylines. Conversation fills a together bar that unlocks together cards, multiselect lets several Parafolks
  act as a group, and procedural animation adapts to preceding animations.'
