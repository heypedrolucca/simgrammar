id: mule
type: game
name: M.U.L.E.
summary: >-
  A four-player economic strategy game on a colony planet where players outfit M.U.L.E. robots to produce food, energy, smithore,
  and crystite and trade them in real-time auctions.
year: 1983
developer: Ozark Softscape
platforms:
- mainframe-early
- pc
- console
subgenre: business-economic-sim
sim_domain:
- economic
- industrial-logistics
player_role: manager-owner
agency_model:
- direct-avatar
- zoning-placement
time_model: turn-based
sim_scale: settlement
fidelity: stylized
perspective: top-down-2d
win_structure: competitive-victory
failure_model: soft-recoverable
narrative_mode: none
multiplayer:
- single
