id: motorsport-manager
type: game
name: Motorsport Manager
summary: A racing team management game in which the player designs car parts across seasons, hires drivers
  and staff, and makes live strategy calls on tyres, pit stops, and weather while races are simulated.
year: 2016
developer: Playsport Games
