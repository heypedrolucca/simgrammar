id: townscaper
type: game
name: Townscaper
summary: A town-building toy in which clicking colored blocks onto an irregular grid lets a wave function collapse
  solver assemble houses, arches, stairways, bridges, and gardens, with no goals or resources.
year: 2020
year_full_release: 2021
developer: Oskar Stålberg
