id: princess-maker-2
type: game
name: Princess Maker 2
summary: A raising sim in which the player, as a father figure, schedules a daughter's training, part-time
  jobs, rest, and adventures from age 10 to 18, and her accumulated attributes decide one of 74 endings.
year: 1993
developer: Gainax
platforms:
- pc
