core_loop: paint residential, road, patrol, and forestry zones -> villagers build homes inside them -> assign workers
  and production chains -> trade with neighbors and pay taxes -> advance Labor, Clergy, or Kingdom estates -> assemble
  monuments from parts
design_notes: 'Foundation separates intent from layout: the player paints areas for homes, roads, patrols, and forestry,
  and housing appears inside them without a grid. Major buildings are not fixed footprints but assemblies of parts,
  so a monument''s function and capacity follow from the modules chosen. Progress runs along three estates, which
  can be specialized or combined.'
