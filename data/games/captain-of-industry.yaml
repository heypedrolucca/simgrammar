id: captain-of-industry
type: game
name: Captain of Industry
summary: An industrial colony builder in which the player reshapes island terrain with excavators and
  trucks, runs production chains to feed, house, and power a settlement, and spends the Unity its satisfied
  population generates on edicts, quick builds, and world-map expansion.
year: 2022
developer: MaFi Games
platforms:
- pc
subgenre: factory-automation
subgenre_secondary:
- city-builder
sim_domain:
- industrial-logistics
- urban
- economic
player_role: engineer-designer
agency_model:
- zoning-placement
- order-queue
- policy-parameter
time_model: real-time-pausable
sim_scale: settlement
fidelity: systemic
perspective: free-3d
win_structure: open-sandbox
failure_model: cascading-collapse
narrative_mode: none
