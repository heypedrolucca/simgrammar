id: gran-turismo
type: game
name: Gran Turismo
summary: A PlayStation racing game that paired a tuned handling model and 140 production cars with license tests,
  prize credits, and parts tuning in a Simulation mode career.
year: 1997
developer: Polys Entertainment (Polyphony Digital)
platforms:
- console
subgenre: vehicle-sim
sim_domain:
- physical-mechanical
- sports
