id: schedule-i
type: game
name: Schedule I
summary: >-
  A first-person crime business sim in which the player grows and cooks drugs, mixes ingredients to create products with effects
  customers want, sells them around a city under police pressure, and automates production with hired staff.
year: 2025
developer: TVGS
