id: the-powder-toy
type: game
name: The Powder Toy
aliases:
- TPT
summary: >-
  An open-source falling-sand sandbox where hundreds of elements interact cell by cell under simulated air pressure, heat,
  gravity, and electricity.
year: 2008
developer: The Powder Toy contributors
platforms:
- pc
- mobile
- web
subgenre: physics-sandbox
sim_domain:
- physical-mechanical
- computational-abstract
player_role: observer-gardener
agency_model:
- design-then-test
- policy-parameter
time_model: real-time-pausable
sim_scale: micro
fidelity: stylized
perspective: top-down-2d
win_structure: open-sandbox
failure_model: none
narrative_mode: none
