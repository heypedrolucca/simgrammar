core_loop: accept a job -> pick nozzle and soap -> wash surfaces -> per-part progress reaches 100 percent -> job
  pays -> buy washer upgrades -> next job
design_notes: 'The simulation is a per-surface dirt state: each surface carries layers (dirt, grime, lichen, moss,
  rust) that the spray removes according to nozzle, soap, and range, and every object reports its percentage done.
  Four nozzles trade power against spray width, so play is matching the tool to the layer and distance. Progress
  bars per object and a highlight for remaining dirt make completion fully legible, and the career''s story arrives
  as client text messages rather than through the simulation.'
mechanics:
- id: surface-work-tools
  role: core
  note: Four nozzles with different power and spray width and surface-specific soaps remove dirt, grime, lichen,
    moss, and rust; progress bars track each object and the level, and a button highlights remaining dirt.
- id: contracts-orders
  role: supporting
  note: Career mode in the town of Muckingham offers 38 main jobs plus bonus jobs whose pay buys upgrades and cosmetics.
- id: direct-avatar
  role: supporting
  note: Ladders and scaffolding reach higher surfaces.
- id: scenario-objectives
  role: supporting
  note: Challenge mode limits water or time and ranks the result.
