id: simearth
type: game
name: SimEarth
aliases:
- 'SimEarth: The Living Planet'
summary: A planetary god game built on James Lovelock's Gaia hypothesis in which geology, atmosphere, climate, life,
  and civilization models interact over billions of years under the player's parameter changes and interventions.
year: 1990
developer: Maxis
platforms:
- pc
- console
subgenre: god-game
subgenre_secondary:
- ecosystem-evolution
sim_domain:
- planetary-natural
- biological-ecological
player_role: god
agency_model:
- policy-parameter
- supernatural-intervention
time_model: real-time-pausable
sim_scale: planet
fidelity: systemic
perspective: top-down-2d
win_structure: open-sandbox
failure_model: cascading-collapse
narrative_mode: emergent
multiplayer:
- single
modding: none
production_tier: aa
agent_count_order: aggregate
emergence: 3
influence: 2
core_loop: set geological, atmospheric, and biological rates -> climate and biomes evolve -> taxa spread, mutate,
  and diversify -> one sapient species advances through seven ages -> pollution, war, and disasters feed back on
  climate -> spend energy on interventions
design_notes: 'Will Wright and Fred Haslam built SimEarth with James Lovelock as adviser, and its models encode
  Gaian feedback: volcanic dust cools the planet, warming melts ice caps and raises seas, and life alters atmospheric
  gas fractions shown to three decimal places. The player mostly acts through control panels that set rates such
  as continental drift, reproduction, and mutation, plus energy-priced interventions (50 units per terrain square,
  500 per terraforming device), so play is closer to tuning coupled systems than to directing agents. Scenarios
  include Daisyworld, Lovelock''s minimal model of temperature regulation by daisy color, and terraforming Mars
  and Venus.'
mechanics:
- id: planetary-climate
  role: core
  note: Atmospheric composition, temperature, ocean level, and biomes evolve together under Gaian feedback; volcanic
    dust cools, warming melts ice caps, extreme heat boils oceans, and Daisyworld reduces it to daisies regulating
    temperature.
- id: god-powers
  role: core
  note: Placing terrain, life, monoliths, oxygen generators, and terraforming devices costs energy (50 per terrain
    square, 500 per device) from a budget that grows with planetary development.
- id: natural-selection
  role: core
  note: Taxa from prokaryotes to mammals spread and diversify by environment, with player-set reproduction and mutation
    rates; mass extinctions are often followed by renewed radiation, and any multicellular taxon can become sapient.
- id: habitat-suitability
  role: supporting
- id: terraforming
  role: supporting
  note: Mars, Venus, Ice Planet, and Dune scenarios ask the player to make hostile planets habitable.
- id: random-disasters
  role: supporting
  note: Hurricanes, wildfires, earthquakes, tsunamis, and meteors occur, with disease and pollution scaling with
    population.
- id: pollution-spread
  role: supporting
- id: scenario-objectives
  role: supporting
- id: data-overlays
  role: supporting
- id: variable-speed
  role: supporting
