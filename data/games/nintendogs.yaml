id: nintendogs
type: game
name: Nintendogs
summary: A Nintendo DS puppy sim in which the player pets, washes, feeds, and walks up to three dogs,
  teaches them tricks with recorded voice commands, and enters disc, agility, and obedience trials.
year: 2005
developer: Nintendo EAD
