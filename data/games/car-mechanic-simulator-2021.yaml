id: car-mechanic-simulator-2021
type: game
name: Car Mechanic Simulator 2021
aliases:
- CMS 2021
summary: A first-person garage sim in which the player diagnoses and repairs customer cars part by part, restores
  auction and barn-find cars, and expands the workshop.
year: 2021
developer: Red Dot Games
