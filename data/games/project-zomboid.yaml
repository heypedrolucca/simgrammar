id: project-zomboid
type: game
name: Project Zomboid
summary: An isometric zombie survival sandbox in which one survivor manages moodles, injuries, skills,
  and failing utilities across a large Kentucky map until an inevitable death.
year: 2011
developer: The Indie Stone
platforms:
- pc
subgenre: survival-sim
subgenre_secondary:
- sandbox-world
sim_domain:
- biological-ecological
- urban
player_role: inhabitant
agency_model:
- direct-avatar
time_model: real-time-pausable
sim_scale: individual
fidelity: systemic
perspective: isometric
win_structure: survival-duration
failure_model: permadeath
narrative_mode: emergent
multiplayer:
- single
- coop
modding: scripting
production_tier: indie
agent_count_order: 1k
emergence: 4
influence: 2
core_loop: loot houses and stores -> avoid or fight zombies drawn by sight and noise -> manage hunger,
  fatigue, injuries, and moodles -> utilities fail and seasons turn -> barricade, farm, and level skills
  -> survive until death
design_notes: 'The framing question is how the character dies, not whether: zombie infection is always
  fatal in an unmodified game, so play is about extending a doomed run. Water and power shut off within
  the first month, after which erosion and overgrowth spread, giving the sandbox a scheduled decline.
  Zombies respond to sight and hearing and hordes migrate, so noise from actions shapes risk; there is
  no mechanic id for noise attraction yet (proposal filed). The game has been in early access since a
  paid tech demo in May 2011, with Steam early access from November 2013 and Build 42 in open beta from
  December 2024.'
mechanics:
- id: survival-meters
  role: core
  note: Moodles for hunger, thirst, fatigue, endurance, panic, stress, boredom, unhappiness, temperature,
    wetness, pain, bleeding, and sickness each grow in severity and penalize combat, movement, carrying,
    or healing.
- id: injury-body-model
  role: core
  note: Wounds such as scratches, lacerations, bites, and fractures are tracked per body part with bleeding
    and bandaging; zombie infection is spread by saliva and blood and is always fatal.
- id: agent-skills
  role: core
  note: Skills such as carpentry and cooking level from activities, and skill books and magazines speed
    or unlock progress.
- id: crisis-countdown
  role: supporting
  note: Water and power shut off within about a month, forcing preparation.
- id: personality-traits
  role: supporting
  note: Occupation and positive or negative traits are chosen at character creation; occupation also sets
    spawn location.
- id: hand-crafting
  role: supporting
  note: Weapons, tools, and barricades are crafted; Build 42 overhauled crafting.
- id: free-placement
  role: supporting
  note: Carpentry builds walls, barricades, and forts.
- id: crop-cultivation
  role: supporting
- id: seasons
  role: supporting
  note: A climate system with seasons changes gear needs.
- id: weather
  role: supporting
- id: day-night-cycle
  role: supporting
- id: spoilage
  role: supporting
  note: Food rots, and refrigeration ends when power fails.
- id: vehicle-dynamics
  role: supporting
  note: Vehicles have physics and part condition.
- id: fog-of-war
  role: supporting
  note: A vision cone limits what the survivor sees.
- id: permadeath
  role: supporting
  note: Death ends the character; a new survivor can start in the same world.
- id: modding-api
  role: supporting
  note: Full Lua modding through the Steam Workshop.
- id: stimulus-attraction
  role: core
  note: Zombies respond to sight and hearing, so noise from actions such as gunfire or breaking windows
    draws them toward the survivor, and hordes migrate.
