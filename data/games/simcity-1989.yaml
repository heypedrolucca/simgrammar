core_loop: zone residential, commercial, and industrial land -> connect roads and power -> RCI demand
  and land value grow zones -> collect taxes each year -> fund police, fire, and roads -> respond to crime,
  pollution, traffic, and disasters
design_notes: Will Wright grew the game out of the map editor he built for Raid on Bungeling Bay and drew
  its model from Jay Forrester's Urban Dynamics. The simulation is a set of coarse grid maps (land value,
  crime, pollution, traffic density, police and fire effect) recomputed in passes, plus three RCI demand
  valves that integrate city-wide balance; a zone grows when its local score plus the valve passes a random
  test. The 2008 GPL release as Micropolis made these update rules, including crime = 128 - land value
  + density - police effect, inspectable.
mechanics:
- id: zoning
  role: core
  note: The player paints 3x3 residential, commercial, and industrial zones; simulated developers build,
    densify, or abandon them.
- id: rci-demand
  role: core
  note: Three valves move by the ratio of projected to actual residents, commerce, and industry plus a
    tax offset, clamped to +/-2000 or +/-1500 (Micropolis source).
- id: land-value
  role: core
  note: Each 2x2 block's value falls with distance from the population-weighted center, rises near trees
    and water, and drops with pollution and high crime, clamped to 1-250.
- id: power-grid
  role: core
  note: Zones must connect to coal or nuclear plants through power lines or adjacent zones; unpowered
    zones do not grow and lower the city score.
- id: budget-treasury
  role: core
  note: Tax revenue is collected periodically from population, land value, and tax rate; police, fire,
    and road funding fractions scale their effects, and underfunded roads decay.
- id: taxation
  role: supporting
  note: One city-wide tax rate adds a positive offset to demand at low rates and a negative offset at
    high rates.
- id: service-coverage
  role: supporting
  note: Police and fire stations write funding-scaled effect values to a block map that is smoothed outward.
- id: crime-policing
  role: supporting
  note: Crime per cell is 128 - land value + density minus smoothed police effect, clamped 0-250.
- id: pollution-spread
  role: supporting
  note: Industry and traffic write a pollution map that depresses land value and can summon the monster.
- id: traffic-congestion
  role: supporting
  note: Zones generate trips along roads; the resulting traffic density map adds to pollution and complaints.
- id: data-overlays
  role: supporting
  note: Map windows show land value, crime, pollution, traffic density, police and fire coverage, and
    population density.
- id: random-disasters
  role: supporting
  note: Fire, flood, tornado, earthquake, and a pollution-gated monster fire at 1/481, 1/241, or 1/61
    per cycle by difficulty.
- id: scenario-objectives
  role: supporting
  note: Time-limited scenarios such as Detroit 1972 set a goal to reach before the clock ends, added at
    Broderbund's suggestion.
- id: citizen-satisfaction
  role: supporting
  note: A yearly evaluation turns problem scores into a 0-1000 rating and an approval poll.
- id: variable-speed
  role: supporting
- id: free-placement
  role: supporting
- id: fire-spread
  role: supporting
