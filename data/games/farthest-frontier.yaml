id: farthest-frontier
type: game
name: Farthest Frontier
summary: A frontier-town city builder in which crop rotation, soil fertility, diet variety, clean water,
  and healers decide whether named diseases spread, while prosperity draws stronger raiders against walled
  defenses.
year: 2022
year_full_release: 2025
developer: Crate Entertainment
platforms:
- pc
subgenre: city-builder
