core_loop: type to or touch Grace and Trip -> parser maps input to a discourse act -> characters react
  and tension shifts -> drama manager picks the next beat -> secrets surface -> the couple reconciles,
  splits, or throws the player out
design_notes: 'Michael Mateas and Andrew Stern built Façade as a research artifact: Grace and Trip are
  written in A Behavior Language (ABL) as reactive behaviors, and a drama manager picks the next story
  beat from an authored library to follow a tension arc toward a climax. Typed text is mapped to a small
  set of discourse acts (the Versu paper counts 30 parameterized speech acts and 27 beats), which lets
  a limited body of authored dialogue answer open-ended input. It is a boundary case: the simulated systems
  are the parser, character behaviors, and beat sequencing over mostly authored dialogue, built for replay
  so players can find other outcomes.'
mechanics:
- id: natural-language-interaction
  role: core
  note: Typed sentences are matched by keywords and context to discourse acts such as agreeing, criticizing,
    or flirting, which Grace and Trip answer in character.
- id: storyteller-director
  role: core
  note: A drama manager chooses the next beat whose preconditions match the state, steering toward a rising
    tension arc and one of three endings.
- id: triggered-event-chains
  role: supporting
  note: Revelations such as a confessed affair fire only when earlier beats and player choices set them
    up.
- id: relationship-values
  role: supporting
  note: As the couple argues, the player's responses read as taking one side, which shapes later beats.
- id: direct-avatar
  role: supporting
  note: The player walks around the apartment in first person and can click objects or body parts to hug,
    comfort, or kiss.
