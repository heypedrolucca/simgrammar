id: stardew-valley
type: game
name: Stardew Valley
summary: A farming and life sim in which the player restores an inherited farm over four 28-day seasons,
  splitting a daily energy budget among crops, animals, mining, fishing, and friendships with Pelican
  Town's residents.
year: 2016
developer: ConcernedApe
