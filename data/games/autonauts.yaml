id: autonauts
type: game
name: Autonauts
summary: A colony automation game in which the player crafts workerbots from parts and teaches them farming,
  crafting, and cooking routines in a Scratch-style visual language, so that bots supply the food, housing,
  and care that a growing population of Folk needs.
