id: the-farmer-was-replaced
type: game
name: The Farmer Was Replaced
summary: A programming game in which the player writes Python-like code for a farming drone on a grid
  farm, where every operation costs simulated ticks, and harvests crops to buy unlocks for language features,
  farm size, more drones, and new crops.
year: 2023
year_full_release: 2025
developer: Timon Herzog
