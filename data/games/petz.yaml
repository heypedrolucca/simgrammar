core_loop: adopt a puppy or kitten after playing with each breed to sense its personality -> pet, feed,
  and play with it using the hand cursor and toy shelf -> reward behavior with treats and petting or
  squirt it with the spray bottle -> it grows up and develops
  habits -> keep it company or it sulks and eventually runs away
design_notes: 'PF.Magic''s designers described the Petz as autonomous agents rather than animations: each
  pet chooses its own behavior from drives (attention and affection first, hunger second), breed personality,
  and individual likes, dislikes, and quirks, and it fetches toys from the shelf on its own. The user acts
  only through a hand-shaped cursor that touches, picks up, and offers objects, so every intervention
  is a stimulus the pet interprets. Reward (treats, feeding, petting) and discipline (a water spray bottle)
  reinforce whatever the pet was doing, which lets owners shape both tricks and general temperament.
  In the releases the 1997 and 1998 papers describe, several Petz on one desktop form pairwise bonds: buddies play together and share food and toys, enemies
  steal toys and are pleased when the user disciplines the other, and adults comfort scared young. Petz
  begin as puppies or kittens and age, but stop aging at adulthood and do not die, which is why the record
  does not tag lifecycle-aging; pet-to-pet bonds are documented only for those later releases, so relationship-values is not tagged on this 1995-dated record either; the failure state is abandonment, since a pet neglected long enough runs
  away. Andrew Stern, one of the authors of the Petz papers, later co-created Facade.'
mechanics:
- id: creature-care
  role: core
  note: The user feeds, waters, pets, and plays with each pet through a hand cursor and toy shelf; a pet
    ignored long enough becomes lethargic and depressed and eventually runs away.
- id: creature-learning
  role: core
  note: Treats, feeding, and petting reward and a water spray bottle punishes whatever the pet is doing,
    and wiggling a treat trains tricks such as jumping, sitting, and rolling over.
- id: personality-traits
  role: core
  note: Breed personalities (playful terriers, grumpy bulldogs, hyper Chihuahuas) plus individual likes,
    dislikes, and quirks set behavior, and treatment shifts mood and, over time, personality.
- id: needs-decay
  role: supporting
  note: Attention and affection are the primary drive; a hungry pet searches for food, hunts mice, or
    begs.
