id: noita
type: game
name: Noita
summary: A roguelite action game in which every pixel of the world is simulated as a falling-sand material
  that burns, melts, flows, and reacts, and the player builds wands from spells to dig through procedurally
  generated levels.
year: 2019
year_full_release: 2020
developer: Nolla Games
