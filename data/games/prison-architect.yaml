id: prison-architect
type: game
name: Prison Architect
summary: A prison management sim in which the player builds a facility, sets an hourly regime, and staffs
  it while hundreds of prisoners pursue needs whose neglect leads to fights, escapes, and riots.
year: 2012
year_full_release: 2015
developer: Introversion Software
platforms:
- pc
- console
- mobile
- handheld
subgenre: management-tycoon
subgenre_secondary:
- colony-sim
