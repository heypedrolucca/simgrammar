id: satisfactory
type: game
name: Satisfactory
summary: A first-person 3D factory automation game in which a pioneer taps infinite resource nodes on
  an alien planet and connects machines with belts, pipes, trains, and drones to deliver project parts
  to FICSIT's Space Elevator.
year: 2019
year_full_release: 2024
