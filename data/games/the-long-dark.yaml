id: the-long-dark
type: game
name: The Long Dark
summary: A first-person wilderness survival sim set in frozen northern Canada where the player manages warmth, calories, thirst,
  fatigue, and afflictions against cold, weather, and wildlife.
year: 2014
year_full_release: 2017
developer: Hinterland Studio
