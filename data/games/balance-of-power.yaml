id: balance-of-power
type: game
name: Balance of Power
summary: A Cold War geopolitical sim in which the player, as US or Soviet leader, spends aid, treaties, and interventions
  on minor countries over eight annual turns and manages escalating crises to gain prestige without triggering nuclear
  war.
year: 1985
developer: Chris Crawford
platforms:
- pc
- mainframe-early
subgenre: political-sim
sim_domain:
- political-governance
- military-conflict
player_role: ruler-statesman
agency_model:
- policy-parameter
time_model: turn-based
sim_scale: nation
fidelity: stylized
perspective: top-down-2d
win_structure: score-ranking
failure_model: hard-restart
narrative_mode: hybrid
multiplayer:
- single
modding: none
production_tier: indie
agent_count_order: aggregate
emergence: 2
influence: 2
core_loop: review the world map and country data -> commit aid, treaties, and interventions -> rival superpower
  responds -> contested moves become crises -> escalate or back down -> prestige shifts -> next annual turn
design_notes: Crawford built the game around country-level state (alignment, government stability, insurgency) that
  responds to superpower actions, and around a two-sided crisis exchange in which backing down costs prestige and
  pushing too far ends the game in nuclear war. Ending the game at nuclear war, rather than letting the war be fought,
  is its main difference from Bruce Ketchledge's Geopolitique 1990. The crisis escalation exchange is not yet a
  mechanic in the taxonomy (proposal crisis-escalation).
mechanics:
- id: faction-diplomacy
  role: core
  note: Each turn the player allocates economic and military aid, support for governments or insurgents, interventions,
    and treaties to minor countries to pull their alignment; the AI superpower answers, and contested moves become
    crises resolved by no action, diplomatic notes, or military maneuvers.
- id: reputation
  role: core
  note: 'Prestige points are the score: winning crises and holding aligned countries raises prestige, backing down
    in a crisis costs prestige and has political repercussions, and the total after eight years decides the outcome.'
- id: turn-structure
  role: core
  note: Eight one-year turns; each turn resolves both superpowers' policies and then presents the year's incidents
    as crises to settle before advancing.
- id: stability-unrest
  role: supporting
  note: Minor-country governments face insurgencies whose strength shifts with superpower aid to the government
    or the rebels.
- id: alerts-feed
  role: supporting
  note: Incidents and crises arrive framed as newspaper stories.
- id: data-overlays
  role: supporting
  note: The world map can be shaded by country-level variables such as alignment and insurgency.
