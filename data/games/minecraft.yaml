id: minecraft
type: game
name: Minecraft
summary: A procedurally generated voxel sandbox where players mine blocks, craft tools, survive hostile
  night mobs and hunger, farm and trade, and build circuits from redstone.
year: 2009
year_full_release: 2011
developer: Mojang Studios
