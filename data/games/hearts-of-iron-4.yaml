id: hearts-of-iron-4
type: game
name: Hearts of Iron IV
aliases:
- HOI4
summary: A World War II grand strategy game starting in 1936 or 1939 in which the player builds factories,
  turns resources into equipment, designs divisions, follows a national focus tree, and directs fronts
  and battle plans across land, sea, and air.
year: 2016
developer: Paradox Development Studio
platforms:
- pc
subgenre: grand-strategy
subgenre_secondary:
- wargame
