core_loop: place wind turbines on rock -> power toxin scrubbers that clean soil -> irrigate and pump water into riverbeds
  -> upgrade to grow wetlands, meadows, and forest -> attract animals and restore weather -> recycle every building and leave
design_notes: 'It inverts the city-builder loop: growth is measured in restored tiles rather than population, and points earned
  per restored tile are the only currency for further buildings, so efficient placement compounds. The final step requires
  recycling all infrastructure to build an airship and leave, so a layout must be removable as well as productive. Subgenre
  is set to city-builder because its lineage is placement and budget puzzles rather than population or evolution modeling.
  It began as a Ludum Dare 45 entry in October 2019.'
mechanics:
- id: free-placement
  role: core
  note: 'Buildings have placement rules: wind turbines go only on stone tiles and power toxin scrubbers, which clean soil
    so irrigators can green it.'
- id: budget-treasury
  role: core
  note: Each restored tile earns points, and points are the only currency for buildings and upgrades, so a map can stall if
    spending outruns restoration.
- id: hydrology
  role: supporting
  note: Pumps refill dried riverbeds and tools carve new rivers.
- id: terraforming
  role: supporting
  note: Tools create new rivers and some stone tiles.
- id: habitat-suitability
  role: supporting
  note: Restored biomes attract deer, birds, fish, and bears.
- id: scenario-objectives
  role: supporting
  note: Each map sets restoration targets before the player can recycle buildings and leave.
