id: species-alre
type: game
name: 'Species: Artificial Life, Real Evolution'
aliases:
- Species ALRE
- Species
summary: A solo-developed evolution simulator in which creatures defined by numeric genes mutate, breed, and speciate
  in real time across a 3D world while the player observes, edits the gene pool, and alters climate.
year: 2012
developer: Quasar
platforms:
- pc
subgenre: artificial-life
subgenre_secondary:
- ecosystem-evolution
sim_domain:
- biological-ecological
player_role: observer-gardener
agency_model:
- supernatural-intervention
- policy-parameter
- indirect-incentive
time_model: real-time-pausable
sim_scale: region
fidelity: systemic
perspective: free-3d
win_structure: open-sandbox
failure_model: none
narrative_mode: emergent
multiplayer:
- single
modding: content
production_tier: indie
agent_count_order: '100'
emergence: 3
influence: 1
core_loop: creatures feed, pay energy costs, and reproduce -> offspring genomes mutate -> environment and rovers
  decide who eats and who starves -> trait averages drift and lineages split into species -> player edits genes,
  climate, or triggers ice ages and floods -> watch the clade diagram branch
design_notes: 'Species, built by a single developer known as Quasar, simulates evolution with no fitness function:
  genes are numbers, most mutations add a random value in [-1, 1] scaled by a background mutation rate and radiation,
  and survival is whatever the body and environment allow. Energy costs come from analyzing each creature''s skeleton
  for internal forces and torques, so morphology has a physical price, and creatures can eat only what their head
  reaches. Species are not predefined: a species is a population that can interbreed within a genetic distance,
  and it splits only when intermediate forms die out, which the clade diagram records. Species defined at runtime
  by genetic distance are not yet a mechanic in the taxonomy (proposal runtime-speciation). A free alpha (0.4.0)
  was public from 2012, and the Steam Early Access build from 2018 has not reached 1.0.'
mechanics:
- id: trait-inheritance
  role: core
  note: Each creature's body and behavior come from numeric genes; offspring are randomly modified copies of one
    or more parents, with most mutations a random value in [-1, 1] times a modifier for background mutation rate
    and radiation.
- id: natural-selection
  role: core
  note: No fitness score exists; creatures that cannot pay skeleton-derived energy costs, reach food, or tolerate
    local climate fail to reproduce, so trait averages drift and lineages speciate.
- id: habitat-suitability
  role: supporting
  note: Climate varies across the map, and climate control devices create local cold, hot, fertile, or dead ground.
- id: god-powers
  role: supporting
  note: The player triggers ice ages and world floods, programs rovers to feed or kill creatures by genetic distance
    to a target genome, and edits genomes in an isolated nursery.
- id: lifecycle-aging
  role: supporting
- id: agent-inspection
  role: supporting
  note: Creature inspection shows each individual's DNA and stats.
- id: stats-dashboards
  role: supporting
  note: Species averages over time, a clade diagram (Tree of Life), a satellite range map, and a web-of-life view
    of genetic variety.
- id: variable-speed
  role: supporting
claims:
