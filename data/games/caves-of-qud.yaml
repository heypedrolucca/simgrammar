boundary_case: true
core_loop: explore generated and handmade zones -> fight, trade, and talk with faction members -> mutate and equip -> uncover generated history -> go deeper
design_notes: >-
  A roguelike included for its simulation layers: faction reputation that every creature carries, liquids that mix
  and flow, body-part anatomy, and procedurally generated sultan histories that the world refers to. It is a frequently
  cited example of wave function collapse in a shipped game.
mechanics:
  - id: reputation
    role: core
    note: Every creature belongs to factions; the player's standing with each faction decides who attacks, trades, or talks.
  - id: history-generation
    role: core
    note: Generated histories of past sultans are written into the world as lore, shrines, and quests.
  - id: procedural-terrain
    role: core
    note: Zones mix handmade and procedural maps; some generators use wave function collapse.
  - id: fluid-gas-simulation
    role: supporting
  - id: material-interactions
    role: supporting
  - id: injury-body-model
    role: supporting
  - id: permadeath
    role: supporting
  - id: turn-structure
    role: supporting
  - id: faction-diplomacy
    role: supporting
  - id: modding-api
    role: supporting
    note: 'XML data files and C# scripting mods, distributed through Steam Workshop.'
