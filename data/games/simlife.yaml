id: simlife
type: game
name: SimLife
aliases:
- 'SimLife: The Genetic Playground'
summary: A Maxis artificial-life toy in which the player edits plant and animal genes, landscape, and the world's
  physical parameters, then watches food chains and evolution play out.
year: 1992
developer: Maxis
