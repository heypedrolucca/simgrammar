id: dcs-world
type: game
name: DCS World
aliases:
- Digital Combat Simulator
- DCS
summary: A combat flight sim platform of study-level aircraft modules with clickable cockpits and modeled
  subsystems, flown in missions and on multiplayer servers built with a Lua-scriptable mission editor.
