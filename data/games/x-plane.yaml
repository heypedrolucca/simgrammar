id: x-plane
type: game
name: X-Plane
summary: A flight sim whose flight model computes forces on small elements of each wing, control surface, and propeller
  from aircraft geometry, used for entertainment and in FAA-approved training devices.
year: 1995
developer: Laminar Research
platforms:
- pc
- mobile
subgenre: flight-sim
sim_domain:
- physical-mechanical
- planetary-natural
player_role: operator-pilot
agency_model:
- direct-avatar
- design-then-test
time_model: real-time-pausable
sim_scale: individual
fidelity: professional
perspective: first-person
win_structure: open-sandbox
failure_model: hard-restart
narrative_mode: none
multiplayer:
- single
modding: scripting
production_tier: indie
agent_count_order: '10'
emergence: 2
influence: 3
core_loop: pick or design an aircraft -> set location and weather -> fly by hand or autopilot -> blade-element forces
  respond to geometry and air -> land -> revise the aircraft in Plane Maker
design_notes: 'X-Plane uses blade element theory: wings, control surfaces, and propellers are split into elements
  and aerodynamic forces are computed on each from geometry, rather than looked up from performance tables, so an
  aircraft drawn in the bundled Plane Maker flies according to its shape. That approach underpins its use in FAA-approved
  training systems when paired with suitable hardware. A plugin SDK exposes simulator data for instruments, cockpits,
  and external hardware.'
mechanics:
- id: flight-aerodynamics
  role: core
  note: Blade element theory splits wings, control surfaces, and propellers into small elements and computes aerodynamic
    forces on each from geometry and physical parameters.
- id: modular-assembly
  role: supporting
  note: Plane Maker lets users define aircraft geometry and components and then fly the result in the simulator.
- id: weather
  role: supporting
  note: X-Plane 12 reworked clouds, turbulence, and atmospheric effects, and version 12.3 added a weather-radar
    system.
