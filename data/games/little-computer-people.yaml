id: little-computer-people
type: game
name: Little Computer People
aliases:
- Apple Town Story
summary: A 1985 home-computer life sim in which one procedurally seeded little person lives in a cross-section
  of a three-story house, follows a daily routine, and depends on the player for food, water, and attention.
year: 1985
developer: Activision
platforms:
- mainframe-early
- pc
- console
subgenre: life-sim
