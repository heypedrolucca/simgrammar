id: dyson-sphere-program
type: game
name: Dyson Sphere Program
summary: A 3D factory automation game in which the player's mech builds production lines on rotating planets,
  links star systems with logistics drones and warp vessels, and launches sails and rockets to assemble
  Dyson spheres around stars.
year: 2021
