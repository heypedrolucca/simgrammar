id: plague-inc
type: game
name: Plague Inc.
aliases:
- 'Plague Inc: Evolved'
summary: A strategy game in which the player evolves a pathogen's transmission, symptoms, and abilities to infect
  and kill the world's population before humanity's cure research finishes.
year: 2012
developer: Ndemic Creations
platforms:
- mobile
- pc
- console
