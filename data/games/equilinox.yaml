id: equilinox
type: game
name: Equilinox
summary: A relaxed nature-building game in which the player spreads biomes with grasses, places plants and animals
  that each have environmental requirements, and spends diversity points earned by healthy species on evolutions
  and genetic modifications.
year: 2018
developer: ThinMatrix
platforms:
- pc
subgenre: ecosystem-evolution
sim_domain:
- biological-ecological
player_role: caretaker
agency_model:
- zoning-placement
- indirect-incentive
time_model: real-time
sim_scale: facility
fidelity: stylized
perspective: free-3d
win_structure: open-sandbox
failure_model: soft-recoverable
narrative_mode: none
multiplayer:
- single
modding: none
production_tier: indie
agent_count_order: '100'
emergence: 2
influence: 1
core_loop: plant grasses to spread biomes -> place plants and animals whose requirements are met -> healthy species
  live longer, breed, and earn diversity points -> spend points on new species, genetic modifications, and evolutions
  -> complete tasks for rewards
design_notes: 'Equilinox, built solo by ThinMatrix, ties its economy to ecological fit: each species has a life
  cycle and requirements, and healthy individuals live longer, breed more, and yield more diversity points, the
  currency for new species and modifications. Evolution is a gated unlock (meet a species'' evolution conditions,
  then pay to evolve) rather than simulated selection, which keeps the 120+ species on an authored progression.
  Biomes spread from planted grasses, so terrain type is itself a player-placed stock. Paid genetic modification
  matches the genome-modification proposal from run catalog-ge.'
mechanics:
- id: habitat-suitability
  role: core
  note: Each species needs a biome, food, and nearby plants or water; satisfied individuals stay healthy, live longer,
    and breed, while unmet needs reduce health.
- id: milestone-unlocks
  role: core
  note: Species evolve into new species once their conditions are met and points are paid, and 60+ tasks grant points
    or content.
- id: budget-treasury
  role: core
  note: Diversity points earned by healthy plants and animals are the single currency for buying species, modifications,
    and evolutions; repeatable tasks let players farm a steady income.
- id: lifecycle-aging
  role: supporting
  note: Plants and animals grow, eat, reproduce, and die on species-specific cycles.
- id: food-web
  role: supporting
  note: Some animals hunt others, so predator placement constrains prey populations.
- id: terraforming
  role: supporting
  note: Planted grasses convert ground into one of 10 biome types, and algae turns water into river for fish.
- id: free-placement
  role: supporting
- id: collection-goals
  role: supporting
