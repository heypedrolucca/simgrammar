id: animal-crossing-new-horizons
type: game
name: 'Animal Crossing: New Horizons'
aliases:
- New Horizons
summary: A Nintendo life sim on a deserted island whose clock, seasons, and wildlife follow the real calendar,
  built around gathering, D.I.Y. crafting, museum collections, villager relationships, and island design.
year: 2020
developer: Nintendo EPD
