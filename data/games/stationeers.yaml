id: stationeers
type: game
name: Stationeers
summary: >-
  A first-person space station survival game whose core is an atmospheric simulation of gas mixtures, pressure, temperature,
  and combustion that the player must engineer with pipes, power, and programmable logic.
year: 2017
developer: RocketWerkz
