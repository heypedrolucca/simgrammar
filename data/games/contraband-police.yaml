id: contraband-police
type: game
name: Contraband Police
summary: A first-person border-post sim set in 1981 in which the player checks drivers' documents, searches vehicles
  for hidden contraband, chases smugglers, and upgrades the post against gang attacks.
year: 2023
developer: Crazy Rocks Studios
platforms:
- pc
- console
