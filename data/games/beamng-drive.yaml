core_loop: pick a vehicle and map -> drive, race, or stage a crash -> node-beam structure deforms and parts fail
  -> inspect the damage -> reset or change vehicle, conditions, or mods
design_notes: 'Vehicles are defined in JBeam, a JSON format of nodes and beams, and the same structure produces
  both handling and damage: frames flex, doors detach, windows shatter, tires blow, engines degrade, and fuel tanks
  can explode. Free roam exposes simulation parameters (time, gravity, wind), so much play is experiment rather
  than goal. Lua scripting and an official in-game mod repository make the vehicle and scenario set community-driven,
  and BeamNG.tech forks the engine for education and research.'
mechanics:
- id: soft-body-deformation
  role: core
  note: Vehicles are JBeam node-and-beam skeletons that flex and deform under impact; damage degrades engines, detaches
    doors, shatters windows, blows tires, and can make fuel tanks explode.
- id: vehicle-dynamics
  role: core
  note: Handling comes from the same node-beam structure, so suspension, chassis flex, and tires respond to the
    vehicle's build and its damage.
- id: embodied-skill-control
  role: supporting
- id: scenario-objectives
  role: supporting
  note: Campaigns group short races, chases, and stunts, and time trials race against the player's best times.
- id: modding-api
  role: supporting
  note: The game relies heavily on Lua, and mods add real and fictional vehicles.
- id: content-sharing
  role: supporting
  note: An official mod repository is browsable from the website and in game, with a manager that keeps mods updated.
claims:
- text: A free tech demo and paid alpha launched on 2013-08-03 through FastSpring, before Steam Early Access on
    2015-05-29; the source reports no 1.0 release.
