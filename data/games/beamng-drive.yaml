id: beamng-drive
type: game
name: BeamNG.drive
summary: A vehicle sim built on soft-body physics in which every vehicle is a node-and-beam skeleton that flexes,
  deforms, and breaks under impact, played as a free-roam sandbox with scenarios.
year: 2013
developer: BeamNG GmbH
platforms:
- pc
subgenre: vehicle-sim
