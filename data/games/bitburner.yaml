core_loop: write a script -> gain root on servers -> run hack, grow, and weaken threads -> earn money
  and hacking experience -> buy RAM and programs -> gain faction reputation -> buy augmentations and install
  them, resetting progress -> destroy a BitNode for a Source-File and start the next
design_notes: 'Bitburner is an incremental game whose economy is a small numerical model the player automates
  in code. Each server holds a money stock and a security level: hack() steals a percentage of the money
  and raises security, grow() multiplies money back and also raises security, and weaken() lowers security
  toward a floor of max(1, round(starting security / 3)), with hack chance and timing set by security
  and the player''s hacking level. Writing schedulers that balance these three calls across many servers
  and threads is the main skill. Progress is layered by resets: augmentations bought with money and faction
  reputation (each purchase doubling later prices) take effect only when installed, which wipes most progress,
  and destroying a BitNode by hacking w0r1d_d43m0n at hacking level 3000 resets further but grants a permanent
  Source-File. This prestige-reset structure has no taxonomy entry, so this run proposed one. Later BitNodes
  add systems such as Bladeburner and sleeves.'
mechanics:
- id: player-programming
  role: core
  note: Netscript scripts in JavaScript run on servers whose RAM caps how many threads can run; the TIX
    API automates stock trading, and a beginner path teaches programming from scratch.
- id: resource-extraction
  role: core
  note: hack() takes a share of a server's finite money that rises with hacking level and falls with security;
    grow() restores money and weaken() lowers security toward its floor, and both hack and grow raise
    security, so sustained yield needs a balanced hack-grow-weaken schedule.
- id: reputation
  role: core
  note: Working for factions builds reputation that gates which augmentations can be bought; Daedalus
    reputation gates The Red Pill needed to end a BitNode.
- id: agent-skills
  role: supporting
  note: Hacking, combat, and charisma stats rise with use; hacking level raises success chance and money
    stolen, shortens hack time, and gates which servers can be hacked.
- id: supply-demand-pricing
  role: supporting
  note: Stock prices move about every 6 seconds by a forecast probability that large trades shift; hacking
    or growing a company's server can lower or raise its stock's hidden forecast.
- id: contracts-orders
  role: supporting
  note: Coding contracts found on servers pose programming problems that earn rewards when solved.
- id: real-time-clock
  role: supporting
  note: Time spent offline accumulates and later speeds stock-market updates from about every 6 seconds
    to about every 4.
- id: execution-budget
  role: supporting
  note: Each script has a RAM cost, and a server's RAM caps how many script threads can run on it, so
    buying RAM and writing lean scripts both raise income.
