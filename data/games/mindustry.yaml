id: mindustry
type: game
name: Mindustry
summary: An open-source automation tower defense game in which the player belts ore into factories that
  supply turrets, units, and the core against enemy waves while capturing campaign sectors on two planets,
  with an assembly-like logic language for controlling blocks and units.
year: 2017
developer: Anuke
