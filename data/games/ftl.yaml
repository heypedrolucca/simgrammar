id: ftl
type: game
name: 'FTL: Faster Than Light'
aliases:
- FTL
summary: A roguelite starship sim where the player allocates reactor power and directs crew through room-level
  oxygen, fire, breach, and system-damage simulation while fleeing a rebel fleet across eight sectors.
year: 2012
developer: Subset Games
platforms:
- pc
- mobile
subgenre: space-sim
