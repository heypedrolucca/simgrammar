- cosmic-space
- military-conflict
player_role: commander
agency_model:
- direct-unit
- policy-parameter
time_model: real-time-pausable
sim_scale: household
fidelity: stylized
perspective: top-down-2d
win_structure: campaign
failure_model: hard-restart
narrative_mode: hybrid
multiplayer:
- single
modding: content
