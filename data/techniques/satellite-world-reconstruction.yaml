id: satellite-world-reconstruction
type: technique
name: ML reconstruction of the planet from aerial imagery
aliases:
- Blackshark.ai
- satellite-to-3D
- planet-scale scenery generation
summary: Machine learning classifies buildings, vegetation, and terrain in satellite and aerial imagery
  and procedural rules rebuild them as 3D scenery, which Microsoft Flight Simulator streams for the whole
  Earth.
category: procedural-generation
year: 2020
mechanism: Models trained on labeled imagery detect buildings, trees, and land cover in satellite and
  aerial imagery and map data and extrapolate approximate geometry; offline procedural generation then
  builds and dresses the buildings and places vegetation, while selected cities use photogrammetry meshes.
  The reconstruction runs offline in the cloud, and the result is streamed to players on demand as they
  fly, with procedural filling where imagery is poor.
key_results:
- text: Microsoft Flight Simulator (2020) used Blackshark.ai's AI on Azure to generate 3D buildings, trees,
    and terrain from Bing Maps data and photogrammetry, covering about 1.5 billion buildings and 2 trillion
    trees from over two petabytes of streamed map data.
  sources:
  - src-wikipedia-microsoft-flight-simulator-2020
  confidence: medium
- text: Blackshark.ai describes its products as turning satellite and aerial imagery into structured models
    of terrain, buildings, and infrastructure.
  sources:
  - src-blackshark-2026-homepage
  confidence: high
- text: Microsoft Flight Simulator 2024 carries over the satellite-derived scenery systems of the 2020
    game.
  sources:
  - src-wikipedia-microsoft-flight-simulator-2024
  confidence: medium
maturity: shipped-niche
trl: 8
runtime:
- offline-authoring
determinism_impact: preserves
horizon: now
risks:
- consistency
- ip-provenance
- compute-cost
affects:
- id: procedural-terrain
  effect: replaces-substrate
  note: The world is reconstructed from real imagery instead of generated from a seed and noise; the player-facing
    role of an explorable map is unchanged, but its content is the real planet, with procedural filling
    only where imagery is missing.
- id: embodied-skill-control
  effect: deepens
  note: Recognizable real buildings and landmarks across the planet make visual navigation by reference
    to the ground practicable anywhere, extending hand-flying practice beyond hand-modeled airports and
    cities.
- id: real-world-data-feeds
  effect: deepens
  note: Learned classification of satellite imagery turns real-world map data into simulated scenery at
    planetary scale (Microsoft Flight Simulator).
deployed_in:
- microsoft-flight-simulator-2020
- microsoft-flight-simulator-2024
limitations:
- Accuracy is bounded by imagery quality; blurred or pixelated areas fall back to procedural fill.
- Requires cloud streaming of petabyte-scale data and a licensed imagery source.
- Reconstructed buildings are generic from inferred class and height, not modeled individually, except
  in photogrammetry cities.
