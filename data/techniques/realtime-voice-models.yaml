- where-winds-meet
limitations:
- 'Cost scales with talk time: at 2024 Realtime API rates, an hour split evenly between player and NPC
  speech is roughly $9 before context re-reads; gpt-realtime rates cut that to roughly $3 (estimates derived
  from list prices).'
- 'Expressive delivery and low latency trade off: context-conditioned prosody still trails humans, and
  the most expressive TTS was not suited to real time at launch.'
- Voice actor consent and compensation are now contract terms, and players have penalized AI voices in
  reviews.
- Speech-native models are hard to constrain to game-legal actions; most games keep a text layer between
  speech and game state.
- Microphone use and online connectivity raise privacy and access barriers (Whispers from the Star lists
  a broadband connection and an account).
claims:
- text: Eleven v3's expressive model was not recommended for real-time conversation at launch because
    of latency and reliability, so expressive range and low latency were still traded off in mid-2025.
  sources:
  - src-elevenlabs-2025-eleven-v3
  confidence: high
- text: A vendor case study reports Death by AI reached 20 million players in three months with 1.2 billion
    tokens in its first month after moving LLM and TTS to a gaming-priced provider; the cost claims are
    unverified.
  sources:
  - src-inworld-2025-death-by-ai
  confidence: low
- text: Inworld's June 2026 price list puts streaming TTS at about $5-25 per million characters and speech-to-text
    at about $0.10 per hour, and claims only about 3 in 100 consumer AI users ever pay.
  sources:
  - src-inworld-2026-consumer-ai-cost
  confidence: low
- text: In GDC's 2026 survey of over 2,300 professionals, 36% used generative AI at work but 52% thought
    it was harming the industry, up from 30% in 2025, with game design and narrative (63%) and art (64%)
    among the most negative groups, which bears on adoption of generated character voices and dialogue.
  sources:
  - src-gdc-2026-state-of-industry
  - src-gdc-2025-state-of-industry
  confidence: high
