id: realtime-voice-models
type: technique
name: Realtime speech-to-speech and expressive TTS for characters
aliases:
- speech-to-speech
- full-duplex dialogue
- Realtime API
- Moshi
- expressive TTS
- AI NPC voices
summary: Streaming speech recognition, speech-native language models, and context-aware text-to-speech
  that let characters hold spoken, interruptible conversations with roughly 200-250 ms response onset
  and generated emotional delivery.
category: speech-audio
year: 2024
mechanism: 'Two pipelines. Cascaded: streaming speech recognition, then an LLM, then streaming TTS, each
  optimized for time to first output. Speech-native: the model reads and writes audio tokens from a neural
  codec. Moshi models the user''s and its own speech as parallel streams (full duplex, so it can listen
  while speaking) and predicts time-aligned text tokens before audio tokens. Hosted realtime APIs keep
  a persistent WebSocket session with voice activity detection, interruption handling, and function calls
  that can trigger game actions. Expressive TTS conditions delivery on context: Sesame''s CSM feeds prior
  conversation audio and text to a Llama-style backbone over codec tokens, and Eleven v3 accepts inline
  tags such as [whispers] or [sighs]. Small ASR and TTS models (hundreds of millions of parameters) can
  run on device.'
key_results:
- text: Moshi reported 160 ms theoretical and 200 ms practical latency for full-duplex spoken dialogue.
  sources:
  - src-defossez-2024-moshi
  confidence: high
- text: OpenAI's Realtime API launched in October 2024 at about $0.06 per minute of audio input and $0.24
    per minute of output; gpt-realtime (August 2025) priced audio at $32 and $64 per million input and
    output tokens and raised function-calling accuracy on ComplexFuncBench from 49.7% to 66.5%.
  sources:
  - src-openai-2024-realtime-api
  - src-openai-2025-gpt-realtime
  confidence: high
- text: Sesame's CSM reached parity with human recordings in listener preference without conversational
    context, but listeners preferred the human recordings when 90 seconds of prior context was provided.
  sources:
  - src-sesame-2025-csm
  confidence: high
- text: Inworld's TTS-1.5 (January 2026) lists P90 time to first audio under 130 ms (Mini) and under 250
    ms (Max) at $15 and $25 per million characters, about $0.015-0.025 per minute of speech.
  sources:
  - src-inworld-2026-tts-1-5
  confidence: medium
- text: Whispers from the Star (August 2025) is built around open-ended voice, video-call, and text conversation
    with an AI-voiced character created with an actor, and Where Winds Meet (global November 2025) discloses
    real-time AI NPC text and voice chat.
  sources:
  - src-steam-2026-whispers-from-the-star
  - src-steam-2025-where-winds-meet
  confidence: high
- text: ARC Raiders (November 2025) was criticized and marked down by Eurogamer for generative AI NPC
    voices, and the SAG-AFTRA video game strike (July 2024 to July 2025) ended with contract terms on
    consent for AI voice replicas.
  sources:
  - src-wikipedia-artificial-intelligence-in-video-games
  confidence: medium
