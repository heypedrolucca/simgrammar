affects:
- id: natural-language-interaction
  effect: enables-new
  note: Characters can hold spoken, interruptible, full-duplex conversations with response onset near
    human turn-taking, replacing dialogue wheels or typed input; Whispers from the Star is built around
    this loop.
- id: social-exchanges
  effect: deepens
  note: Delivery carries social meaning (whispering, sighing, hesitation, warmth) generated from conversational
    context, so the same line can land as a flirt, apology, or threat.
- id: unit-commands
  effect: deepens
  note: Squad orders can be spoken mid-action and parsed into function calls, as in PUBG Ally's voice-directed
    teammate, without menus.
- id: procedural-characters
  effect: cuts-authoring-cost
  note: Generated characters can get distinct designed or cloned voices and speak unscripted lines without
    recording sessions, which removes the voice-acting cost that keeps procedural characters silent.
