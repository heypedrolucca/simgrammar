affects:
- id: embodied-skill-control
  effect: accelerates
  note: Upscaling and frame generation raise displayed frame rates in GPU-heavy flight and driving sims
    for the same render cost; generated frames do not sample new input, so frame generation adds latency
    that hurts precise hand-flying or driving.
- id: day-night-cycle
  effect: deepens
  note: Neural denoising and the neural radiance cache make dynamic multi-bounce lighting affordable,
    so player-built interiors and towns can be lit correctly across a full diurnal cycle where baked lighting
    cannot follow player construction.
- id: decoration-beauty
  effect: deepens
  note: Up to 7x VRAM savings from neural texture compression and cheaper layered materials let more distinct
    high-detail decor assets be resident at once, raising the variety a beauty-driven builder can show
    on screen.
deployed_in:
- microsoft-flight-simulator-2020
- cities-skylines-2
limitations:
- 'Changes presentation, not simulation: CPU-bound simulation games (agent counts, pathfinding, economy
  ticks) gain nothing from GPU-side neural rendering.'
- Frame generation adds input latency and artifacts; DLSS 5's final pass reportedly costs 50 to 60 percent
  of frame rate and can alter art direction.
- 'Hardware-gated: Multi Frame Generation and DLSS 5 require RTX 50-series GPUs at launch, and neural
  shader features depend on vendor SDKs and cooperative vector support.'
