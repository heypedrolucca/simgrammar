id: genie-world-models
type: technique
name: Genie foundation world models
aliases:
- Genie
- Genie 2
- Genie 3
- Project Genie
summary: Google DeepMind's Genie models generate playable worlds from a text or image prompt and render
  them in real time from player input, with Genie 3 reaching 720p at 24 fps and about a minute of visual
  memory.
category: generative-world-model
year: 2025
mechanism: 'Genie (2024) learned from 30k hours of unlabeled 2D platformer video: a video tokenizer, a
  latent action model that infers 8 discrete actions between frames without labels, and a 10.1B-parameter
  dynamics model that predicts the next frame tokens given an action. Genie 2 (December 2024) is an autoregressive
  latent diffusion model with a transformer dynamics model that turns a single image into a 3D world controlled
  by keyboard and mouse. Genie 3 (August 2025) generates frames auto-regressively in real time from a
  text prompt, keeps visual memory of earlier frames for about a minute so revisited places look the same,
  and accepts text ''promptable world events'' during play that add objects, characters, or weather changes.
  No explicit 3D scene or game state is stored; consistency comes from the frame history.'
key_results:
- text: Genie has 11B parameters trained on 30k hours of 2D platformer clips with 8 latent actions; it
    generates about 1 frame per second and has 16 frames of memory, which the paper lists as limitations.
  sources:
  - src-bruce-2024-genie
  confidence: high
- text: Genie 2 turns one image into a playable 3D world with water, smoke, gravity, lighting, door opening,
    and NPCs; worlds stay coherent for up to a minute, but most examples last 10 to 20 seconds.
  sources:
  - src-deepmind-2024-genie-2
  confidence: high
- text: Genie 3 renders 720p at 24 fps in real time, stays consistent for a few minutes with visual memory
    reaching back about one minute, and supports text prompts that change weather or add objects and characters
    mid-session; DeepMind lists limited action space and multi-agent interaction as open problems.
  sources:
  - src-deepmind-2025-genie-3
  confidence: high
- text: Project Genie opened Genie 3 to US Google AI Ultra subscribers on 2026-01-29 with a 60-second
    limit per world set by compute cost; a reviewer saw characters walk through walls and sometimes unresponsive
    controls, and copyrighted settings were refused.
  sources:
  - src-techcrunch-2026-project-genie
  - src-wikipedia-project-genie
  confidence: high
- text: Shares of video game companies, including Unity, fell after the Project Genie launch.
  sources:
  - src-wikipedia-project-genie
  confidence: medium
- text: Waymo built a world model on Genie 3 (February 2026) to simulate driving edge cases, controllable
    by driving action, scene layout, and language.
  sources:
  - src-wikipedia-genie-ai-model
  confidence: medium
