affects:
- id: weather
  effect: enables-new
  note: Genie 3's promptable world events change weather by text during a session with no weather simulation
    or authored weather assets; the change is visual only and has no stored state for crops, agents, or
    travel to read.
- id: storyteller-director
  effect: cuts-authoring-cost
  note: A director could inject an event (a new character, object, or condition) as a text prompt that
    Genie 3 renders into the running world, removing per-event art and animation; event selection and
    pacing still need a separate system with real state.
- id: procedural-terrain
  effect: enables-new
  note: Worlds come from a text or image prompt instead of a seed and noise pipeline, in any visual style;
    persistence is minutes long (about one minute of visual memory in Genie 3, 60-second sessions in Project
    Genie).
- id: direct-avatar
  effect: replaces-substrate
  note: First- or third-person character movement is rendered by the model from WASD, camera, and jump
    input; the action space is small and collisions are not guaranteed (characters passing through walls).
- id: rigid-body-physics
  effect: replaces-substrate
  note: Object responses such as doors opening, balloons bursting, water, and smoke are produced by learned
    video dynamics (Genie 2) rather than a physics engine, with no conservation or collision guarantees.
- id: generative-content
  effect: enables-new
  note: Whole explorable scenes, characters, and events are generated at runtime from player text, sketches,
    or photos, which extends generative content from text and items to playable space.
- id: god-powers
  effect: enables-new
  note: 'Promptable world events work as a free-form god power: typed text adds characters, objects, or
    weather to the running world; Genie 3 attaches no cost or rule to them and their effects exist only
    in rendered frames.'
limitations:
- 'Session length: Genie 2 coherence is usually 10 to 20 seconds; Genie 3 manages a few minutes; Project
  Genie caps exploration at 60 seconds because of compute.'
- 'No inspectable state: there are no variables for inventory, health, or object identity, so mechanics
  that need stocks or rules must live in a separate system.'
- Limited action space and no reliable multi-agent interaction (DeepMind's stated Genie 3 limitations).
- Access is a hosted research prototype for paying subscribers; no public API, price per hour, or on-device
  version is published.
- Guardrails refuse copyrighted settings and nudity, which constrains user-generated worlds.
