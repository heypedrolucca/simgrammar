id: simulation-based-inference
type: technique
name: Simulation-based inference for calibrating simulators
aliases:
- SBI
- neural posterior estimation
- likelihood-free inference
- ABM calibration
summary: Neural density estimators trained on simulator runs return a posterior over a simulator's parameters
  given observed data, calibrating agent-based and economic models whose likelihoods cannot be computed.
category: math-discovery
year: 2019
mechanism: 'Draw parameters theta from a prior, run the simulator to get outputs x, and train a conditional
  density estimator, usually a normalizing flow, to approximate p(theta | x) from the (theta, x) pairs
  (neural posterior estimation). Conditioning on observed data x_o gives the posterior; sequential variants
  such as APT draw new simulations from proposals concentrated near x_o. Related variants learn the likelihood
  or a likelihood ratio instead. Summary statistics can be hand-chosen or learned, for example with a
  temporal graph neural network over agent-level microstates. The method needs only forward runs, no likelihood
  and no gradients, and once trained it is amortized: a new observation gets its posterior in one forward
  pass.'
key_results:
- text: Cranmer, Brehmer and Louppe reviewed simulation-based inference as a general framework for inverse
    problems in simulators with intractable likelihoods.
  sources:
  - src-cranmer-2020-sbi-frontier
  confidence: high
- text: Automatic posterior transformation (APT) made sequential neural posterior estimation work with
    arbitrary, dynamically updated proposals and flow-based estimators, including on high-dimensional
    time series and images.
  sources:
  - src-greenberg-2019-apt
  confidence: high
- text: Neural posterior and neural ratio estimation gave state-of-the-art parameter inference for economic
    agent-based models from multivariate time series, where older likelihood-free methods needed hundreds
    of thousands of simulations.
  sources:
  - src-dyer-2024-bayesian-inference-economic-abm
  confidence: high
- text: Temporal graph neural networks learned ABM parameter posteriors directly from microdata, avoiding
    information loss from hand-chosen summary statistics.
  sources:
  - src-dyer-2022-abm-microdata-gnn
  confidence: medium
- text: The open-source sbi toolkit packages these estimators with diagnostics and defaults, needing only
    simulator samples.
  sources:
  - src-boelts-2025-sbi-reloaded
  confidence: medium
