affects:
- id: contagion
  effect: tunes
  note: Transmission, recovery and contact parameters can be inferred from real outbreak curves or target
    curves, with a posterior that shows which parameters the data cannot pin down.
- id: supply-demand-pricing
  effect: tunes
  note: Economic ABM parameters can be calibrated to price and quantity time series (Dyer et al.), grounding
    market sims in real data instead of hand-set elasticities.
- id: traffic-congestion
  effect: tunes
  note: Demand and route-choice parameters of an agent-based traffic model can be fitted to observed counts,
    the same likelihood-free ABM calibration applied to a city.
- id: attribute-match-engine
  effect: tunes
  note: Match-engine parameters can be fitted so simulated score and statistic distributions match real
    league data, with uncertainty on each parameter.
- id: food-web
  effect: tunes
  note: Predator-prey rates can be inferred from target population time series, so designers state desired
    oscillations and the posterior returns rates that produce them.
- id: adaptive-threat-scaling
  effect: tunes
  note: Treating target survival-time or loss-rate distributions from playtest telemetry as the observation,
    the posterior gives scaling parameters that reproduce them and how sensitive each one is.
deployed_in: []
limitations:
- Needs many simulator runs, from thousands to hundreds of thousands depending on method and dimensionality,
  which is costly for slow, full-scale game simulations.
- A misspecified simulator yields confident posteriors over wrong parameters; calibration fits the data
  and does not validate the model.
- Posterior quality depends on the summary statistics or learned embeddings of noisy, high-dimensional
  outputs.
- Matching real data or telemetry targets does not make a mechanic fun; it only removes guesswork about
  parameter values.
- No game studio use was found in this run's sources.
