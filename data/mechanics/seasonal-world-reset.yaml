id: seasonal-world-reset
type: mechanic
name: Seasonal world reset
aliases:
- wipes
- seasons
- Tellings
- server cycles
summary: A shared world runs for a bounded season and is then wiped and restarted, often with rule changes carried into the
  next season.
family: multiplayer-persistence
substrate:
- rule-system
definition: >-
  Owns the season's state: start date, an end condition (fixed duration, a scheduled wipe, or a world-level goal or catastrophe),
  and the carryover rules that say what survives into the next season (nothing, account-level unlocks, records, or changed
  rules). When the end condition fires, world state is archived or deleted, a new world is generated or loaded, and carryover
  is applied. A Tale in the Desert runs in Tellings that average about 18 months and end in a wipe, with rule changes for
  the next Telling shaped by what players achieved. Eco gives each world a meteor due in thirty days, so a server's run is
  bounded by stopping it or suffering the impact, and servers are commonly restarted as new worlds. Unlike persistent-world,
  which assumes continuity, this mechanic owns the bounded lifetime of a shared world and the transition between lifetimes.
player_experience: >-
  Fresh starts on a schedule. Everyone begins equal at the start of a season, so new players can matter, and the end date
  gives the season an arc of land rush, consolidation, and final push. Players plan around the wipe, deciding what is worth
  building when it will not last.
design_levers:
- season length or end condition
- 'carryover: nothing, cosmetics, account unlocks, records, or rule changes'
- rule variation between seasons, including player-proposed changes
- whether players can migrate between seasonal and permanent worlds
- announcement lead time before a wipe
failure_modes:
- Wipes erase work players were attached to, and some quit rather than start over.
- Short seasons reward a known opening rush, so seasons play out the same way.
- Carryover that is too generous rebuilds the early-arrival advantage the reset was meant to remove.
dynamics:
- Activity surges at season start and fades toward the end, giving the population a cycle.
- Players refine openings across seasons, and community guides target the first days of a wipe.
- Rule changes between seasons let designers and players treat each season as an experiment.
math_basis:
- mechanism-design
- game-theory
feedback: balancing
player_interface:
- observation
legibility: 5
emergence_potential: 2
authoring_cost: 2
compute_cost: 1
tuning_difficulty: 2
ai_leverage: 2
maturity: established
requires:
- persistent-world
open_questions:
- Could AI summaries and chronicles of past seasons preserve their history so wipes feel less like loss?
- Which carryover rules keep returning players motivated without restoring early-arrival dominance?
