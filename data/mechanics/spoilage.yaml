id: spoilage
type: mechanic
name: Spoilage
aliases:
- perishables
- food rot
- freshness
summary: Perishable goods lose value or rot over time depending on storage conditions such as temperature
  and containers.
family: resources-production
substrate:
- aggregate-stocks
- rule-system
definition: 'Each perishable item or stack carries a freshness value or age that advances each tick at
  a rate set by item type and storage conditions; at a threshold it becomes rotten, converts into a spoiled
  item, or is destroyed. RimWorld stops rot for food kept at or below 0 C, so walk-in freezers are standard;
  Don''t Starve moves food from fresh to stale to spoiled and finally to rot, with ice boxes slowing the
  clock; Factorio: Space Age gives biological items spoil times from about two hours down to a few minutes,
  cannot be delayed, turns spoiled items into Spoilage, and passes ingredient freshness on to recipe outputs.
  Inputs: item type, time, storage environment. Outputs: current freshness, value or effect scaling, and
  spoil events.'
player_experience: 'A clock on every stockpile. Players stop hoarding and start thinking in flow: produce
  close to consumption, build cold storage, preserve food, or accept waste. Opening a storeroom to find
  a harvest rotted is a sharp, memorable loss.'
design_levers:
- spoil time per item type
- storage modifiers such as temperature, containers, and preservation methods
- whether freshness is binary (fresh or rotten) or continuous and scales value
- 'what spoiled goods become: nothing, a waste item, or a useful input such as fertilizer'
- freshness inheritance across recipes
failure_modes:
- Spoilage that is cheap to stop, such as one freezer that halts all decay, becomes a one-time build tax.
- Short spoil times on items with long logistics routes make some chains impossible without explanation.
- Hidden freshness values make sudden losses feel unfair.
dynamics:
- Shifts optimal play from stockpiling to just-in-time throughput; Factorio's developers state that buffering
  is not helpful under spoilage.
- Cold storage couples food to power and temperature systems, so a power failure becomes a famine risk.
- Seasonal harvests plus spoilage create a winter preservation problem.
- Freshness-priority handling (pick freshest or oldest first) creates new logistics rules.
math_basis:
- system-dynamics
feedback: balancing
player_interface:
- observation
- placement
legibility: 4
emergence_potential: 2
authoring_cost: 2
compute_cost: 2
tuning_difficulty: 2
ai_leverage: 1
maturity: established
synergy:
- id: storage-capacity
  note: Storage conditions decide spoilage rates, making cold storage valuable.
open_questions:
- What spoil-time distribution across goods produces interesting routing without making long chains infeasible?
