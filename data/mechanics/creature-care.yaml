id: creature-care
type: mechanic
name: Creature care
aliases:
- virtual pet
- pet care
summary: The player directly feeds, cleans, and plays with a creature whose needs decay; neglect causes
  sickness, stunted growth, or death.
family: biology-health
substrate:
- agent-based
- aggregate-stocks
definition: 'Owns one or a few creatures, each with need meters (hunger, happiness, hygiene, health, discipline),
  a life stage, and often an affection or obedience value. Meters decay in game or real time, and the
  player restores them with direct care actions: feeding, cleaning, playing, giving medicine, or scolding.
  Neglect accumulates into sickness, a worse adult form, running away, or death. Tamagotchi (1996) shows
  hunger and happy meters and a discipline meter, leaves droppings that cause sickness if not cleaned,
  cures illness with medicine, and ages the pet through life stages in real time; Nintendogs adds stylus
  petting and voice-recognized commands; Seaman responds to the player''s speech. Inputs are care actions
  and elapsed time; outputs are the creature''s condition, form, and behavior.'
player_experience: Responsibility and attachment. The player checks in often, notices small changes, and
  feels guilt when the creature gets sick from being forgotten. Care is direct and tactile rather than
  managerial, and the creature's growth or decline mirrors the player's attention.
design_levers:
- number of needs and their decay rates in game or real time
- 'severity of neglect consequences: mood, sickness, altered growth, death, leaving'
- care actions available and whether they are menu choices or direct manipulation
- whether care quality shapes the adult form or personality
- pause or vacation options that suspend decay
failure_modes:
- Real-time decay with no pause punishes absence; the first Tamagotchi units could stop time only through
  the clock-setting mode.
- Once the optimal care routine is known, interactions become a checklist and attachment fades.
- Creatures with too few reactions repeat the same animations, breaking the illusion of a living pet.
dynamics:
- Check-in frequency becomes the main loop, coupling the game to the player's daily schedule.
- Care quality branching into different adult forms motivates replays and comparison between players.
- Shared or shown-off pets turn care quality into social status.
math_basis:
- system-dynamics
- control-theory
feedback: balancing
