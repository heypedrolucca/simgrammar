synergy:
- id: real-time-clock
  note: Wall-clock decay makes care a daily ritual and absence meaningful (Tamagotchi).
open_questions:
- Can language models give pets memory and open-ended conversational responses while keeping their needs
  legible?
- Does generated animation or behavior reduce the repetition that ends attachment?
