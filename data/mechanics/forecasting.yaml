id: forecasting
type: mechanic
name: Forecasting
aliases:
- projections
- runway estimate
- weather forecast
summary: The interface projects future states such as resource runway, budget balance, or upcoming weather.
family: information-legibility
substrate:
- ui-layer
- aggregate-stocks
definition: >-
  A forecaster computes and displays projected future values of selected variables: days of food left at current
  consumption, next period's budget balance, upcoming temperature or storms, population trend, or completion time
  for a project. It owns a forecast method, a horizon, and a refresh interval, but no simulation state. Common methods
  are runway (stock divided by net rate), linear extrapolation of recent trend, lookup of an authored or pre-rolled
  schedule of events, and rarely a short simulated lookahead. Outputs are numbers, countdowns, or projected curves.
  Canonical forms: Frostpunk's temperature forecast showing cold snaps days ahead, budget projections in SimCity
  and Cities: Skylines, turns-to-complete counters in Civilization, and Football Manager's projected finances.
player_experience: >-
  Monitoring turns into planning. The player sees the cliff before reaching it and acts early, buffers to the forecast
  horizon, and feels dread when the projection is grim. Surprise drops; preparation becomes the challenge.
design_levers:
- 'forecast method: runway, extrapolation, authored schedule, or simulated lookahead'
- horizon length
- accuracy and whether uncertainty is shown, such as ranges or confidence that improves with upgrades
- which variables get forecasts
- whether forecasts include the player's queued actions
- proactive display versus on demand
failure_modes:
- Linear extrapolation misleads when rates are seasonal or batched, producing false alarms or false security.
- Perfect forecasts of every threat turn disasters into checklists with no uncertainty.
- Noisy forecasts with no stated error teach players to ignore them.
dynamics:
- Players stock to the forecast horizon, so a forecast that underestimates causes synchronized shortfalls.
- Forecast crises create preparation sprints followed by slack, a characteristic rhythm in survival city builders.
- Shifting play from reactive to anticipatory raises the value of storage and buffers relative to throughput.
math_basis:
- system-dynamics
- probability-statistics
feedback: none
player_interface:
- observation
legibility: 4
emergence_potential: 1
authoring_cost: 1
compute_cost: 1
tuning_difficulty: 2
ai_leverage: 4
maturity: established
open_questions:
- Can a learned surrogate of the full simulation give cheap probabilistic forecasts (a 70 percent chance of famine
  within two seasons) for coupled systems that games now only extrapolate?
- What forecast accuracy maximizes preparation decisions without removing surprise?
