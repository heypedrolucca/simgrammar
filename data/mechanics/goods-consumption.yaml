id: goods-consumption
type: mechanic
name: Goods consumption
aliases:
- population needs
- demand for goods
- consumption baskets
summary: A population consumes goods at per-capita rates; unmet consumption lowers satisfaction or blocks
  advancement.
family: resources-production
substrate:
- aggregate-stocks
- agent-based
definition: 'Each household, residence, or population tier consumes a basket of goods at fixed per-capita
  or per-residence rates. Consumption draws from a market, warehouse, or delivered stock; the satisfied
  fraction of each need feeds population size, satisfaction, tax income, or eligibility to upgrade. Anno
  1800 splits needs into basic needs, which raise inhabitants per house, and luxury needs, which raise
  taxes and happiness, and requires full houses before residents advance a tier. Caesar III houses evolve
  only when supplied with several food types and goods such as pottery, furniture, oil, and wine, and
  devolve when supply lapses. Victoria 3 pops buy goods from a market to meet their needs. Inputs: population
  counts and supplied goods. Outputs: stock drawdown, fulfillment ratios, and growth or downgrade signals.'
player_experience: The population is a mouth the player must keep feeding at scale. Players compute production
  ratios, such as producers per hundred residents, and expand supply ahead of demand. Each tier upgrade
  raises income but adds new goods to the basket, so success creates the next shortage.
design_levers:
- consumption rate per capita for each good and how it scales with tier
- which needs are mandatory for population or upgrades versus optional bonuses
- substitutability between goods (any of several food types) versus strict requirements
- 'penalty curve for unmet needs: lost population, lower taxes, unrest, or downgrade'
- 'delivery path from stock to consumer: global pool, market radius, or walker delivery'
failure_modes:
- Fixed rates make ideal ratios solvable once, after which consumption becomes a spreadsheet exercise.
- Downgrade cascades, where one lapsed good devolves a district and collapses its labor supply, feel disproportionate.
- Too many required goods per tier create micromanagement that crowds out spatial decisions.
dynamics:
- 'Population growth raises consumption, which requires more production, which requires more workers:
  the expansion loop of Anno-style builders.'
- Tier requirements create layered dependency trees that couple distant islands or regions through trade.
- Shortages propagate to labor because unhappy or downgraded populations work less or leave.
math_basis:
- system-dynamics
- optimization
feedback: both
player_interface:
- observation
- placement
legibility: 3
emergence_potential: 3
authoring_cost: 2
compute_cost: 2
tuning_difficulty: 3
ai_leverage: 2
maturity: classic
synergy:
- id: population-strata
  note: Each tier consumes new goods, so advancement drives production expansion (Anno).
open_questions:
- Can learned demand models give populations preferences that shift with culture and events instead of
  fixed baskets?
- What is the smallest basket that still produces interesting supply-chain planning?
