id: surface-work-tools
type: mechanic
name: Surface work tools
aliases:
- cleaning sim
- painting tools
- coverage tools
summary: The player applies a tool to surfaces to clean, paint, or strip them, and a per-surface coverage state shows visible
  progress toward completion.
family: operation-procedure
substrate:
- cellular-grid
- continuous-physics
definition: >-
  Each surface carries a coverage mask (a texture or vertex grid) storing remaining dirt, paint, or material per cell, sometimes
  in several layers with different hardness. The tool casts a footprint with radius, falloff, and strength, and each frame
  it reduces or adds coverage under the footprint, scaled by distance, angle, and tool type versus layer type. Objects report
  the percentage done and count as complete past a threshold. PowerWash Simulator has four nozzles with different power and
  spray width, dirt types (dirt, grime, lichen, moss, rust), surface-specific soaps, progress bars per object and level, and
  a highlight for remaining dirt. House Flipper uses the same pattern for cleaning and painting walls; Hardspace: Shipbreaker's
  laser cutter is a cutting variant in which cutting electrical wires or coolant pipes can cause an explosion. Inputs: tool
  parameters and aim. Outputs: coverage state and completion events tied to payment.
player_experience: >-
  Calm, absorbing, visibly productive work. Players sweep a tool across grime and watch clean surface appear, chase the last
  stubborn patches, and feel satisfied when an object pings complete. The appeal is relaxation and order, not challenge.
design_levers:
- tool footprint size, strength, and falloff
- layer types and which tools or consumables work on them
- completion threshold per object
- remaining-coverage highlighting and other assists
- texture resolution of the coverage mask
- tool upgrades and their price
failure_modes:
- High completion thresholds turn the last few percent into a hunt for invisible specks; PowerWash Simulator added a highlight
  for this.
- Weak tools or huge areas make sessions drag.
- Consumables with unclear benefits feel pointless; reviewers criticized PowerWash Simulator's soap system.
dynamics:
- Players develop efficient sweep patterns, a real coverage-path optimization.
- Tool upgrades change which strategy is efficient, renewing early levels on replay.
- Completion feedback rewards perfectionism, which is the core motivation loop.
math_basis:
- optimization
feedback: none
player_interface:
- embodied-skill
- direct-manipulation
legibility: 5
emergence_potential: 1
authoring_cost: 3
compute_cost: 2
tuning_difficulty: 2
ai_leverage: 2
maturity: emerging
open_questions:
- Can generative texture models produce varied dirt and wear layouts on arbitrary scanned objects to cut level-authoring cost?
- Which feedback cues sustain the relaxation loop across long sessions?
