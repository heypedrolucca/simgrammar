ai_leverage: 3
maturity: established
synergy:
- id: modular-assembly
  note: Rating the assembled design closes the build-test loop.
- id: structural-integrity
  note: Stress and load ratings turn structural rules into a score (Poly Bridge).
open_questions:
- Can a learned critic rate open-ended designs on qualities like elegance or thrill that hand formulas
  miss, without becoming a new exploit target?
- Does showing per-term contributions to a score widen or narrow the range of designs players explore?
