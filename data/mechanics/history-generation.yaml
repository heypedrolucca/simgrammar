  note: Generated terrain constrains where simulated civilizations settle, fight, and leave ruins.
open_questions:
- Can language models turn coarse simulated histories into readable myths and chronicles without contradicting
  the record?
- What is the cheapest history abstraction that still yields grudges and relationships players recognize
  in play?
