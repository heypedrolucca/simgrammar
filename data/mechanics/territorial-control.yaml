id: territorial-control
type: mechanic
name: Territorial control
aliases:
- province ownership
- occupation and annexation
- claims and integration
- coring
summary: Map regions have an owner and a current controller; occupation flips control in war, and peace, purchase, or integration
  transfers ownership at a cost in time, unrest, or political currency.
family: conflict-defense
substrate:
- network-graph
- rule-system
- aggregate-stocks
definition: >-
  Owns, per map region (province, county, state, star system, city), an owner, a controller, and an integration state such
  as core, claim, incorporated, or newly conquered, plus claims that other factions hold on it. Military presence or a completed
  siege sets the controller; ownership changes only through a peace settlement, inheritance, purchase, or capture rule; and
  a newly owned region ramps from low to full integration over time or for a price, yielding less and generating more unrest
  until then. Europa Universalis IV separates owner from controller, makes new provinces costly to core with administrative
  power, and counts uncored land toward overextension, which raises unrest. Crusader Kings III ties counties to titles and
  de jure claims and adds a county control value that drops after conquest. Victoria 3 incorporates states over time; Hearts
  of Iron IV separates core from occupied states; Stellaris takes systems by building outposts and spends influence on claims
  against rivals. Unlike faction-diplomacy, which owns relations between factions, this mechanic owns who holds each piece
  of the map.
player_experience: >-
  Expansion has a shape and a hangover. The player plans conquests around claims, watches borders shift as sieges complete,
  then spends years digesting new land before it pays off. The map itself becomes the scoreboard, and an overstretched realm
  with restless new provinces is a visible warning to slow down.
design_levers:
- separation of owner and controller, and what occupation alone grants
- 'integration path: time, a currency such as administrative power or influence, or culture and religion matching'
- 'penalties for unintegrated land: reduced output, unrest, overextension, or rebel spawns'
- claim types and how claims are created, fabricated, inherited, or expire
- 'region granularity: provinces, counties, states, systems, or cities'
failure_modes:
- Integration costs too low make snowballing conquest the only strategy; too high and expansion stops being worth it.
- Border gore and fragmented holdings from inheritance or peace deals become tedious to manage without consolidation tools.
- Players treat the map as a coloring exercise and ignore the systems that integration was meant to engage.
dynamics:
- Conquest snowballs because new land adds resources and manpower, while integration costs and unrest apply the brake.
- Claims and de jure boundaries steer wars toward historically plausible borders.
- Occupation without ownership creates leverage for peace negotiations, coupling the map to war score.
math_basis:
- game-theory
- system-dynamics
feedback: both
player_interface:
- orders
- observation
legibility: 3
emergence_potential: 4
authoring_cost: 2
compute_cost: 2
tuning_difficulty: 4
ai_leverage: 2
maturity: classic
open_questions:
- Could AI factions that reason about claims and integration costs expand in ways players read as purposeful rather than greedy?
- What integration model keeps conquest consequential without becoming a waiting timer?
