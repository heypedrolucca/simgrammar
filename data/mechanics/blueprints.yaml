synergy:
- id: conveyor-transport
  note: Stamping solved belt layouts lets players scale proven designs instead of re-solving them.
- id: content-sharing
  note: Shareable blueprint strings created whole communities of design exchange.
open_questions:
- Can generative models produce valid blueprints from a goal such as a 45 per second green circuit block,
  and does that remove or relocate the design puzzle?
- How should parameterized blueprints be represented so designs adapt to terrain and recipes without becoming
  full programming?
claims:
- text: Factorio's blueprint library keeps a player's blueprints across saves, shares them with other
    players in multiplayer, and separately holds save-specific game blueprints.
