id: storyteller-director
type: mechanic
name: Storyteller director
aliases:
- AI director
- AI storyteller
- drama manager
summary: A director AI chooses which events to fire and when, pacing them by a model of tension and the current state.
family: narrative-generation
substrate:
- stochastic-events
- rule-system
definition: >-
  A director process tracks a pacing signal and runs a cycle that selects incidents from a catalog. Left 4 Dead's AI Director
  keeps an emotional intensity value per survivor that rises with damage, incapacitation, and nearby infected deaths and decays
  when not engaged; it cycles through Build Up (full threat until peak intensity), Sustain Peak (3-5 s), Peak Fade, and Relax
  (30-45 s of minimal spawns), spawns mobs every 90-180 s on Normal, and deals boss events (Tank, Witch, nothing) along the
  route. RimWorld storytellers weigh colony wealth, colonists, recent deaths or wounds, and time since the last major event;
  incident chance is a base chance times a population-intent factor, and presets differ (Cassandra escalates in cycles, Phoebe
  leaves long gaps, Randy is irregular). The director decides when and what; magnitude usually comes from adaptive threat
  scaling. Outputs: incident firing, spawn populations, item placement, music cues.
player_experience: >-
  Play has a rhythm of pressure and relief that feels authored even though it is generated. Players use calm windows to build
  and heal, brace when calm runs long, and talk about storytellers as personalities with moods and grudges.
design_levers:
- 'pacing signal: per-player intensity, time since last threat, or colony state'
- phase thresholds and durations for build-up, peak, and relaxation
- incident catalog, base weights, and state conditions such as population intent
- selectable presets that change cycle shape and randomness
- randomness floor and mercy rules after heavy losses
failure_modes:
- Fixed cycles become predictable, and players learn to exploit relax windows.
- Irregular presets can stack several hard events, which feels unfair when combined with permadeath.
- Heavy rubber-banding makes skill feel irrelevant because the director compensates for good play.
dynamics:
- Pressure and relief cycles create natural story beats that players retell as chapters.
- Combined with persistent injuries and permadeath, a poorly timed second incident starts cascades that become memorable runs.
- Players manipulate the director's inputs, such as population or wealth, to shape which incidents it can choose.
math_basis:
- control-theory
- markov-stochastic
- probability-statistics
feedback: balancing
player_interface:
- observation
- parameter
legibility: 3
emergence_potential: 4
authoring_cost: 3
compute_cost: 1
tuning_difficulty: 4
ai_leverage: 4
maturity: established
open_questions:
- Can a language-model director author new incidents conditioned on colony state and characters, not just select from a catalog?
- Can learned models of player stress from play telemetry replace hand-built intensity formulas?
- How should a director balance dramatic pacing against fairness when deaths are permanent?
