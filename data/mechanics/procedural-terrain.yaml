maturity: classic
open_questions:
- Can generative models trained on real elevation data or player-favored maps produce terrain with more recognizable structure
  than noise?
- How should learned generators keep fairness constraints, such as guaranteed resources near spawn, that rule-based pipelines
  enforce directly?
