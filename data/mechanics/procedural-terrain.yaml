id: procedural-terrain
type: mechanic
name: Procedural terrain
aliases:
- map generation
- worldgen terrain
- heightmap generation
summary: Maps are generated from a seed through noise, erosion, climate, and placement rules.
family: world-generation
substrate:
- cellular-grid
- stochastic-events
definition: >-
  A seeded pipeline builds layered fields over a grid or chunks: elevation from fractal noise or midpoint displacement, then
  derived temperature, rainfall, drainage, and biome classification, then rivers, ores, vegetation, and points of interest
  placed by rules. Perlin gradient noise (1985) is the basis of most heightmaps; Minecraft samples noise per chunk on demand
  for an effectively endless world. Dwarf Fortress starts from a randomized fractal elevation map, adds temperature, rainfall,
  drainage, vegetation, and salinity layers, traces rivers by erosion from mountains to oceans, and models rain shadows. Inputs:
  seed, size, and parameters such as sea level or mineral frequency. Outputs: terrain, biome, and resource maps used by construction,
  pathfinding, and ecology systems.
player_experience: >-
  Each start is new ground to read: players scout for flat land near water, ore, and defensible chokepoints, and share seeds
  with unusual landforms. Exploration means something because no guide has mapped this world.
design_levers:
- noise type, octaves, frequency, and amplitude
- erosion and hydrology passes
- climate model for temperature, rainfall, and biome thresholds
- resource and point-of-interest placement rules and guaranteed fairness constraints
- world size and whether generation is finite or chunked on demand
- player-exposed parameters and seed sharing
failure_modes:
- Pure noise produces terrain with no recognizable structure that players stop finding interesting after a few runs.
- Unconstrained placement yields unfair or unplayable starts, such as no water or no ore near the spawn point.
- Version updates that change the generator break seed sharing and older saves at chunk borders.
dynamics:
- Terrain shapes where settlements, roads, and defenses go, so map features drive later strategy.
- Communities trade seeds and rank them, turning generation into shared content.
- Resource scarcity set at generation time determines the pace of mid-game economies.
math_basis:
