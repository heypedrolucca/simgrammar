  confidence: medium
- text: Opus Magnum ranks solutions on cycles, cost, and area, and players combine them in an unofficial
    sum statistic.
  sources:
  - src-wikipedia-opus-magnum
  confidence: medium
- text: Zachtronics deliberately offers no in-game rewards for optimization in Opus Magnum, so players
    who optimize do so for intrinsic reasons.
