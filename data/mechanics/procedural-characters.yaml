id: procedural-characters
type: mechanic
name: Procedural characters
aliases:
- character generation
- pawn generation
- procedural NPCs
summary: Characters are generated with names, backstories, traits, skills, and appearance sampled from constrained tables
  or grammars.
family: world-generation
substrate:
- stochastic-events
- rule-system
definition: >-
  A generator samples a character record from tables and rules: name from culture-specific lists or grammars, age, appearance
  parameters, traits under compatibility constraints, skills, and backstory fragments that modify the other fields. RimWorld
  gives every pawn a childhood backstory and, if generated at 20 or older, an adulthood backstory; each adds flat skill bonuses,
  disables or enables work types, and grants or forbids traits, and 25% of regular pawns and all faction leaders first try
  a fixed player-made bio before falling back to shuffled ones. Dwarf Fortress generates personalities, preferences, and appearance;
  The Sims and Crusader Kings generate townies and courtiers. Inputs: faction or culture, role requirements, random seed.
  Outputs: a character record consumed by needs, skills, and social systems.
player_experience: >-
  Each new arrival is a small unwrapping. Players read the backstory and traits, decide whether to recruit, and form a picture
  of the person that makes later events personal. Rerolling starting characters is itself a common ritual.
design_levers:
- number of trait, skill, and backstory fragments, and their compatibility constraints
- how strongly backstory fragments change mechanics such as skills and disabled work
- share of fixed, hand-written or community-written characters versus fully generated ones
- name and appearance generators per culture
- player rerolls and edits at game start
failure_modes:
- Small fragment pools repeat, and players recognize the same backstories across runs.
- Incompatible combinations produce incoherent characters, such as a pacifist whose backstory is soldier.
- Mechanically weak characters feel like dead weight, which drives heavy rerolling.
dynamics:
- Disabled work types and traits force colony role planning around the people who arrive.
- Generated quirks seed conflicts once relationships and mood systems act on them.
- Community-submitted fixed characters appear across many players' games, creating shared recognizable figures.
math_basis:
- probability-statistics
- procedural-noise
- combinatorics
feedback: none
player_interface:
- observation
- parameter
legibility: 4
emergence_potential: 3
authoring_cost: 3
compute_cost: 1
tuning_difficulty: 2
ai_leverage: 4
maturity: classic
open_questions:
- Can language models generate backstories that stay consistent with the mechanical traits and skills they imply?
- How many independent fragments are needed before players stop recognizing repeats?
