id: byproducts-waste
type: mechanic
name: Byproducts and waste
aliases:
- waste products
- secondary outputs
- garbage
summary: Production emits secondary outputs such as sludge, garbage, heat, or spent fuel that must be
  handled or they impair the system.
family: resources-production
substrate:
- aggregate-stocks
- rule-system
definition: 'A recipe or activity emits one or more secondary outputs alongside its primary product, at
  a fixed ratio per cycle or per capita. The byproduct accumulates in a local output buffer or tile stock;
  when that stock hits a cap, the producer stalls, degrades, or releases it into the environment. The
  player must route it to a consumer, a sink (incinerator, landfill, vent), or a converter. In Oxygen
  Not Included a Natural Gas Generator burning 90 g/s of natural gas yields 800 W plus 67.5 g/s of polluted
  water and 22.5 g/s of carbon dioxide that must be piped away or vented into the base. In Factorio oil
  processing yields heavy oil, light oil, and petroleum gas together, so an unconsumed output backs up
  and halts the refinery. In Cities: Skylines buildings generate garbage that trucks must collect or it
  accumulates and flags the building as a problem. Inputs: production cycles or population. Outputs: a
  waste stock and an impairment signal (stall, pollution, illness, abandonment).'
player_experience: Every new building arrives with a cleanup problem attached. The player learns to ask
  where the waste goes before placing a producer, and designs sinks, reuse loops, or disposal districts.
  A full output buffer stopping a whole line teaches that the unwanted product sets the pace of the wanted
  one.
design_levers:
- byproduct ratio per cycle and whether it scales with efficiency upgrades
- buffer size before the producer stalls or starts releasing waste into the environment
- whether the byproduct is pure waste, a sellable good, or an input to another chain
- available sinks and their costs, such as incinerators, landfills, vents, or voiding
- 'the impairment when unhandled: production stall, pollution, disease, morale loss, or abandonment'
failure_modes:
- A cheap sink that destroys anything removes the problem and turns the mechanic into a one-time build
  tax.
- Byproducts with no use and no penalty become clutter that players ignore.
- Fixed-ratio multi-output recipes deadlock silently when one output has no consumer, and the stall appears
  far from its cause.
- Waste that only matters late, such as a full landfill or spent nuclear fuel, surprises players who built
  for hours without a disposal plan.
dynamics:
- Waste outputs become inputs elsewhere, so industrial clusters form around reuse loops (polluted water
  to a water sieve in Oxygen Not Included, heavy oil cracked to light oil in Factorio).
- Disposal capacity becomes a hidden ceiling on growth, separate from input supply.
- Coupled with pollution spread, unhandled byproducts shift cost onto neighbors and land value.
- Players overbuild storage for byproducts as a buffer, trading space for time before the next fix.
math_basis:
- system-dynamics
- optimization
feedback: balancing
player_interface:
- placement
- observation
legibility: 3
emergence_potential: 3
authoring_cost: 2
compute_cost: 2
tuning_difficulty: 3
ai_leverage: 2
maturity: established
synergy:
