id: immigration-attractiveness
type: mechanic
name: Immigration by attractiveness
aliases:
- migration
- attractiveness
- settler arrivals
summary: >-
  Population arrives or leaves based on attractiveness such as jobs, housing, and happiness relative to alternatives.
family: population-lineage
substrate:
- aggregate-stocks
- agent-based
- stochastic-events
definition: >-
  Owns an attractiveness score per settlement or region, computed from jobs, housing vacancy, wages or standard of living,
  services, happiness, and reputation, and a flow rule that turns the score difference against an outside reference or other
  regions into arrivals and departures per period. Arrivals usually need free housing, and departures follow sustained low
  scores. In Micropolis, the SimCity engine, residential migration rises and falls with employment, the ratio of jobs to residents.
  Victoria 3 moves pops within a market toward states with higher migration attraction, set mainly by standard of living,
  while migration laws filter who may move. RimWorld instead adds colonists through storyteller events such as wanderers joining.
  Inputs: jobs, housing, satisfaction, policy. Outputs: population inflow and outflow by type.
player_experience: >-
  The player grows population indirectly by making the place worth moving to, and loses it the same way. Growth feels earned
  and fragile: a housing shortage or unemployment spike shows up as people leaving.
design_levers:
- factors in the attractiveness score and their weights
- 'reference point: a fixed outside world, competing regions, or other players'
- flow elasticity per unit of score difference
- housing requirement and arrival batch size
- 'selectivity: which classes, cultures, or skills migrate, and policy filters'
failure_modes:
- 'Overshoot: migration responds fast to jobs, then unemployment spikes, then emigration, oscillating.'
- Unconditional arrivals make population trivially easy and remove the planning puzzle.
- Opaque scores leave players unable to tell why people leave.
- Mass arrivals overwhelm services in one step and trigger cascades.
dynamics:
- >-
  Growth raises demand for services and jobs, which lowers attractiveness until supply catches up, a balancing loop.
- Booms and busts as migration lags job creation.
- 'Inter-regional competition: improving one region drains its neighbors.'
math_basis:
- system-dynamics
- population-dynamics
feedback: balancing
player_interface:
- observation
- placement
legibility: 3
emergence_potential: 3
authoring_cost: 1
compute_cost: 1
tuning_difficulty: 3
ai_leverage: 2
maturity: classic
open_questions:
- >-
  Can migration models calibrated to real census or survey data make city builders useful for planning education without hurting
  playability?
- How should attractiveness be explained so players can attribute departures to causes?
