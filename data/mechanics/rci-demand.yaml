  note: The demand meter tells the player which zone to paint next; zoning answers it.
open_questions:
- Would demand derived bottom-up from simulated households and firms be more interesting than a three-valve
  controller, and could players still read it?
- Can an AI advisor turn valve inputs into a plain causal explanation of why demand is low?
