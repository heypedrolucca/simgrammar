id: social-exchanges
type: mechanic
name: Social exchanges
aliases:
- social moves
- social interactions
- social games
summary: >-
  Discrete social moves such as flirt, insult, or apologize have preconditions on social state and norms, and they update
  relationships.
family: social-relations
substrate:
- rule-system
- agent-based
definition: >-
  Owns a library of social exchange definitions, each with an intent, preconditions on the social state, initiator and responder
  desire rules, and effects for acceptance and rejection on relationships, statuses, and history. Each cycle an agent scores
  the exchanges it could start with each other agent, picks one, the responder evaluates acceptance, and the outcome is written
  to state and history. Comme il Faut in Prom Week defines exchanges with one intent, hard preconditions, initiator and responder
  influence rule sets, and at least accept and reject instantiations; volition sums the weights of over 5,000 influence rules
  across 34 statuses and 44 traits. RimWorld rolls chitchat, deep talk, slights, and insults with weights from opinion and
  compatibility; The Sims 3 defined hundreds of interactions from thousands of production rules (Evans, GDC 2010). Inputs:
  social state, traits, history. Outputs: relationship and status changes, logged events.
player_experience: >-
  The player chooses moves in a social puzzle, or watches agents make them, and learns the norms that make a move land. Rejections
  and backfires are part of the fun, and players develop social strategies such as softening a target before the big ask.
design_levers:
- size of the exchange library and intents covered
- precondition strictness and which norms or statuses gate moves
- volition rule weights for initiators and responders
- effect magnitudes for accept and reject outcomes
- 'player control: choose moves, suggest, or only watch'
failure_modes:
- Small libraries repeat the same exchanges until characters feel scripted.
- Rule weights interact unpredictably across thousands of rules, so authors cannot predict outcomes.
- Exchanges change numbers without visible performance, so moves feel interchangeable.
- 'Spam: repeating the best-scoring move maxes relationships.'
dynamics:
- >-
  Logged exchanges become history that later rules reference, so past insults enable future revenge moves.
- Status effects spread socially, so one embarrassing exchange changes how a group treats a character.
- >-
  Exchange outcomes drive relationship values, which change the next exchange's odds, producing escalating arcs.
math_basis:
- utility-decision
- social-network
feedback: both
player_interface:
- choice-cards
- observation
legibility: 3
emergence_potential: 4
authoring_cost: 4
compute_cost: 2
tuning_difficulty: 4
ai_leverage: 4
maturity: established
requires:
- relationship-values
open_questions:
- >-
  Can language models generate performances and new exchange types on the fly while a symbolic layer keeps preconditions and
  effects consistent?
- Can influence-rule weights be learned from player judgments of plausibility rather than authored?
