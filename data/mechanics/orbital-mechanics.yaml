id: orbital-mechanics
type: mechanic
name: Orbital mechanics
aliases:
- orbital dynamics
- astrodynamics
- patched conics
summary: Bodies move under gravity, and maneuvers spend delta-v to change orbits, intercepts, and transfers.
family: physics-materials
substrate:
- continuous-physics
definition: Each body holds a position and velocity under gravity. Under the patched conic approximation,
  used by Kerbal Space Program, each celestial body has a sphere of influence; inside it only that body's
  gravity is modeled, so the trajectory is an analytic conic propagated on rails, and segments are joined
  at sphere boundaries by matching position and velocity. This turns the n-body problem into a chain of
  two-body problems and cannot represent Lagrange points. Full n-body integration, as in Universe Sandbox
  or the Principia mod for Kerbal Space Program, integrates every body's gravity numerically. Engine burns
  change velocity, the rocket equation sets the delta-v budget, and maneuver planners preview the orbit
  that a planned burn will produce.
player_experience: A counterintuitive system that becomes mastery. Players learn that speeding up raises
  the far side of the orbit, plan burns on maneuver nodes, and earn rendezvous and landings through precise
  planning.
design_levers:
- patched conics or n-body integration
- scale of the system; Kerbal Space Program uses a planet with a 600 km radius
- time warp limits and whether thrust is allowed during warp
- maneuver planning tools and how much they automate
- atmospheric drag and its coupling to orbits
failure_modes:
- Many players never get past the learning cliff without external tutorials.
- Patched conics cannot model Lagrange points or halo orbits, which surprises experienced players.
- Floating-point precision at solar-system distances causes jitter unless the engine re-centers the origin.
dynamics:
- Transfer windows create timing pressure and missions that run in parallel.
- Delta-v couples orbital planning to vehicle design, so mission ambition shapes the rocket.
- Gravity assists and aerobraking reward players who learn the system deeply.
