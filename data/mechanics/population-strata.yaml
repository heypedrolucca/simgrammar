id: population-strata
type: mechanic
name: Population strata
aliases:
- population tiers
- social classes
- citizen tiers
summary: The population is divided into classes or tiers with distinct needs, roles, and upgrade paths.
family: population-lineage
substrate:
- aggregate-stocks
- rule-system
definition: >-
  Owns population counts by stratum and the per-stratum tables of needs, consumption rates, labor roles, taxes, and promotion
  requirements. Each period residences or pops whose stratum's needs are met may advance to the next stratum, and unmet needs
  can stall, demote, or anger them; production buildings require workers of specific strata. Anno 1800 residences advance
  from Farmers through Workers, Artisans, and Engineers to Investors (with Jornaleros and Obreros in the New World) when the
  house is full, basic needs are met, and construction materials exist; luxury needs raise taxes and happiness, and island
  level follows the highest tier, such as 1,750 Investors for a metropolis. Victoria 3 groups professions into classes and
  strata whose standard-of-living expectations drive radicalism. Inputs: goods, services, construction materials. Outputs:
  workforce by tier, tax revenue, demand for higher goods.
player_experience: >-
  Growth is climbing: each tier unlocks goods and buildings but also new demands, so the player keeps lower tiers staffed
  while serving the elite. Unmet needs at the top cost revenue, and neglect at the bottom stalls production.
design_levers:
- number of strata and promotion requirements
- per-stratum needs, consumption rates, and tax yields
- workforce requirements per building by stratum
- demotion or unrest rules when needs fail
- whether promotion is player-triggered or automatic
failure_modes:
- >-
  Upgrading drains lower-tier workers, collapsing basic production; Anno players learn to keep a surplus of each worker type.
- Top-tier demand chains become so long that one missing good stalls the economy.
- Strata as pure progression gates feel like a checklist rather than a society.
dynamics:
- Each new tier lengthens production chains, so economic complexity grows with population.
- Inequality between tiers creates political pressure when strata link to interest groups or unrest.
- Promotion and demotion cycles oscillate around supply shortfalls.
math_basis:
- system-dynamics
- optimization
feedback: both
player_interface:
- observation
- placement
- orders
legibility: 4
emergence_potential: 3
authoring_cost: 3
compute_cost: 1
tuning_difficulty: 3
ai_leverage: 2
maturity: established
open_questions:
- >-
  Can strata emerge from agent wealth and occupation dynamics rather than authored tiers, and remain legible?
- >-
  How should mobility between strata be modeled so inequality has political consequences without becoming a death spiral?
