id: gossip-propagation
type: mechanic
name: Gossip propagation
aliases:
- rumor spread
- information diffusion
- knowledge propagation
summary: Information about events spreads through social contacts, changing what agents know and believe.
family: social-relations
substrate:
- network-graph
- agent-based
- stochastic-events
definition: 'Owns per-agent knowledge sets (facts, rumors, beliefs about events or other agents), optionally
  with source and confidence, and the social graph they travel over. When two agents interact, each fact
  the speaker holds passes with a probability set by salience, relationship, and personality, possibly
  distorted; receiving a fact can trigger opinion or memory updates. Most games skip this and treat events
  as known to all: Comme il Faut''s social facts database in Prom Week records every event as known to
  every character. Generative Agents (2023) shows diffusion through language-model conversation: over
  two game days, awareness of a Valentine''s Day party grew from 1 to 13 of 25 agents and of a mayoral
  candidacy from 1 to 8. Inputs: interactions, event salience, the social graph. Outputs: who knows what,
  reputation and opinion effects that lag the event, misinformation.'
player_experience: 'Actions have a spreading radius: a crime matters once someone talks, so the player
  manages witnesses, timing, and who to tell. Watching news reach a rival late creates suspense and room
  for deception.'
design_levers:
- transmission probability per interaction and decay of salience over time
- 'graph structure: who talks to whom in households, workplaces, and gathering places'
- distortion rate and whether sources are tracked
- which facts are worth gossip and how they change opinions
- player tools to plant, suppress, or trace rumors
failure_modes:
- Slow or patchy propagation makes consequences feel disconnected from actions.
- Untraceable chains make reputation changes look random.
- Tracking every fact for every agent costs memory and update time in large populations.
- Language-model gossip can invent facts that never happened and corrupt game state.
dynamics:
- Information cascades through social hubs such as innkeepers and leaders, so centrality determines influence.
- Lagged knowledge lets players act before consequences arrive, enabling crime, deception, and damage
  control.
- Distorted rumors create conflicts over events that did not happen as told.
math_basis:
- social-network
- epidemiology
- information-theory
feedback: reinforcing
player_interface:
