synergy:
- id: reputation
  note: Reputation travels through gossip, so deeds have audiences.
- id: relationship-values
  note: What agents hear about each other changes how they feel.
open_questions:
- Can language-model gossip be constrained to facts in the simulation log while keeping distortion as
  a designed, tunable variable?
- What propagation speed makes consequences feel both earned and suspenseful?
