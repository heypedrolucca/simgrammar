id: rival-firms
type: mechanic
name: Rival firms
aliases:
- AI competitors
- competing companies
summary: AI or player competitors contest markets, prices, and assets; market share decides who wins.
family: economy-finance
substrate:
- agent-based
definition: Owns one or more competitor companies, each with cash, assets, market presence, and strategy
  parameters such as aggressiveness, expansion rate, and pricing policy. Each turn or tick a rival evaluates
  opportunities, builds or buys capacity, sets prices, and competes for the same customers, so market
  share splits by relative price, quality, coverage, and brand. Rivals can go bankrupt, be bought, or
  buy the player. Railroad Tycoon (1990) has rival railroad barons who try to drive the player out through
  stock dealings and rate wars. Capitalism (1995) lets the player set rivals' competence and managerial
  style from very aggressive to conservative and makes being bought out a loss. Transport Tycoon's AI
  companies build competing routes, and Offworld Trading Company's rivals contest the same resources and
  prices.
player_experience: Having someone to beat. The player watches rivals enter their markets, cuts prices
  or raises quality to hold share, and sometimes waits for a rival to overextend before striking. Victory
  becomes relative, which gives the sandbox a scoreboard.
design_levers:
- number of rivals and their strategy profiles (aggressive, conservative, specialist)
- whether rivals obey the same rules and economics as the player or receive bonuses
- 'responsiveness: how quickly rivals react to price cuts or new entrants'
- 'interaction channels: price, location, stock, sabotage, poaching staff'
- bankruptcy and merger rules for rivals
failure_modes:
- Passive AI that never contests markets turns competition into decoration.
- AI that receives hidden resource bonuses feels unfair once players notice it.
- Rivals that keep building in unprofitable markets go bankrupt early and leave the player alone.
dynamics:
- Price wars drive margins toward zero until one firm exits, after which prices rebound.
- Market leaders gain economies of scale that compound their lead.
- Rivals entering a player's niche push the player to diversify into new markets.
math_basis:
- game-theory
- utility-decision
feedback: both
player_interface:
