id: god-powers
type: mechanic
name: God powers
aliases:
- miracles
- divine intervention
- spells
summary: The player spends a power resource on miracles that alter terrain, weather, or creatures.
family: control-automation
substrate:
- rule-system
- aggregate-stocks
definition: 'The player is an external force that cannot command agents directly but can cast powers on
  the world. State owned: a power pool (mana, belief, prayer power) and the set of unlocked powers with
  costs and cooldowns. The pool fills from a simulation quantity, typically the number or devotion of
  followers, and casting spends it to apply an effect at a target: raise or lower land, flood, earthquake,
  swamp, volcano, rain, lightning, heal, or summon. Effects then propagate through the other systems (terrain,
  hydrology, population). Canonical forms: Populous, where raising and lowering land is the basic power,
  mana comes from followers building houses, and more mana unlocks earthquakes, floods, swamps, and volcanoes;
  Black & White, where worshipping villagers generate power for miracles cast by gesture; From Dust; WorldBox.'
player_experience: The player feels large and indirect. Problems are solved by reshaping the world rather
  than ordering people, and destruction is satisfying. The loop of growing followers to earn more power
  to help or punish them gives a sense of patronage.
design_levers:
- 'power source: followers, belief, devotion, or time'
- cost, area, and cooldown per power
- unlock order of powers
- whether powers are destructive, constructive, or both
- 'casting input: menu, gesture, or physical manipulation'
- how much the world's systems amplify or resist each power
failure_modes:
- One dominant power used repeatedly trivializes opponents.
- Gesture recognition that misreads input makes casting frustrating and unreliable under pressure.
- Powers with fixed scripted effects feel like animations rather than interventions in a simulation.
dynamics:
- 'Follower-funded power creates a reinforcing loop: help followers grow to gain power to help them more.'
- Terrain-altering powers chain into hydrology and settlement systems, such as floods that relocate a
  whole population.
- In competitive god games, power denial (reducing enemy followers) matters as much as casting.
math_basis:
- system-dynamics
feedback: reinforcing
player_interface:
- direct-manipulation
- choice-cards
legibility: 4
emergence_potential: 3
authoring_cost: 3
compute_cost: 2
tuning_difficulty: 3
ai_leverage: 3
maturity: classic
synergy:
- id: terraforming
  note: Miracles that raise land or move water are terraforming delivered as power.
open_questions:
- Can players describe a miracle in language and have a generative system produce effects grounded in
  the world's physics rather than from a fixed list?
- How do learned agents that react to miracles, such as fear or worship, change the follower loop?
