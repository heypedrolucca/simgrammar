id: corruption-leakage
type: mechanic
name: Corruption leakage
aliases:
- corruption
- waste
- graft
summary: A corruption level driven by spending, administrative reach, or size removes a share of revenue or output
  until countermeasures bring it down.
family: governance-policy
substrate:
- aggregate-stocks
definition: >-
  Owns a corruption level per polity, region, or city and the rule that turns it into losses. Each period the level
  rises with drivers such as the volume of spending or programs, distance from the seat of government, the number
  of administered territories, or weak institutions, and falls with countermeasures such as anti-corruption policies,
  courthouses, audits, or dedicated spending; some games accumulate it as a stock with slow decay, others recompute
  it each turn from current conditions. A share that grows with the level is then removed from tax revenue, trade,
  production, or program effectiveness, or added to costs. Rebel Inc. (2018) makes corruption a side effect of
  governing: the more civilian initiatives the player funds, the more corruption and inflation rise, and a governance
  tab offers anti-corruption measures. Civilization (1991) and Europa Universalis IV use other forms. It differs from
  taxation, which sets the rate of collection, and from stability-unrest, which owns grievance; corruption owns the
  leak between what the state raises and what it gets to use.
player_experience: >-
  Growth carries a hidden tax. The player watches part of every budget vanish, weighs how much to spend fighting it,
  and learns that expanding programs or territory faster than institutions can follow makes each new unit of spending
  worth less.
design_levers:
- drivers of corruption (spending volume, distance, territory count, institution quality)
- 'what leaks and how much: revenue, output, program effectiveness, or costs'
- countermeasures and their price (policies, buildings, dedicated spending)
- accumulated stock with decay versus a level recomputed each period
- visibility, from a shown meter to losses visible only in the ledger
failure_modes:
- One cheap countermeasure, a single building or policy, zeroes corruption and removes the mechanic from play.
- A flat percentage loss with no driver the player can influence feels like an arbitrary tax rather than a decision.
- Distance-based corruption punishes spread-out realms so hard that one empire shape dominates.
- Leaks without a breakdown make budgets feel randomly short.
dynamics:
- Corruption caps efficient size, since each additional city, territory, or program returns less, a balancing loop
  on expansion.
- Spending to win support raises corruption that erodes the budget for further spending, as in Rebel Inc.
- Players invest in countermeasures first in regions far from the center, which shapes expansion order.
math_basis:
- system-dynamics
- optimization
feedback: balancing
player_interface:
- parameter
- choice-cards
legibility: 3
emergence_potential: 2
authoring_cost: 1
compute_cost: 1
tuning_difficulty: 3
ai_leverage: 2
maturity: established
open_questions:
- Can corruption be modeled as agents (officials, contractors) who skim and can be investigated, rather than as a
  percentage, while staying readable?
- Which drivers make corruption a strategic constraint rather than a flat tax?
