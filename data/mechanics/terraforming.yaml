id: terraforming
type: mechanic
name: Terraforming
aliases:
- landscaping
- terrain editing
- raise and lower land
summary: The player raises, lowers, flattens, or repaints terrain, usually at a cost, to make land usable
  or to reshape water and paths.
family: space-construction
substrate:
- cellular-grid
definition: 'Terrain is a height field, often with surface material and water layers. A brush raises,
  lowers, levels, smooths, or paints cells under the cursor; slope limits propagate the edit to neighbors,
  and a cost is charged per cell or per volume moved. Downstream systems read the new heights: buildability,
  water flow, pathing, and views. In Populous (1989) raising and lowering land is the basic divine power,
  used mainly to give followers flat land for houses, which grows followers and mana. SimCity 2000 and
  RollerCoaster Tycoon charge money for land edits. Planet Coaster uses voxel terrain that also allows
  tunnels and overhangs. From Dust moves sand, water, and lava as simulated materials rather than as height
  edits.'
player_experience: Shaping the world directly. Players prepare sites, carve scenery, and sometimes wield
  terrain as a weapon. The pleasure is tactile and godlike; the constraint is cost and the knock-on effects
  on water and access.
design_levers:
- brush shapes and sizes
- slope limits and how edits spread to neighbors
- cost per cell or per volume, and whether material must be conserved
- whether terraforming is available in play or only in an editor
- how water, pathing, and buildings respond to edited terrain
failure_modes:
- Cheap unlimited terraforming flattens the map and removes terrain as a design constraint.
- Edits silently break water flow or paths and cause floods or stranded buildings.
- Fiddly brush controls make precise shaping tedious.
dynamics:
- In Populous, flattening land leads to more houses, more followers, and more mana for more powers, a
  reinforcing loop.
- Coupled with hydrology, terrain edits create dams, floods, and reservoirs.
- Terraforming against an opponent, such as sinking their land, turns it into a weapon.
math_basis:
- cellular-automata
feedback: none
player_interface:
- direct-manipulation
- placement
legibility: 4
emergence_potential: 3
authoring_cost: 1
compute_cost: 2
tuning_difficulty: 2
ai_leverage: 3
maturity: classic
open_questions:
- Can semantic terrain brushes ("carve a canyon here") backed by generative terrain models keep edits
  predictable?
- How should material conservation be enforced so terraforming stays a resource decision rather than free
  sculpting?
