id: programming-by-demonstration
type: mechanic
name: Programming by demonstration
aliases:
- teach by example
- record and replay
- macro recording
summary: An agent or vehicle learns a routine by recording the player performing it, and the recording becomes a replayable,
  sometimes editable, program.
family: control-automation
substrate:
- player-authored-logic
- agent-based
definition: >-
  Owns a recording session (the agent being taught and the sequence of player actions or positions captured so far) and the
  resulting routine. While recording, each player action is generalized into a step that names an action and a target class
  or place rather than one specific object; the agent then replays the routine, often in a loop, and the player may edit it.
  Autonauts bots watch the player perform a task and record it as blocks in a Scratch-style visual language, which the player
  wraps in repeat loops and conditions, and the bot's head caps program length. Satisfactory trucks and tractors repeat a
  route the player records by driving it once, stopping at truck stations. Unlike player-programming, the player does not
  write code to create the routine; unlike blueprints, which snapshot a spatial layout, a recording captures a sequence over
  time. Inputs: player actions while recording and later edits. Outputs: an autonomous routine, and its failures when the
  world no longer matches the recording.
player_experience: >-
  Teaching instead of coding. The player shows a bot how to chop a tree or drives a delivery once, then watches it repeat
  the job, which makes automation approachable for players who have never programmed. The surprise comes when the routine
  generalizes the wrong thing, such as returning to a spot where the resource is already gone.
design_levers:
- 'how actions are generalized: exact positions, nearest object of a type, or named areas'
- whether recordings become editable programs with loops and conditions or stay opaque replays
- program length caps and how agent upgrades raise them
- 'recovery behavior when a step fails: skip, wait, or stop'
- whether one recording can be copied to many agents
failure_modes:
- Over-literal recording replays positions after the world has changed, so routines break silently.
- Opaque replays with no editing force players to re-record a whole routine for one small change.
- Recorded vehicle routes drift or collide when terrain or traffic differs from the recording run.
dynamics:
- Each taught agent frees player time to teach the next, so automation grows quickly once the first routine works.
- Players pick up programming concepts such as loops and conditions by editing what they demonstrated.
- Fleets of copied routines amplify any flaw in the original recording.
math_basis:
- computation-theory
feedback: reinforcing
player_interface:
- direct-manipulation
- programming
legibility: 4
emergence_potential: 2
authoring_cost: 2
compute_cost: 1
tuning_difficulty: 2
ai_leverage: 4
maturity: emerging
open_questions:
- Can learned imitation policies generalize a single demonstration to new layouts while staying predictable and editable?
- Does editing a demonstrated routine teach programming better than writing code from a blank page?
