id: content-sharing
type: mechanic
name: Content sharing
aliases:
- user-generated content
- workshop
- creation sharing
summary: Player creations such as buildings, creatures, or blueprints are uploaded, browsed, rated, and
  imported into other players' games.
family: multiplayer-persistence
substrate:
- network-graph
- player-authored-logic
definition: 'A creation is serialized to a compact format, uploaded to a shared catalog with metadata,
  and ranked by downloads, ratings, or curation; other players browse and import it, or the game pulls
  catalog items into their worlds automatically. Spore uploaded every creature, vehicle, and building
  to the Sporepedia, ranked items by downloads, and redistributed them to populate other players'' galaxies,
  with only a few kilobytes per item because the game rebuilds each creation procedurally from its template;
  it passed 100 million creations by May 2009, and players could filter or ban user content. Steam Workshop
  for Cities: Skylines, Planet Coaster blueprints, and Factorio blueprint strings are other forms. Inputs:
  serialized creations. Outputs: imported content and creator reputation.'
player_experience: Creators build for an audience and check how their work spreads; browsers get far more
  variety than the developer shipped. Seeing another player's creature walk through your world, or importing
  a polished city block, makes the game feel populated.
design_levers:
- serialization format and size, such as procedural templates versus full assets
- ranking and discovery signals (downloads, ratings, curation, subscriptions)
- automatic versus opt-in import into other players' worlds
- moderation tools and content filters
- attribution and feedback to creators
failure_modes:
- Offensive or infringing uploads spread fast without moderation; Spore needed filters and in-game bans.
- Popularity rankings concentrate attention on a few creators and bury new work.
- Imported content that breaks balance or performance degrades the importer's game.
dynamics:
- A small share of creators produce most of the popular content.
- Shared blueprints spread optimal designs quickly, which compresses the discovery phase for later players.
- Communities form around creator challenges and showcases.
math_basis:
- social-network
- probability-statistics
feedback: reinforcing
player_interface:
- observation
- choice-cards
legibility: 5
emergence_potential: 3
authoring_cost: 2
compute_cost: 2
tuning_difficulty: 2
ai_leverage: 3
maturity: established
synergy:
- id: generative-content
  note: Shared first discoveries give generated content social value (Infinite Craft).
- id: modding-api
  note: Mods need distribution; sharing platforms need mods.
open_questions:
- Can models classify and moderate uploaded creations at scale with fewer false positives than keyword
  or report systems?
- How should catalogs recommend shared content without concentrating attention on a few top creators?
