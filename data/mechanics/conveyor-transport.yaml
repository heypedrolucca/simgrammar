  note: Belts make recipe chains spatial, turning ratios into a layout puzzle (Factorio, Satisfactory).
open_questions:
- Could layout assistants that propose belt routing under player constraints keep the puzzle while removing
  tedium?
- What is the smallest set of belt primitives that still supports deep layout optimization?
