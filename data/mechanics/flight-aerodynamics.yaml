  note: A faithful flight model makes real procedures necessary rather than ceremonial.
open_questions:
- Can learned surrogates trained on computational fluid dynamics give accurate flight models for aircraft
  without hand tuning?
- Can an AI instructor read the flight model state and coach novices through stalls and landings?
