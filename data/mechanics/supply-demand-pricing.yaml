id: supply-demand-pricing
type: mechanic
name: Supply-demand pricing
aliases:
- dynamic pricing
- market prices
summary: Prices adjust to supply and demand, so scarcity raises prices and gluts lower them.
family: economy-finance
substrate:
- aggregate-stocks
definition: Owns a price per good per market, anchored to a base price. Each tick the rule compares demand
  (consumption, buy orders) with supply (production, stock, sell orders) and raises the price when demand
  exceeds supply and lowers it otherwise, usually within a band around the base. Common forms are a stock-based
  price, p = base x f(stock / target stock), and an incremental update, p += k x (demand - supply) / supply.
  Prices feed back into production profitability and consumption. Victoria 3 (2022) sets each good's national
  market price from the balance of buy orders from consumption and sell orders from production relative
  to a base price, scales each state's orders by its market access, and blends local and market prices
  for poorly connected states. Offworld Trading Company moves prices continuously with every player's
  purchases and sales.
player_experience: Buy low, sell high, and watch your own trades move the market. The player spots shortages,
  rushes production to profit from high prices, and sees margins collapse as they and rivals flood the
  market. Prices become a readout of what the economy lacks.
design_levers:
- price sensitivity (gain) and the band around base price
- base price per good, which sets the default value hierarchy
- whether the player's own trades move prices (price impact)
- smoothing, inertia, and update frequency
- how far price signals propagate between markets
failure_modes:
- High gain causes price oscillation and boom-bust cycles that players read as random.
- When the player's trades do not move prices, a single arbitrage loop can be exploited indefinitely.
- Tight bands make prices too sticky to signal shortages; loose bands let goods become worthless.
dynamics:
- High prices attract new producers whose output then pushes prices down, producing cobweb cycles.
- Producers crowd into the most profitable good, so profit migrates between goods over time.
- Shortages of an input propagate down production chains as price spikes.
math_basis:
- system-dynamics
- mechanism-design
feedback: balancing
player_interface:
- observation
- orders
legibility: 4
emergence_potential: 3
authoring_cost: 2
compute_cost: 2
tuning_difficulty: 4
ai_leverage: 2
maturity: classic
synergy:
- id: trade-routes
  note: Price differentials are what make routes profitable; trade flattens them.
open_questions:
- Can demand models calibrated on real market data give games more believable price dynamics without making
  them unreadable?
- How much player price impact keeps markets responsive without enabling degenerate exploits?
