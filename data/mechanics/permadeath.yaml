id: permadeath
type: mechanic
name: Permadeath
aliases:
- permanent death
- ironman
- hardcore mode
summary: Death of agents or the avatar is permanent, and the save system prevents undoing it.
family: risk-failure
substrate:
- rule-system
definition: 'Death is an absorbing state: when an entity''s health or survival condition fails, the entity
  and its accumulated state (skills, gear, relationships) are removed with no reload. Enforcement lives
  in the save system: Rogue deleted the save file when it was loaded, and modern ironman modes keep a
  single autosave. Two scopes exist. Avatar permadeath ends the run, as in FTL, which deletes the save
  when the ship is destroyed or all crew die, and Project Zomboid. Agent permadeath removes a member from
  a continuing game, as with RimWorld colonists, Dwarf Fortress dwarves, and Fire Emblem units. Softeners
  include FTL''s clone bay, which revives crew with a skill penalty, downed states before death, and meta-progression
  that survives the run. Inputs: lethal events from combat, injury, or survival systems. Outputs: entity
  removal, run termination, or succession.'
player_experience: Every risky decision carries weight because losses cannot be reversed. Players grow
  attached to named survivors, play more cautiously, and remember specific deaths as the turning points
  of a run. A loss late in a long run is the most memorable and the most frustrating moment the mechanic
  produces.
design_levers:
- 'scope: avatar death ends the run versus agent death inside a continuing game'
- 'save policy: single autosave, optional ironman toggle, or tolerated save scumming'
- 'what persists past death: unlocks, world state, heirs, or nothing'
- recovery tools such as revival with penalties, downed states, or medical rescue windows
- replacement cost and time for lost agents
failure_modes:
- A single high-variance event ends a long run, which reads as unfair rather than consequential.
- Players back up and restore save files (save scumming), bypassing the design.
- Fear of loss pushes players into slow, repetitive grinding instead of bold play; Richard Bartle's analysis
  of virtual worlds notes most MMORPGs avoid permadeath for this and retention reasons.
- Bugs or connection drops that kill characters become catastrophic.
dynamics:
- 'Losing a key specialist cascades: a colony without its only doctor loses more colonists to untreated
  wounds.'
- Attachment plus loss produces the personal stories players share from colony sims and roguelikes.
- Combined with procedural generation, it makes each run a fresh attempt rather than a retry of the same
  state.
math_basis:
