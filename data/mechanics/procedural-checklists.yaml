id: procedural-checklists
type: mechanic
name: Procedural checklists
aliases:
- cold start
- startup procedures
- study-sim procedures
summary: Operating simulated equipment requires performing ordered steps on modeled controls that mirror real procedures,
  with system states gating each step.
family: operation-procedure
substrate:
- rule-system
definition: >-
  Equipment is modeled as interacting subsystems (electrical, fuel, hydraulic, engines, avionics) whose states are changed
  through individually operable controls. A procedure is an ordered sequence of control actions with preconditions on subsystem
  state; doing steps out of order produces the physical result of that order, such as a failed engine start, rather than an
  error message. DCS World models aircraft from real-world data, with clickable cockpit switches and subsystems such as engines,
  fuel, electrical, hydraulics, and radios, and the U.S. Air Force's 355th Training Squadron uses it as an A-10C instrument
  and weapons-systems trainer. Microsoft Flight Simulator offers interactive checklists with optional copilot assistance.
  Inputs: control manipulations. Outputs: subsystem states and operational readiness.
player_experience: >-
  Mastery through ritual. Players study manuals, practice startup sequences until they are reflexive, and feel competence
  when a complex machine comes alive under their hands. Mistakes teach how the systems connect.
design_levers:
- number of modeled subsystems and controls
- 'strictness: whether wrong orders fail realistically or are forgiven'
- assists such as auto-start, checklist overlays, or copilot automation
- manual and tutorial depth
- failure injection during procedures
failure_modes:
- Long procedures before any action exclude newcomers unless an auto-start or assisted mode is offered.
- When the underlying systems are not simulated, steps become arbitrary button sequences.
- Missing feedback leaves players unable to tell which step went wrong.
dynamics:
- Communities share checklists, tutorials, and training videos, and some organize realistic group operations.
- Injected failures turn memorized procedures into troubleshooting.
- Assists create a ladder from casual to study-level play inside one product.
math_basis:
- computation-theory
- scheduling
feedback: none
player_interface:
- direct-manipulation
legibility: 3
emergence_potential: 2
authoring_cost: 4
compute_cost: 2
tuning_difficulty: 2
ai_leverage: 3
maturity: established
open_questions:
- Can a voice-driven AI instructor or crew member coach procedures adaptively from the live subsystem state?
- Can procedure models be extracted from real manuals automatically to cut the cost of new equipment?
