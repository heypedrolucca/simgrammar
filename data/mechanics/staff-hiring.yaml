id: staff-hiring
type: mechanic
name: Staff hiring and rosters
aliases:
- hiring
- roster management
- staff management
summary: The player hires individual staff with skills, traits, and wages to operate a facility or team.
family: economy-finance
substrate:
- agent-based
- stochastic-events
definition: Owns a candidate pool and a roster. Each candidate has skills or attributes, traits, and a wage demand; hiring
  moves them to the roster at a recurring wage. Rostered staff are assigned to rooms, roles, or positions, and their skill
  sets the speed or quality of work there; fatigue, morale, and pay satisfaction change over time and can trigger rest, raise
  demands, or quitting. Training spends money and time to raise skills. Theme Hospital (1997) has the player hire doctors,
  nurses, handymen, and receptionists with performance statistics, train doctors, require specialist skills for rooms such
  as the operating theatre, send staff to rest, and dismiss staff who argue about pay. Football Manager builds a whole game
  around player and staff attributes, contracts, and wages, and Two Point Hospital follows Theme Hospital's model.
player_experience: Assembling a team. The player compares candidates' stats against their wages, places the best people where
  they matter most, and nurses tired or unhappy staff. Names and faces make the facility feel staffed by people rather than
  counters.
design_levers:
- number of staff types and skill dimensions
- candidate pool size, refresh rate, and quality distribution
- wage curve relative to skill and how raises are demanded
- fatigue, morale, and quitting rules
- training cost, duration, and skill ceilings
- how much candidate information is hidden until hired or scouted
failure_modes:
- When one stat dominates, hiring becomes sorting a list and staff stop feeling like individuals.
- Raise demands that grow too fast make experienced staff a liability and push players to churn employees.
- Generic stats without traits make staff interchangeable and remove attachment.
dynamics:
- Strong staff raise income, which funds better hires, so facilities snowball toward elite rosters.
- Fatigue and rest create capacity dips that ripple into queues.
- Losing a star employee causes a sudden performance drop and a recovery arc.
math_basis:
- optimization
- probability-statistics
feedback: reinforcing
player_interface:
- choice-cards
- orders
legibility: 4
emergence_potential: 3
authoring_cost: 2
compute_cost: 1
tuning_difficulty: 3
ai_leverage: 3
maturity: classic
open_questions:
- Can LLM-generated candidates with backstories, interviews, and evolving workplace relationships make rosters as memorable
  as authored characters?
- What is the smallest set of staff attributes that keeps hiring a real decision?
