id: crowd-preferences
type: mechanic
name: Crowd preferences
aliases:
- guest thoughts
- visitor preferences
summary: Large visitor populations with individual preferences, budgets, and tolerances choose attractions
  and react with visible thoughts.
family: agents-behavior
substrate:
- agent-based
- stochastic-events
definition: 'Owns a large population of visitor agents, each with preference parameters sampled at spawn
  (intensity range, nausea tolerance, tastes), a cash budget, and mood stocks such as happiness, energy,
  hunger, thirst, and toilet. When choosing what to do, a visitor filters attractions by preference and
  budget, picks among the acceptable ones, and on rejection or experience emits a named thought that changes
  happiness. In RollerCoaster Tycoon, per the OpenRCT2 reimplementation, a guest rejects a ride whose
  intensity rating is below its minimum or above its maximum preferred intensity (both widened by happiness),
  whose nausea rating exceeds its tolerance (300, 600, 800, or 1000 plus happiness), or whose price exceeds
  twice the ride''s value (value quartered when the park charges entry); rejections lower happiness and
  create thoughts such as bad value, and guests with nothing left to ride head home. Outputs: attendance,
  spending, park rating, crowding.'
player_experience: 'The player reads the crowd as a distribution: thought feeds and aggregate complaints
  reveal what is missing, and the fix is a layout or pricing change rather than an order. Individual guests
  are funny and disposable; the crowd''s mood is the scoreboard, and pricing becomes a dial between revenue
  and goodwill.'
design_levers:
- preference distributions sampled at spawn (intensity, nausea, tastes, budget)
- acceptance rule (hard thresholds versus scored choice) and the price-to-value tolerance multiplier
- thought vocabulary and how thoughts aggregate into a park or facility rating
- mood decay rates and leave-the-park thresholds
- crowd size and spawn rate tied to rating, marketing, or price of entry
failure_modes:
- Price-value rules that ignore context let players overcharge a few attractions with no penalty, or punish
  small price changes too harshly.
- 'Thought spam: hundreds of identical thoughts bury the actionable signal.'
- Narrow preference sampling makes the crowd behave like one average agent, removing segmentation decisions.
- Large crowds cost pathfinding and update time, capping park size.
dynamics:
- Preferences spread over intensity create demand for a portfolio of gentle and intense attractions rather
  than one best ride.
- Rating raises attendance, and the larger crowd congests queues and paths until mood falls, a balancing
  loop on growth.
- Players learn the value threshold and price every attraction just below it, a stable arbitrage the rule
  invites.
math_basis:
- probability-statistics
- utility-decision
- queueing
feedback: balancing
player_interface:
- observation
- placement
- parameter
