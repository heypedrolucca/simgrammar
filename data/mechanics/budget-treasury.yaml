  note: Debt extends the treasury in time, trading future flexibility for present growth.
open_questions:
- Can an LLM advisor explain a deficit as a causal chain through the ledger well enough to replace spreadsheet-style
  budget panels?
- What upkeep-to-revenue curve keeps money a meaningful constraint into the late game?
