id: injury-body-model
type: mechanic
name: Injury body model
aliases:
- body part damage
- wound model
- health hierarchy
summary: Bodies are hierarchies of parts with their own damage, and wounds, bleeding, infection, and prosthetics change capacities
  such as moving and manipulation.
family: biology-health
substrate:
- agent-based
- rule-system
definition: 'Owns, per creature, a tree of body parts with hit points, tissue layers, or functions, plus a list of conditions
  such as cuts, burns, fractures, bleeding, infection, scars, and missing or artificial parts. Damage lands on a sampled part;
  part health feeds capacities such as consciousness, moving, manipulation, sight, breathing, and blood pumping, which scale
  work speed, combat, and survival. Each tick bleeding drains blood, infections race against immunity, and tended wounds heal.
  RimWorld derives capacities from parts: consciousness below 30% keeps a pawn from waking, moving below 15% incapacitates,
  each arm supplies half of manipulation, blood pumping at 0% is fatal, poor tending raises infection and scarring risk, and
  each bionic leg adds 12.5% moving. Dwarf Fortress damages tissue layers per part; Project Zomboid tracks wounds per body
  region. Inputs are damage and treatment; outputs are capacity multipliers, pain, and death.'
player_experience: 'Injuries become specific stories: a colonist missing a hand works slower, a hunter with a shattered leg
  cannot flee. The player triages by which wound threatens life first, stops bleeding before worrying about infection, and
  plans around lasting disabilities or replaces parts with prosthetics.'
design_levers:
- 'granularity of the body tree: regions, organs, tissue layers'
- mapping from part damage to capacities and from capacities to actions
- bleeding rate, infection chance, and healing rate, and how treatment quality modifies them
- 'permanence: scars, lost parts, chronic pain'
- replacement options such as prosthetics, bionics, and transplants, and their availability
failure_modes:
- Too many parts and conditions make the health screen unreadable, so players cannot tell what is lethal.
- Fine-grained damage with high lethality makes outcomes feel like dice rolls, such as death from one hit to a vital organ.
- Permanent disabilities without replacement paths make injured characters dead weight the player discards.
dynamics:
- Injured agents work slower, lowering output and raising pressure on healthy ones.
- Demand for medicine, doctors, and prosthetics creates a medical economy.
- Disabilities shape character identity and the stories players tell about them.
math_basis:
- system-dynamics
- markov-stochastic
feedback: both
player_interface:
- observation
- orders
legibility: 3
emergence_potential: 4
authoring_cost: 2
compute_cost: 2
tuning_difficulty: 3
ai_leverage: 2
maturity: established
open_questions:
- Can language models narrate injuries and recovery so deep body models stay legible without a dense health tab?
