id: terrain-deformation
type: mechanic
name: Terrain deformation
aliases:
- mud physics
- deformable terrain
- ruts
summary: Wheels, feet, and impacts displace soft ground such as mud and snow, and the persistent ruts
  change traction for later passes.
family: physics-materials
substrate:
- cellular-grid
- continuous-physics
definition: 'Ground is a height field with a soft-material layer. Contacts displace material by pressure,
  wheel slip, and softness; the displaced height persists and changes contact and traction on later passes.
  In Spintires: MudRunner, according to its lead developer Pavel Zagrebelny, terrain is a regular vertex
  grid displaced by a height map and covered by a mud layer that artists paint, with a second higher-resolution
  grid for the mud; when a wheel is in mud or spins too fast, the game computes forces approximating mud
  physics, and mud displacement runs entirely on the GPU. SnowRunner (2020) extends the approach to snow.
  Many games deform terrain cosmetically, leaving tracks that do not affect physics.'
player_experience: Struggle and patience. Players read the ground, pick lines, rock the vehicle, and winch
  out. Every crossing feels earned, and the track left behind tells the story of the trip.
design_levers:
- material softness and depth by terrain type
- rut depth, persistence, and recovery over time
- coupling strength between ruts and traction
- simulation resolution and whether it runs on the GPU
- how deformation is synchronized in multiplayer
failure_modes:
- Cosmetic deformation that does not affect handling creates a mismatch between what players see and feel.
- Permanent deep ruts can make a route impassable for the rest of a session.
- Deformation state is large and hard to keep synchronized across networked players.
dynamics:
- Spinning wheels dig deeper and lose traction, a stuck spiral that rewards slow throttle and winching.
- Earlier vehicles' ruts change the route for convoy members that follow.
- Weather that softens ground couples terrain deformation to route planning.
math_basis:
- continuum-mechanics
feedback: reinforcing
player_interface:
- embodied-skill
legibility: 4
emergence_potential: 3
authoring_cost: 2
compute_cost: 3
tuning_difficulty: 3
ai_leverage: 2
maturity: established
synergy:
- id: vehicle-dynamics
  note: Ruts and mud change traction, making route reading a skill (SnowRunner).
open_questions:
- Can learned granular-material models make mud, sand, and snow respond more physically at game frame
  rates?
