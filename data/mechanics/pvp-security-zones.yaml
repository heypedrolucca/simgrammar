id: pvp-security-zones
type: mechanic
name: PvP security zones
aliases:
- security status
- safe zones
- PvP rulesets by region
- high-sec and null-sec
summary: A shared world is divided into zones whose rules set whether players may attack each other and what an aggressor
  pays, such as NPC police response or lost standing.
family: multiplayer-persistence
substrate:
- rule-system
- network-graph
definition: >-
  Owns a security rating or ruleset per zone (star system, region, server facet) and each player's standing, such as security
  status or criminal flags. When one player attacks another, the zone's rules decide whether the attack is allowed, whether
  NPC enforcers respond and how fast, and how much standing the attacker loses; standing then limits where the attacker can
  travel safely. EVE Online rates each system from 1.0 to -1.0, with the CONCORD police destroying unprovoked aggressors in
  high-security space while low- and null-security space leaves fights to players, and the most profitable activities sit
  in the less secure zones. Ultima Online split its world in 2000 into Trammel, where player-versus-player combat is consensual,
  and Felucca, where it is open. Unlike persistent-world, which owns continuity of the shared world, this mechanic owns the
  spatial rules for aggression inside it.
player_experience: >-
  The player chooses a risk level by choosing where to go. Safe zones let new and cautious players work and trade; dangerous
  zones promise better rewards and real fights. Crossing a border with valuable cargo is a decision, and an attacker in safe
  space knows the police are coming.
design_levers:
- number of security tiers and how rewards scale with risk across them
- 'enforcement: instant destruction, delayed police response, flags that make the aggressor attackable, or none'
- standing penalties for aggression and how they recover
- whether players can choose a ruleset at entry, as with separate facets
- map layout of tiers, including chokepoints between safe and dangerous space
failure_modes:
- Safe zones that cover everything valuable empty the dangerous zones, and the player-versus-player design withers.
- Delayed enforcement allows suicide attacks on rich targets in safe space when the loot exceeds the attacker's loss.
- Offering a consensual ruleset beside an open one lets most players choose safety, which can leave the open ruleset thinly
  populated; Ultima Online's Felucca after the Trammel split is the usual example.
dynamics:
- Gate camps form at chokepoints where safe space meets dangerous space.
- Players stage risky ventures from safe hubs, creating hub-and-frontier geography in the economy.
- Groups organize escorts, scouts, and intelligence networks to operate in dangerous zones.
math_basis:
- mechanism-design
- game-theory
feedback: balancing
player_interface:
- direct-manipulation
- observation
legibility: 4
emergence_potential: 4
authoring_cost: 1
compute_cost: 1
tuning_difficulty: 4
ai_leverage: 2
maturity: established
open_questions:
- Could AI enforcers that respond to context, rather than fixed rules, curb exploits such as suicide attacks without blocking
  legitimate play?
- What reward gradient across tiers keeps both safe and dangerous zones populated?
