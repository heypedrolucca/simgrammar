id: service-queues
type: mechanic
name: Service queues
aliases:
- queues
- waiting lines
- queue lines
summary: Agents wait in lines for limited-capacity services; waiting time feeds back into satisfaction and throughput.
family: logistics-networks
substrate:
- agent-based
- rule-system
definition: >-
  Each service point (a ride, a clinic room, a checkout) has a service rate and a queue of waiting agents. Arriving agents
  join if the queue is not too long by their own tolerance; while waiting, their needs keep decaying and their satisfaction
  falls with waiting time; served agents leave and free the slot. RollerCoaster Tycoon builds explicit queue paths for rides,
  and guests think aloud about long waits. Theme Hospital and Two Point Hospital queue patients outside rooms; while they
  wait their health keeps falling, so long queues produce departures and deaths that lower the hospital's reputation. Inputs:
  arrival rate, service rate, capacity, tolerance. Outputs: queue length, waiting times, and satisfaction changes.
player_experience: >-
  Visible lines are an instant read on capacity. Players add service points, lengthen or shorten queue paths, and redistribute
  demand, learning from the line itself where the bottleneck is.
design_levers:
- service rate per point and number of parallel points
- queue capacity and agents' tolerance before they balk or leave
- satisfaction decay while waiting
- 'queue discipline: first-in-first-out, priority, or player reordering'
- information shown about wait times
failure_modes:
- Fixed tolerance across all agents makes queues predictable and dull.
- Queues that grow without bound because agents never leave freeze the simulation.
- Invisible queues inside buildings hide the bottleneck.
dynamics:
- Utilization near 100% causes waiting times to explode, the core queueing-theory result, so players learn to keep slack.
- Coupled with needs decay, long waits create secondary demand at food and toilet facilities.
- Demand shifts toward shorter queues, balancing load across service points.
math_basis:
- queueing
feedback: balancing
player_interface:
- placement
- observation
legibility: 4
emergence_potential: 3
authoring_cost: 2
compute_cost: 2
tuning_difficulty: 3
ai_leverage: 2
maturity: classic
open_questions:
- Could generative agents with learned patience models make queues produce more varied and memorable behavior?
