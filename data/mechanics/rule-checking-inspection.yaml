id: rule-checking-inspection
type: mechanic
name: Rule-checking inspection
aliases:
- document inspection
- checkpoint inspection
summary: The player checks documents, people, or cargo against a rulebook that changes over time, under
  time pressure, with penalties for errors.
family: operation-procedure
substrate:
- rule-system
- stochastic-events
definition: 'A generator produces cases (travelers, documents, cargo) with attributes, some injected with
  discrepancies at a configured rate. A rulebook of predicates defines valid cases and grows or changes
  each day. The player inspects, cross-references, uses tools to reveal hidden attributes, and issues
  a verdict; errors produce penalties and correct verdicts produce pay, within a fixed time per shift.
  In Papers, Please each day sets documentation requirements that grow over time, tools include interrogation,
  fingerprinting, and body scans, citations for protocol violations cut daily earnings, and wages must
  cover rent, food, and heat. Contraband Police applies the loop to cargo and vehicles. Inputs: case attributes
  and rules. Outputs: verdicts, earnings, penalties, and story flags.'
player_experience: Rising cognitive load and moral pressure. Players scan for mismatches against a growing
  rulebook, race the clock to earn enough for their family, and face cases where following the rules is
  cruel. Rule changes keep competence from settling into routine.
design_levers:
- rule count and the rate at which rules are added
- discrepancy injection rate and subtlety
- time per shift and pay per correct case
- penalty structure for errors
- inspection tools and their cost in time
- authored cases with moral stakes mixed into generated ones
failure_modes:
- Too many concurrent rules overload working memory and become frustrating.
- Purely generated cases without authored stakes reduce play to a matching task.
- Binary penalties with no explanation leave players unsure which rule they broke.
dynamics:
- Time pressure trades accuracy against throughput, and income pressure pushes players to cut corners.
- Bribes and sympathetic cases set economic incentives against moral judgment.
- Rule growth makes earlier skill obsolete, renewing difficulty every day.
math_basis:
- information-theory
- combinatorics
feedback: none
player_interface:
- direct-manipulation
- choice-cards
legibility: 4
emergence_potential: 2
authoring_cost: 3
compute_cost: 1
tuning_difficulty: 3
ai_leverage: 4
maturity: established
open_questions:
- Can language models generate cases and dialogue whose discrepancies are subtle yet verifiable against
  a formal rulebook?
- What rule-addition rate keeps load challenging without exceeding working memory?
