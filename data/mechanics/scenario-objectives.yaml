id: scenario-objectives
type: mechanic
name: Scenario objectives
aliases:
- scenarios
- missions
- challenge maps
- campaign goals
summary: Preset maps or situations come with explicit goals, constraints, and often a deadline.
family: progression-goals
substrate:
- rule-system
definition: >-
  A scenario bundles an initial state (map, buildings, budget, population, problem) with a goal predicate, optional
  constraints (banned buildings, fixed budget, no loans), and a deadline. State owned: the scenario definition and
  evaluation status. Update rule: each evaluation interval, test the goal and failure predicates; on the deadline
  or a failure condition, end with win or loss and often unlock the next scenario. Canonical forms: SimCity (1989),
  whose goal-oriented, time-limited scenarios were added at Broderbund's suggestion to make the toy more like a
  traditional game; RollerCoaster Tycoon, whose 21 base scenarios each unlock the next on completion, typically
  requiring a guest count and park rating by a date; Railroad Tycoon II's bronze, silver, and gold goal tiers; and
  Theme Hospital levels and Planet Coaster career scenarios.
player_experience: >-
  The sandbox gets a question. The player studies an inherited mess, plans against the clock, and feels accomplishment
  rather than open-ended satisfaction. Constraints force use of systems the player would otherwise ignore.
design_levers:
- 'goal type: target value, survival, or rescue'
- deadline length
- constraints and starting resources
- single goal versus tiered bronze, silver, gold goals
- scenario ordering and unlocks
- whether play continues after the goal is met
failure_modes:
- Goals that reward a degenerate strategy, such as a guest count met by trapping guests in the park.
- Deadlines that leave no room for experimentation make scenarios feel like puzzles with one answer.
- Initial states that are trivially fixable or hopeless.
dynamics:
- Scenarios function as structured tutorials for systems hidden in sandbox mode.
- Hard scenario lines become community challenges with shared strategies.
- Inherited problem cities expose systemic interactions the player did not cause.
math_basis:
- optimization
feedback: none
player_interface:
- observation
legibility: 4
emergence_potential: 2
authoring_cost: 3
