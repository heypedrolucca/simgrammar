  note: Sensor coverage and concealment are central to operational play.
open_questions:
- Can learned opponents that keep beliefs about unseen state replace AI map-hacking without losing challenge?
- If a generative world model creates unobserved regions only when observed, does fog become a generation
  trigger rather than concealment?
claims:
- text: Walter Bright's 1977 game Empire is credited as the earliest video game use of fog of war, and
    Warcraft and StarCraft keep previously seen areas visible as terrain while hiding changes to enemy
    units.
