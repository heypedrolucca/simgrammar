id: stimulus-attraction
type: mechanic
name: Stimulus attraction
aliases:
- noise attraction
- sound propagation
- aggro by noise
- hearing and sight perception
summary: Player actions emit sound or light stimuli with a radius and decay, and agents that perceive them move toward the
  source, so managing emissions is part of survival.
family: risk-failure
substrate:
- agent-based
- cellular-grid
definition: >-
  Owns a set of active stimuli, each with a source position, type (sound, light, smell, sight of the player), intensity, radius,
  and decay time, plus each agent's perception thresholds and current alert target. When an action fires it emits a stimulus
  sized by the action (gunshot, smashed window, running, a lit fire); each update, agents within range whose perception exceeds
  the threshold switch to an investigate state and path toward the source, and some propagate the alert to nearby agents so
  groups follow. Stimuli fade, and agents that find nothing return to idle or wander. Project Zomboid zombies respond to sight
  and hearing, and loud actions draw them from a distance; This War of Mine shows noise from scavenging actions that can alert
  people nearby. Unlike fog-of-war, which hides information from the player, this mechanic models what hostile agents perceive
  about the player; unlike adaptive-threat-scaling, it changes where threats go, not how strong they are.
player_experience: >-
  Every action has an audience. The player weighs the speed of smashing a window against the zombies it will call, walks instead
  of running, and uses noise deliberately as a lure. Mistakes are legible and frightening: a gunshot that brings a crowd teaches
  the rule at once.
design_levers:
- emission radius and intensity per action, weapon, and tool
- perception thresholds per agent type and modifiers such as weather, time of day, and walls
- stimulus decay time and how long agents investigate before giving up
- alert propagation between agents, which turns individuals into crowds or hordes
- 'player feedback: visible noise rings, audio cues, or no indication'
failure_modes:
- Invisible emission rules make attacks feel random when players cannot tell what they did to cause them.
- Propagation that is too strong snowballs every mistake into an unwinnable horde.
- Agents that ignore walls and distance when following sound feel omniscient and break stealth.
dynamics:
- Players lure groups away with distractions such as alarms or thrown objects, turning the rule into a tool.
- Fighting creates noise that draws more enemies, a reinforcing loop that punishes loud tactics.
- Quiet tools and routes become valuable, shaping crafting and travel choices.
math_basis:
- information-theory
- probability-statistics
feedback: reinforcing
player_interface:
- direct-manipulation
- observation
legibility: 3
emergence_potential: 4
authoring_cost: 1
compute_cost: 2
tuning_difficulty: 3
ai_leverage: 3
maturity: established
open_questions:
- Can learned agents that reason about what they heard and saw produce searches that feel smarter without becoming omniscient?
- Does visualizing emissions improve player decisions or remove the tension of not knowing what heard you?
