- choice-cards
legibility: 4
emergence_potential: 4
authoring_cost: 2
compute_cost: 2
tuning_difficulty: 3
ai_leverage: 3
maturity: classic
synergy:
- id: villager-requests
  note: Completing requests raises friendship, giving the social meter a concrete verb (Animal Crossing,
    Stardew).
open_questions:
- Can relationship state be inferred from language-model agent conversations rather than incremented by
  fixed amounts, and stay stable?
- How many relationship dimensions do players track before additional meters stop adding meaning?
