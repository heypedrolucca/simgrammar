id: dilemma-cards
type: mechanic
name: Dilemma cards
aliases:
- choice events
- decision cards
- swipe choices
summary: Discrete choice events present a situation with a few options that each shift meters, values,
  or flags in tradeoff.
family: narrative-generation
substrate:
- rule-system
- stochastic-events
definition: 'A card holds a prompt, two to four options, and per-option effects on meters, resources,
  relationships, or flags, sometimes with hidden or delayed outcomes. A deck sampler draws the next card
  by weights conditioned on state and history. In Reigns, advisors present cards that the player swipes
  left or right; each choice moves some of four meters (church, people, army, treasury), and the reign
  ends if any meter becomes completely full or empty, after which a successor continues with newly unlocked
  cards. FTL beacon events, This War of Mine encounters, and Paradox event pop-ups use the same option-and-effect
  format inside larger simulations. Inputs: current meters and flags. Outputs: meter deltas, flag changes,
  and the next card''s eligibility.'
player_experience: Quick, weighty decisions where every answer costs something. Players weigh which meter
  can absorb the hit, try to predict hidden effects, and learn the deck over many runs. Two-sided limits,
  as in Reigns, make even popular choices dangerous.
design_levers:
- number of options per card and whether one is a safe default
- how much of each option's effect is shown in advance (which meters, direction, magnitude)
- effect magnitudes and whether meters fail at one bound or both
- deck weighting, repetition limits, and state conditions for eligibility
- delayed consequences that resolve cards later
failure_modes:
- Repeated cards expose a small deck and turn dilemmas into memorized answers.
- A dominant option on common cards removes the tradeoff.
- Fully hidden effects make outcomes feel random; fully shown effects make them arithmetic.
- Without a simulation underneath, choices do not interact and the format becomes a sequence of isolated
  quizzes.
dynamics:
- Two-sided meters push players to keep every value near the middle, which creates oscillation as they
  correct overshoots.
- When eligibility depends on earlier flags, players steer toward or away from card lines across runs.
- Inside a larger sim, choice effects feed other systems, so a cheap answer can surface as a crisis many
  turns later.
math_basis:
- utility-decision
- markov-stochastic
feedback: balancing
player_interface:
- choice-cards
legibility: 4
emergence_potential: 2
authoring_cost: 5
compute_cost: 1
tuning_difficulty: 3
ai_leverage: 4
maturity: established
synergy:
- id: policy-toggles
  note: Laws presented as dilemmas make policy a moral choice with permanent consequences (Frostpunk).
open_questions:
- Can a language model write cards conditioned on live simulation state while keeping effects inside a
  balanced, typed budget?
- How much effect preview maximizes deliberation time without reducing choices to arithmetic?
