id: supply-lines
type: mechanic
name: Supply lines
aliases:
- logistics
- supply
- encirclement
summary: Remote units or outposts need a continuous connection to a supply source; cutting the connection
  causes attrition.
family: logistics-networks
substrate:
- network-graph
definition: 'Units or outposts draw supply from sources (hubs, depots, capitals, ports) through a connected
  path of controlled territory, rail, roads, or sea lanes. Each tick, supply delivered falls off with
  distance and is capped by the weakest link; units below a supply threshold lose strength, organization,
  or health. Hearts of Iron IV routes supply from the capital by railway to supply hubs, with hub capacity
  from 15 to 35 by railway level and capped by the weakest link; supply falls off per province from the
  hub, and attrition starts at 35% supply or less. Unity of Command makes supply range central to its
  operational puzzle, and Company of Heroes yields resources only from territory connected to the player''s
  base. Inputs: source capacity, network connectivity, distance. Outputs: per-unit supply level and attrition.'
player_experience: Strategy at the level of the map. Players plan advances along supply routes, pause
  to bring up hubs, and seek to cut enemy lines. Encircling an enemy and watching it starve is a strong,
  systemic win.
design_levers:
- falloff curve with distance from source
- 'network carriers: territory, rail, roads, or sea'
- attrition thresholds and penalties
- buffers such as stored supply or foraging
- visibility of supply levels and routes
failure_modes:
- Opaque supply calculations make attrition feel arbitrary.
- Supply too forgiving makes logistics irrelevant.
- Supply too harsh makes offensives impossible and pins the front.
dynamics:
- Encirclement emerges as the main operational goal.
- Infrastructure investment becomes a military priority.
- Fronts stall when supply limits are hit, producing realistic operational pauses.
math_basis:
- graph-search
- network-flow
feedback: both
player_interface:
- orders
- placement
- observation
legibility: 3
emergence_potential: 3
authoring_cost: 1
compute_cost: 2
tuning_difficulty: 3
ai_leverage: 2
maturity: established
open_questions:
- Could an AI opponent that reasons about supply networks produce more convincing operational play than
  current scripted AIs?
