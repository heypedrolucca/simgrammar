id: romance-family
type: mechanic
name: Romance and family
aliases:
- courtship and marriage
- dating
- family formation
summary: Agents court, partner, marry, and form families according to compatibility and relationship state.
family: social-relations
substrate:
- agent-based
- rule-system
- stochastic-events
definition: >-
  Owns relationship-status edges (crush, lover, fiance, spouse, ex) and family links (parent, child, sibling) plus the rules
  that move pairs between statuses. Attempts such as flirting, proposals, and breakups succeed with probabilities from attraction,
  opinion, age, traits, and existing commitments; partnered pairs gain bonuses and can produce children, linking to lifecycle
  and inheritance. RimWorld pawns over 16 can attempt romance every 12 days; success depends on beauty (Ugly x0.3, Pretty
  x2.3), relative age, and existing relationships; a rebuff gives -10 and -15 opinion; lover is +35, spouse +30, ex -15, breakup
  -50, and kin get base opinions such as parent +30. Stardew Valley has 12 marriage candidates courted through a heart-based
  friendship meter (250 points per heart). Crusader Kings III makes marriage a political act that links dynasties. Inputs:
  relationship values, traits, ages. Outputs: couples, households, children, grief, jealousy.
player_experience: >-
  Romance gives characters personal goals and the player a matchmaking game. Players engineer meetings, celebrate weddings,
  and deal with affairs and breakups; children turn a run into a family saga.
design_levers:
- attraction model (traits, beauty, orientation, compatibility) and attempt cooldowns
- status ladder and requirements for each step
- jealousy, cheating, and breakup rules
- whether relationships are player-directed, autonomous, or both
- fertility and household formation rules that link to lifecycle
failure_modes:
- 'Romance spam: compatible agents pair off immediately and the system stops generating story.'
- >-
  Autonomous affairs and breakups wreck carefully built families, which feels like the game punishing the player.
- Narrow attraction rules repeat the same few pairings every run.
- >-
  Ignoring orientation or consent in autonomous romance produces behavior that players report as harmful.
dynamics:
- Couples anchor households and change migration, mood, and grief networks.
- Love triangles and rivals produce recurring social conflicts and fights.
- In dynastic games, marriage creates alliance and inheritance claims across factions.
math_basis:
- social-network
- markov-stochastic
feedback: reinforcing
player_interface:
- choice-cards
- observation
legibility: 4
emergence_potential: 4
authoring_cost: 3
compute_cost: 1
tuning_difficulty: 3
ai_leverage: 4
maturity: classic
requires:
- relationship-values
open_questions:
- >-
  Can language-model characters carry courtship as dialogue with consistent preferences, and how should that be constrained
  for safety and consent?
- >-
  What autonomy level for romance maximizes story without making players feel they lost control of their families?
