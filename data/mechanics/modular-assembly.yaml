legibility: 3
emergence_potential: 4
authoring_cost: 3
compute_cost: 3
tuning_difficulty: 4
ai_leverage: 4
maturity: established
synergy:
- id: rigid-body-physics
  note: Physics decides whether an assembled machine works, so building becomes experimentation (Besiege).
- id: orbital-mechanics
  note: Rocket design is meaningful because orbits demand specific delta-v budgets (Kerbal Space Program).
open_questions:
- Can reinforcement-learned controllers make arbitrary player-built bodies walk, swim, or fly convincingly
  at runtime?
- Can generated parts with stats derived from their geometry replace hand-authored part catalogs?
