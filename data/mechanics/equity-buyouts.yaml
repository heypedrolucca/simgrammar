id: equity-buyouts
type: mechanic
name: Equity and buyouts
aliases:
- stock market
- shares
- hostile takeover
summary: Companies issue shares whose price tracks performance, and players buy them for profit or accumulate
  a majority to take control of rivals.
family: economy-finance
substrate:
- aggregate-stocks
- rule-system
definition: 'Owns each company''s share count, share price, and ownership table. Share price is recomputed
  from company value (cash, assets, earnings, debt) and moved by trading pressure, so purchases raise
  it and sales lower it. Players buy and sell shares in their own and rival companies for dividends or
  gains. Crossing an ownership threshold, usually a majority, transfers control: the target is merged,
  its assets absorbed, or its owner eliminated. Railroad Tycoon (1990) starts each railroad with $1 million
  split between equity and a loan and lets players trade shares in themselves and rivals in a miniature
  stock market. Offworld Trading Company (2016) makes buyouts the win condition: a player who loses majority
  control of their own company is eliminated, and the game warns a player when a rival can afford to buy
  them out without telling the rival. Capitalism (1995) makes being bought out by a competitor a loss,
  and Transport Tycoon sells rival company shares in 25% blocks.'
player_experience: Reading a rival's balance sheet as a target. The player buys a rival's stock while
  it is cheap, defends their own float by buying back shares, and feels dread when a competitor's cash
  nears the price of a takeover. Endgames become races to accumulate cash.
design_levers:
- share price formula (book value, earnings multiple, dividend yield, recent trading pressure)
- price impact per share bought or sold
- control thresholds and their consequences (merger, elimination, board control)
- restrictions on buying, such as minimum company age or share blocks
- dividends and buybacks as defensive tools
- visibility of who owns what and warnings before a takeover
failure_modes:
- A leading player can buy out weaker rivals early, ending the game before economic play matters.
- AI companies that do not defend their float become free takeover targets.
- Share prices driven only by book value can be gamed by moving cash into assets before a buyout.
dynamics:
- Owning shares of rivals turns their success into the player's dividends, softening competition into
  partial alliance.
- Late-game cash races emerge as players hoard money for buyouts instead of investing in production.
- Buying back one's own stock converts operating profit into takeover defense, starving expansion.
