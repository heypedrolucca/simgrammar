id: war-score-peace
type: mechanic
name: War score and peace terms
aliases:
- war score
- war exhaustion
- war support
- peace conference
summary: Each war tracks a score or exhaustion level from battles, occupation, and war goals, and that value caps what a peace
  settlement can demand or forces capitulation.
family: conflict-defense
substrate:
- aggregate-stocks
- rule-system
definition: >-
  Owns, for each active war, a score per side (or a shared balance) and the list of war goals, plus a menu of peace terms
  with a cost in score. Each update, battles won, regions occupied, and time spent holding the war goal add score, and casualties
  and occupation add exhaustion. A peace offer is accepted when its total cost is within the winner's score or when the loser's
  exhaustion or support crosses a capitulation threshold; otherwise the AI weighs score against demands. Europa Universalis
  IV prices each demand (provinces, gold, vassalage) in war score. Crusader Kings III lets an attacker enforce the war goal
  at full war score and allows white peace. Victoria 3 tracks war support that falls with exhaustion until a side capitulates.
  Hearts of Iron IV holds a peace conference in which winners spend points on demands in turns. In Stellaris a side at maximum
  war exhaustion can be forced into a status quo peace. Unlike faction-diplomacy, which decides whether factions go to war,
  this mechanic owns how a war ends and what the winner may take.
player_experience: >-
  Wars become negotiations with a running tally. The player fights for score as much as for ground, deciding when a battle
  or a siege is worth the cost and when to cash in. Bargaining over which provinces fit within the score turns the end of
  a war into a planning problem, and exhaustion forces the question of whether to sue for peace before the home front breaks.
design_levers:
- 'score sources and their weights: battles, occupation, blockades, holding the war goal'
- cost table for each peace term, and whether costs scale with the target's size
- exhaustion accumulation and its domestic effects such as unrest or lower production
- capitulation or forced-peace thresholds, and whether third parties join the settlement
- truce length after peace
failure_modes:
- Score dominated by occupation rewards sieging empty land over defeating armies.
- AI that refuses reasonable terms because of hidden acceptance factors makes wars drag on.
- Capitulation thresholds that trigger too early end wars before the strategic situation is resolved.
dynamics:
- Players carry out limited wars that take exactly what the score allows, then wait out the truce and return.
- Exhaustion couples military campaigns to stability and the economy, so long wars bleed the home front.
- Multi-party peace conferences produce partitions that set up later conflicts.
math_basis:
- game-theory
- mechanism-design
feedback: balancing
player_interface:
- choice-cards
- observation
legibility: 3
emergence_potential: 3
authoring_cost: 1
compute_cost: 1
tuning_difficulty: 3
ai_leverage: 3
maturity: established
open_questions:
- Can language-model negotiators bargain over peace terms in ways players find legible and hard to exploit?
- Would score models that weigh strategic outcomes rather than counts of occupied regions produce more plausible peace deals?
