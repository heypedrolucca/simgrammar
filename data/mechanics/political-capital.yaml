id: political-capital
type: mechanic
name: Political capital
aliases:
- action currency
- monarch points
- political power
- welfare currency
- unity
summary: An abstract governing currency accrues each period from leaders, factions, or population welfare and is
  spent on policy changes, edicts, and other state actions.
family: governance-policy
substrate:
- aggregate-stocks
definition: >-
  Owns one or more non-monetary stocks or capacities, each with a per-period income, an optional cap, and a price list of state
  actions. Income comes from the skill or loyalty of rulers and ministers, faction support, prestige, or satisfied
  population needs; spending buys discrete actions such as enacting or repealing a policy, issuing an edict,
  researching, raising stability, claiming territory, or rushing construction. Unlike a treasury, the stock usually
  cannot be borrowed or traded and its income comes from political or welfare state rather than economic activity,
  so it rations institutional change per period. Democracy 4 charges political capital, earned through loyal
  ministers, to introduce or cancel policies. Europa Universalis IV pays administrative, diplomatic, and military
  monarch points set by the ruler's skills, which buy technology among other things. Hearts of Iron IV spends
  political power on laws and ministers. Captain of Industry yields about 1 to 2 Unity per fully satisfied need per
  month, spent on edicts, outposts, quick builds, and emergency repairs. Policy-toggles owns the policies; this
  mechanic owns the currency that rations them.
player_experience: >-
  Every turn or month has a political budget. The player decides which reform is worth this period's points, saves
  up for a large one, and feels the quality of the ruler or cabinet as a faster or slower clock of change. Weak
  leaders and unhappy populations show up as a shortage of options rather than only as a penalty.
design_levers:
- income sources (ruler skill, minister loyalty, faction approval, satisfied needs) and their weights
- cap on the stock and whether overflow is lost
- one pool versus several (administrative, diplomatic, and military points)
- action prices relative to income, and whether prices scale with realm size or development
- banked stock versus a capacity that ongoing commitments draw against
- whether the currency converts to or from money
failure_modes:
- Hitting the cap with nothing worth buying wastes income and makes the currency invisible.
- Several parallel currencies with separate shops become spreadsheet optimization detached from the fiction.
- Income tied to leader skill makes one bad succession a long drought with few meaningful choices.
- Cheap actions let players toggle policies every period, undoing the rationing.
dynamics:
- Spending on stability or welfare raises future income, a reinforcing loop for well-run states.
- Players time large reforms for when income peaks, such as after a strong heir succeeds or the cabinet is loyal.
- Saving for expensive actions creates long-term plans that compete with spending to answer crises.
math_basis:
- system-dynamics
- optimization
feedback: both
player_interface:
- choice-cards
- parameter
legibility: 4
emergence_potential: 2
authoring_cost: 1
compute_cost: 1
tuning_difficulty: 3
ai_leverage: 2
maturity: established
open_questions:
- Could political capital be replaced by negotiated backing from simulated ministers or factions without losing
  the clarity of a single number?
- Does currency earned from welfare, as in Captain of Industry, make players value population needs differently
  from currency earned from leaders?
