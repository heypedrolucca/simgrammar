id: weather-coupled-grids
type: opportunity
name: Weather-coupled energy grids
summary: Power grids whose renewable supply follows realistic weather, so storage, forecasting, and demand
  response become the grid puzzle.
opportunity_type: mechanic-upgrade
thesis: 'Power grids and weather are both common in the catalog but almost never coupled; most games treat
  generation as constant. Learned weather emulators make realistic, correlated wind, sun, and temperature
  affordable, and the coupling creates a familiar modern problem: balancing intermittent supply with storage,
  forecasts, and flexible demand.'
design_sketch: Solar and wind output follow simulated weather; heating and cooling demand follow temperature;
  the player builds storage, buys forecasts, and sets demand-response policies. Rare long calm, cold spells
  test the grid. Prices respond to scarcity if the game has markets.
involves:
- power-grid
- weather
- forecasting
- supply-demand-pricing
- storage-capacity
applies:
- ml-weather-models
- simulation-based-inference
precedent:
- cities-skylines-2
- anno-1800
- timberborn
- surviving-mars
novelty: 3
feasibility: 4
impact: 2
horizon: 1-2y
key_risks:
- Realistic intermittency may frustrate players without good forecasting tools.
- Weather that dominates the economy reduces player agency.
validation_experiment: 'Couple a city prototype''s grid to a weather emulator and test whether players
  with forecast tools build mixed storage strategies rather than one dominant plant type. Success: strategy
  diversity increases and blackout frustration ratings stay below the baseline game''s disaster ratings.'
falsifiable_signal:
  prediction: A commercial city builder or management game will couple renewable generation to simulated
    weather as a core grid mechanic.
  resolve_by: '2028-12-31'
  criteria: Developer documentation describing weather-dependent renewable output and storage in the grid
    system.
