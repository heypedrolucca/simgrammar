id: salience-gated-llm-agents
type: opportunity
name: Salience-gated language agents
summary: Keep cheap utility scoring for every tick and call a language model only at salient moments,
  giving colony and life sims believable minds at a bounded cost.
opportunity_type: mechanic-upgrade
thesis: 'Rule-based utility agents are cheap and legible but repetitive; fully LLM-driven agents are expressive
  but cost tokens every decision and drift from game state. Most agent decisions in The Sims or RimWorld
  are routine (eat, sleep, haul) and need no language model. The memorable moments are rare: a breakup,
  a grudge, a mental break, a first meeting. A hybrid that reserves model calls for events above a salience
  threshold, and writes the result back as typed memories and relationship deltas, captures most of the
  believability at a small fraction of the cost. Small local models made this affordable in 2025; constrained
  decoding makes the write-back safe.'
design_sketch: 'Colonists run a standard needs-and-utility loop. When an event crosses a salience score
  (death of a friend, public insult, near-starvation), the agent gets one model call with its trait list,
  recent memories, and the event, and must return a schema-valid object: a thought with mood value and
  duration, an optional relationship change, an optional one-line spoken reaction, and an optional new
  goal. The player sees these as ordinary thoughts in the inspector, now specific to the colonist''s history.'
involves:
- utility-action-selection
- needs-decay
- memories-thoughts
- social-exchanges
- relationship-values
- personality-traits
applies:
