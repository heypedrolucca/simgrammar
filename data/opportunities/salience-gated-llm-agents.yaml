novelty: 3
feasibility: 4
impact: 4
horizon: now
key_risks:
- Generated thoughts that contradict visible state erode trust faster than generic thoughts do.
- Salience thresholds tuned for drama can flood the log in crisis states.
- Local model quality varies by hardware tier, creating uneven experiences.
validation_experiment: 'Build a 20-colonist prototype with a pure-utility baseline and a salience-gated
  variant capped at one model call per colonist per in-game hour. Run blind playtests (n>=30) rating believability
  and attachment, log tokens per player-hour, and count state-contradiction errors per hour. Success:
  believability gain of at least one point on a 7-point scale at under 2,000 tokens per player-hour with
  contradiction rate below one per hour.'
falsifiable_signal:
  prediction: At least three commercially released colony or life sims with over 1,000 Steam reviews will
    use language-model calls gated by event salience rather than per-decision.
  resolve_by: '2028-12-31'
  criteria: Developer documentation, postmortems, or mod-verified behavior showing model calls triggered
    by discrete events, in titles with more than 1,000 Steam reviews.
