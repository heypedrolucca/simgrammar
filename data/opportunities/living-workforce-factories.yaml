novelty: 3
feasibility: 4
impact: 3
horizon: now
key_risks:
- Workforce management can bury the logistics puzzle players came for.
- Agent counts at factory scale strain compute.
- Two audiences (automation and life-sim) may each find half the game unwanted.
validation_experiment: 'Prototype a small automation map where each machine needs a skilled operator drawn
  from a simulated population with aging and schooling; compare session length and self-reported attachment
  with a machines-only control. Success: longer sessions and higher attachment without lower throughput-puzzle
  ratings.'
falsifiable_signal:
  prediction: A factory or automation game where workers age, train, and are replaced by a simulated next
    generation will reach 1,000 Steam reviews.
  resolve_by: '2029-12-31'
  criteria: Steam page describing generational workforce mechanics in a factory or automation game with
    at least 1,000 reviews.
