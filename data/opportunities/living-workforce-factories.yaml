id: living-workforce-factories
type: opportunity
name: Factories with a living workforce
summary: Automation games whose workers age, learn, form families, and retire, so a production network
  is also a society that must be sustained across generations.
opportunity_type: new-genre
thesis: 'The white-space analysis shows production chains and agent lifecycles are both common yet almost
  never combined: factory games are run by machines or faceless workers, and games with aging, family-forming
  agents rarely have deep production. Colony sims and Workers & Resources sit closest. A factory whose
  throughput depends on a workforce with skills, schooling, households, and turnover couples the most-used
  rule-system in the catalog to the most attachment-generating ones. Salience-gated language agents make
  that workforce individually legible without per-tick cost.'
design_sketch: Machines need operators with trained skills; skilled workers age and retire; children of
  workers attend schools the player builds; housing, food, and morale affect shift output. A bottleneck
  can be a missing machine or a missing mentor. Generational play replaces the usual tech-tree endgame
  with succession planning for the workforce.
involves:
