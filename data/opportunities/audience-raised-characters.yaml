key_risks:
- If staff or votes can nudge outcomes, predictions read as rigged and the it-really-happened quality
  is lost.
- Authored sifting patterns limit predictions to storylines someone anticipated, and audiences learn
  the templates.
- Points that can be bought or cashed out may fall under gambling regulation in some jurisdictions.
- Small casts may resolve too few interesting predictions per week to sustain an audience.
validation_experiment: 'Run one persistent cast of 5 to 10 characters in a causal-bookkeeping simulation
  for 30 days with at least 200 participants. Offer 10 authored prediction patterns per week, resolved
  only by the sifter, with no interventions. Compare four-week retention and character-directed messages
  between participants who predict and a control group who see the same chronicle and recaps without
  predictions, and survey whether participants accept each resolution as correct. Success: predictors
  retain at least 1.5 times as well as controls and at least 90 percent of resolutions are accepted.'
falsifiable_signal:
  prediction: A released game or character experience will let its audience predict storylines of autonomous
    simulated characters, with predictions scored automatically against the simulation's record of what
    happened.
  resolve_by: '2029-06-30'
  criteria: Feature first shipped after 2026-10-28 in a title with at least 1,000 Steam user reviews or
    a console release, or in a service whose developer reports at least 100,000 users; developer material
    states that audience predictions about simulated characters are resolved automatically from simulation
    events, not chosen by staff or by vote.
