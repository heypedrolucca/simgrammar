id: audience-raised-characters
type: opportunity
name: Audience-predicted character storylines
aliases:
- community-raised characters
- storyline prediction markets
summary: Let an audience predict what will happen to autonomous simulated characters, and resolve each
  prediction automatically by story sifting over the simulation's causal record, so spectators become
  curators of a world they do not steer.
opportunity_type: new-mechanic
thesis: 'Ryan''s curationist account of emergent narrative argues that successful systemic games work
  because people do the curation: players of Dwarf Fortress and The Sims notice and retell the stories
  their simulations produce. His dissertation ends by proposing curation support tools that help people
  find those stories instead of replacing them. Story sifting with causal bookkeeping makes a storyline
  a checkable object: a pattern either matches the recorded causal graph or it does not. That turns a
  prediction about a character (she will forgive her rival before winter; his scheme will end in exposure)
  into something the simulation can settle on its own. An audience that predicts, watches, and is scored
  against what actually happened has a reason to follow characters closely, and because nothing steers
  the world toward the predicted outcome, the stories keep the quality Ryan identifies as the pleasure
  of emergent narrative: they really happened.'
design_sketch: 'A small cast of persistent characters lives in a symbolic simulation that records causal
  links between actions. Each week the game opens a slate of predictions written as sifting patterns over
  a future window, phrased in plain language (Will the feud between A and B end in reconciliation or
  revenge?). Viewers stake points; the simulation runs untouched; when the window closes, the sifter
  checks the chronicle and pays out, and a narrator recounts the matched storyline with links to the
  actions that resolved it. Correct predictors gain standing with the characters involved, which characters
  can learn about and mention, so being right about someone becomes part of the relationship. Players
  can also propose new prediction patterns, and accepted ones join the shared library.'
