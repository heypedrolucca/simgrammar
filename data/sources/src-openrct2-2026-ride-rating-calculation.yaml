notes: Ride-independent excitement, intensity, and nausea terms from max positive, negative, and lateral
  g, drops (excitement capped at 9), highest drop, inversions (capped at 6), and scenery within 5 tiles
  of the station (0.05 each, max 47); excitement cut 25% above intensity 10 with further steps at 11,
  12, 13.2, 14.5; lateral g penalties at 2.8 and 3.1. Page notes it is incomplete.
