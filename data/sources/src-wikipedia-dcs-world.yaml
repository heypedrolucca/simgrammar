notes: 'Eagle Dynamics study sim; clickable cockpits; engines, fuel, electrical, hydraulic, radios modeled.
  Black Shark (Ka-50) first of three standalone titles, 2008-2011; DCS World open beta May 2012; free
  with two aircraft and two maps, paid modules. Lua mission editor; user-hosted PvE and PvP servers. Training
  use: USAF 355th Training Squadron (A-10C), French Air Force (M-2000C), Ukrainian pilots (A-10C II, F-16C).
  F-16C: Professional Flight Model, fly-by-wire FCS. 2.7 (April 2021) new weather and clouds; improved
  damage models over time.'
