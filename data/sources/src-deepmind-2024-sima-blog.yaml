notes: 600 basic skills; nine commercial games (Valheim, Teardown, No Man's Sky, Wobbly Life, Satisfactory,
  Goat Simulator 3, Hydroneer, Space Engineers, Eco) plus four research environments. Generalist outperformed
  per-game specialists; held-out-game agent nearly matched specialist. Tasks about 10 seconds; no multi-step
  strategic planning.
