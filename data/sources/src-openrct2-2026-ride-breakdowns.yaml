notes: GPL-3.0 reimplementation of RollerCoaster Tycoon 2. Reliability starts at 100% and drops every 256 ticks
  by the ride's unreliability factor plus an age penalty (one-eighth of it in year 1 up to double after 8 years);
  breakdown chance rises with reliability lost; weighted breakdown types, brake failure more likely in rain; inspection
  interval set by the player; repair restores reliability in proportion to its deficit.
