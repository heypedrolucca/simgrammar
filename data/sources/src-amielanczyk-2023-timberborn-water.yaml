notes: Single-layer 2D water model adapted from erosion simulation; tiles linked to four neighbors by virtual pipes; ticks
  every couple of hundred ms; water levels equalize; evaporation; recurring droughts grow harsher and ramp source strength
  down early; hard-coded dam values avoided because they caused oscillations; moisture falls off per tile and sharply uphill.
