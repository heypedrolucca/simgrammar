notes: Raid points = (wealth points + pawn points) x threat scale x starting factor x adaptation factor, capped
  at 10,000, minimum 35. Storyteller wealth counts items, creatures, and 50% of buildings; wealth points 0 at 14,000
  up to 4,200 at 1,000,000; 15-200 points per colonist; threat scale 0.1-2.2 by preset; starting factor 0.7 through
  day 10; adaptation factor about 0.4-1.47, lowered by deaths and downings.
