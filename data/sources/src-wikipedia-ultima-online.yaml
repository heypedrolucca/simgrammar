notes: Origin Systems, Electronic Arts, 1997-09-24; lead designer Raph Koster. Skill-based progression with no levels
  or classes; persistent player housing; craft-based player-driven economy; unrestricted PvP at launch; Trammel/Felucca
  split with Renaissance (2000); item insurance (2003); planned artificial-life ecology removed in beta because
  players killed creatures faster than they spawned; first MMORPG to reach 100,000 subscribers.
