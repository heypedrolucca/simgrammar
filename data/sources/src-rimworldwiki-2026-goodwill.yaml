notes: Faction goodwill -100 to 100; hostile at -75 or below, ally at 75 or above until it drops to 0; civil outlanders drift
  into -50..50 (0.4 per day down, 0.2 up); returning a prisoner +12; trade +1 per 500 silver; gifts +1 per 40-160 silver;
