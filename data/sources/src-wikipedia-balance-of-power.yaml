notes: Chris Crawford, Mindscape; Macintosh 1985 (infobox November, body September); ports to MS-DOS, Amiga, Atari
  ST, Apple II, PC-88, PC-98, MSX, Windows. Player leads US or USSR for eight one-year turns, maximizes prestige
  points, answers crises with no action, diplomatic notes, or military maneuvers; backing down costs prestige; escalation
  can trigger nuclear war, which ends the game. Compared with Ketchledge's Geopolitique 1990.
