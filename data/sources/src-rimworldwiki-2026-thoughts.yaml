notes: 'Memory thoughts list mood effect, expiry in days, stack limit, and stack multiplier (mostly 0.75). Examples: Colonist
  lost 6 days, 5 stacks; My son died -20 for 30 days; My friend died -10 for 20 days, scaled by relation; expectations +18
  (low) to -12 (royal); lavish meal +12, raw food -7; some traits nullify thoughts.'
