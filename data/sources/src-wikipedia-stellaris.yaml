notes: Paradox Development Studio, Paradox Interactive. PC 2016-05-09; PS4 and Xbox One 2019-02-26. Procedural galaxies
  linked by hyperlanes; start 2200, default 300-year campaign, highest score wins. Pops in worker, specialist, and
  ruler strata fill jobs from districts and buildings; eight ethics on four axes; factions produce unity; galactic
  crises. Fahraeus named Star Control II, Master of Orion II, and EU4 as influences.
