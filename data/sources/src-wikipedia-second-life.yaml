notes: Linden Lab, public launch 2003-06-23; viewers for Windows, macOS, Linux. Described as a platform with no
  set objective. Prims (linked sets up to 256) and imported mesh; Linden Scripting Language runs server-side; Havok
  physics; regions 256 by 256 m on a dedicated core, 40 avatars on mainland and 100 on private islands; users keep
  copyright; Linden Dollar and LindeX exchange; Marketplace about 2.1 million items; peak concurrency 88,200 in
  2009.
