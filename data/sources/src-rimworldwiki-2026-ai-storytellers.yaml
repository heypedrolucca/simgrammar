notes: Storytellers weigh colony wealth, colonist and animal counts, recent deaths or wounds, and time since the
  last major event. Incident chance = base chance x population-intent factor (8.0 at 0 colonists falling to -1.0
  at 20). Cassandra escalates in cycles, Phoebe leaves longer gaps, Randy follows no pattern and has a 0.20 minimum
  factor.
