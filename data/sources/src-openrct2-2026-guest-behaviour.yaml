notes: GPL-3.0 reimplementation of RollerCoaster Tycoon 2. Guests reject rides below minimum or above maximum preferred intensity
  (both widened by happiness), above nausea tolerance (300, 600, 800, 1000 plus happiness), or priced above twice value (value
  quartered in pay-to-enter parks); rejections create thoughts and lower happiness; guests with no ride left head home.
