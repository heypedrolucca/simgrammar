notes: Rooms enclosed by walls, doors, vents, coolers, or natural rock; max 36 map regions or 5,184 tiles;
  roles scored from contents (dining 12 per table, workshop 27 per workbench, bedroom invalid with more
  than one unassigned bed); beauty = total beauty / weighted size (size if >40, else 20 + size/2); impressiveness
  combines wealth, beauty, space, and cleanliness with log scaling and min-weighting.
