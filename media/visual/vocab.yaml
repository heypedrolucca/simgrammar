# The visual vocabulary (ADR-0006): one entry per icon in media/visual/icons/<id>.svg.
#
# kind says what the id names. mechanic, family, subgenre, and technique-category ids are the dataset's own ids, and
# their labels come from the record or vocab term. noun and term entries are drawn subjects the scripts mention that
# are not records (a refrigerator, a raid); they carry a label, and aliases the renderer matches in narration to move
# a frame's highlight. Every subject is generic: no game's art, logo, cover, character, or UI (E041 checks the names).
# run is the run that drew the icon; an entry without one was drawn by the file-level run.
